name: ci

on:
  push:
  pull_request:

jobs:
  lint-vet-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23'
          cache: true
      - name: go mod download
        run: go mod download
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6.5.2
        with:
          version: v1.64.8
      - name: go test (unit, -short, -race)
        # -race is load-bearing here: the codebase carries an extensive
        # race-fix history and several tests whose only assertion is that
        # `go test -race` stays clean (e.g. internal/filter/network/chain_test.go
        # "the 28.1b race surface must be EMPTY", sdsfile debounce-race group).
        # Without -race those tests are vacuous in CI.
        run: go test -short -race ./...

  differential:
    needs: lint-vet-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23'
          cache: true
      - name: docker available
        run: docker version
      - name: go mod download
        run: go mod download
      - name: differential suite
        # The -timeout must exceed the WHOLE suite's wall time, not one fixture's.
        # It was set to 5m at phase 00, when the corpus was a single fixture. The
        # corpus is now 120 fixtures and the suite outgrew that budget: the last
        # green run (2026-06-29, 91 fixtures) finished the job in 5m23s, i.e.
        # already at the edge, and every run since has died on
        # `panic: test timed out after 5m0s` — a month of red master, always with
        # the suite still healthy and simply unfinished (it was mid-fixture, ~72
        # of 120, with zero FAILs recorded).
        #
        # 20m is deliberately generous rather than fitted: a runner is slower and
        # noisier than a dev box, the reference image is pulled cold on CI, and an
        # over-large timeout costs nothing on a green run while an under-sized one
        # is exactly the bug being fixed here. It still bounds a genuine hang.
        # Re-check this when the corpus grows substantially.
        run: go test ./test/differential/... -timeout 20m -v
      - name: h2spec conformance (phase 85 / ADR-0307)
        # The repaired 95-case strict gate (was 53/53 under nine silently
        # no-op slash-form selectors since 2026-04-25 — ADR-0307). Joins this
        # job because docker + testcontainers are already proven here; the
        # gate's internal timeouts (5m overall / 3m container,
        # h2spec_test.go) sit inside this job's 30-minute cap alongside the
        # ~6.5-minute differential suite. Measured deterministic at n=3
        # locally (95/90/1/4 identical, 5 ms inner spread); a CI-side flake,
        # if one ever appears, is a recordable finding, not a license to
        # unenroll silently.
        run: go test ./test/conformance/h2spec/ -timeout 5m -v
    # Bound the job itself too: without this a hung suite would occupy a runner
    # for GitHub's 6-hour default instead of failing fast.
    timeout-minutes: 30

  fuzz-smoke:
    needs: lint-vet-test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # One short engine run per riskiest parser. The seed corpora already run
      # as ordinary unit tests under `go test ./...`; this job additionally
      # drives the mutation engine briefly to surface NEW crashers on the
      # attacker-reachable parse surfaces (config, HTTP/2 codec, access-log
      # format strings, TLS context, wire codecs). Each target is bounded so
      # the whole matrix stays well under a couple of minutes.
      matrix:
        include:
          - { pkg: internal/bootstrap,                 target: FuzzBootstrapLoad }      # bootstrap config (ADR-0018)
          - { pkg: internal/filter/hcm,                target: FuzzHCMConfigParse }     # HCM typed_config
          - { pkg: internal/accesslog,                 target: FuzzAccessLogFormat }    # access-log format strings
          - { pkg: internal/filter/hcm/h2,             target: FuzzHPACKDecode }        # HTTP/2 HPACK decode
          - { pkg: internal/filter/hcm/h2,             target: FuzzFrameStream }        # HTTP/2 frame stream
          - { pkg: internal/tls,                       target: FuzzTLSContextParse }    # TLS context config
          - { pkg: internal/filter/network/kafkabroker, target: FuzzKafkaDecode }       # Kafka wire codec
          - { pkg: internal/filter/network/mongoproxy,  target: FuzzMongoDecode }       # Mongo/BSON wire codec
          - { pkg: internal/filter/network/redisproxy,  target: FuzzRESPDecode }        # RESP wire codec
          - { pkg: internal/xds,                        target: FuzzDiscoveryResponseParse } # SDS Secret parse (phases 60/65/66 trust boundary)
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23'
          cache: true
      - name: go mod download
        run: go mod download
      - name: fuzz ${{ matrix.target }} (30s budget)
        run: go test ./${{ matrix.pkg }}/ -run=^$ -fuzz=^${{ matrix.target }}$ -fuzztime=30s
