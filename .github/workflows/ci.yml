name: ci

on:
  push:
  pull_request:

jobs:
  lint-vet-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23'
          cache: true
      - name: go mod download
        run: go mod download
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6.5.2
        with:
          version: v1.64.8
      - name: go test (unit, -short)
        run: go test -short ./...

  differential:
    needs: lint-vet-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23'
          cache: true
      - name: docker available
        run: docker version
      - name: go mod download
        run: go mod download
      - name: differential suite
        run: go test ./test/differential/... -timeout 5m -v

  fuzz-bootstrap:
    needs: lint-vet-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23'
          cache: true
      - name: go mod download
        run: go mod download
      - name: fuzz bootstrap loader (30s budget, ADR-0018)
        run: go test ./internal/bootstrap/ -fuzz=FuzzBootstrapLoad -fuzztime=30s -run=^$
