admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: {{.AdminPort}} }
static_resources:
  listeners:
    - name: l_main
      address:
        socket_address: { address: 0.0.0.0, port_value: {{.ListenerPort}} }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP1
                stat_prefix: ingress_http
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: vh_default
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/scenario1" }
                          route: { cluster: c_backend }
                        - match: { prefix: "/scenario2" }
                          route: { cluster: c_backend }
                          typed_per_filter_config:
                            envoy.filters.http.fault:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.fault.v3.HTTPFault
                              delay:
                                percentage: { numerator: 100, denominator: HUNDRED }
                                fixed_delay: 0.1s
                              abort:
                                percentage: { numerator: 100, denominator: HUNDRED }
                                http_status: 503
                        - match: { prefix: "/scenario3-wholesale" }
                          route: { cluster: c_backend }
                          typed_per_filter_config:
                            envoy.filters.http.fault:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.fault.v3.HTTPFault
                              abort:
                                percentage: { numerator: 100, denominator: HUNDRED }
                                http_status: 418
                        - match: { prefix: "/scenario3-baseline" }
                          route: { cluster: c_backend }
                        - match: { prefix: "/scenario4" }
                          route: { cluster: c_backend }
                          typed_per_filter_config:
                            envoy.filters.http.fault:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.fault.v3.HTTPFault
                              abort:
                                percentage: { numerator: 100, denominator: HUNDRED }
                                http_status: 503
                              headers:
                                - name: x-fault-on
                                  string_match: { exact: "yes" }
                http_filters:
                  - name: envoy.filters.http.fault
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.fault.v3.HTTPFault
                      delay:
                        percentage: { numerator: 100, denominator: HUNDRED }
                        fixed_delay: 0.1s
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: c_backend
      type: STATIC
      connect_timeout: 0.25s
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: c_backend
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: 127.0.0.1, port_value: {{.BackendPort}} }
