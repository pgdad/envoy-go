# envoy-go subject bootstrap for fixture 0026-http-lua-headers-bridge.
#
# Per phase 22 parent SPEC §8 + AMEND-10 + AMEND-11 + phase 22.1 SPEC §9 +
# Task 14 PLAN. Same six-listener topology as envoy.yaml — one listener
# per wire-interactive scenario (a)..(f); each listener carries an
# envoy.filters.http.lua HTTP filter consuming Lua.default_source_code
# via the DataSource.Filename arm pointing at a per-scenario .lua source
# file. The script paths are host-side absolute paths under the fixture
# directory's scripts/ subdirectory (envoy-go runs on the host directly
# + has read access to the fixture tree without any bind-mount step).
#
# Scenario routing:
#   l_test_a (port {{.LATestPort}})  — {{.FixtureDir}}/scripts/a_add_header.lua
#   l_test_b (port {{.LBTestPort}})  — {{.FixtureDir}}/scripts/b_replace_header.lua
#   l_test_c (port {{.LCTestPort}})  — {{.FixtureDir}}/scripts/c_remove_header.lua
#   l_test_d (port {{.LDTestPort}})  — {{.FixtureDir}}/scripts/d_respond.lua
#   l_test_e (port {{.LETestPort}})  — {{.FixtureDir}}/scripts/e_log_only.lua
#   l_test_f (port {{.LFTestPort}})  — {{.FixtureDir}}/scripts/f_headers_iter.lua
#
# Boot-reject path (scenario (g)): when the driver's BootRejectScript()
# is queried by the runner's runBootRejectFixture branch, the driver
# splices the g_compile_error.lua host path into ALL six listener script
# slots. envoy-go's lua filter PARSE-REJECTs at config-load via §6.2
# arm 16; cmd/envoy-go/main.go's log.Fatalf at line 67 exits non-zero
# with stderr containing the wording `"script load error"` per the
# Task-15-pinned wrapping (parent §13-W).
#
# Backend host: envoy-go runs as a subprocess on the host loopback, so
# the cluster targets 127.0.0.1:<BackendPort> directly (no docker
# translation). Mirrors phase-04/05/14/15/16 envoy-go.yaml precedent
# (the BackendHost template substitution differs between ref and subj —
# host.docker.internal for ref vs 127.0.0.1 for subj).
#
# Templating: rendered by the driver's mustRender() at SubjectConfig
# time. Substitution keys:
#   {{.AdminPort}}    — admin endpoint port (subject; runner-allocated).
#   {{.LATestPort}}   — l_test_a listener port (= subjListenerPort).
#   {{.LBTestPort}}   — l_test_b listener port (= subjListenerPort + 1).
#   {{.LCTestPort}}   — l_test_c listener port (= subjListenerPort + 2).
#   {{.LDTestPort}}   — l_test_d listener port (= subjListenerPort + 3).
#   {{.LETestPort}}   — l_test_e listener port (= subjListenerPort + 4).
#   {{.LFTestPort}}   — l_test_f listener port (= subjListenerPort + 5).
#   {{.BackendPort}}  — echobackend port (runner-allocated; 127.0.0.1 host).
#   {{.ScriptA}}      — host-side absolute path to a_add_header.lua.
#   {{.ScriptB}}      — host-side absolute path to b_replace_header.lua.
#   {{.ScriptC}}      — host-side absolute path to c_remove_header.lua.
#   {{.ScriptD}}      — host-side absolute path to d_respond.lua.
#   {{.ScriptE}}      — host-side absolute path to e_log_only.lua.
#   {{.ScriptF}}      — host-side absolute path to f_headers_iter.lua.
admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: {{.AdminPort}} }

static_resources:
  listeners:
    # === l_test_a (scenario a) — add fixed header ===
    - name: l_test_a
      address: { socket_address: { address: 0.0.0.0, port_value: {{.LATestPort}} } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP1
                stat_prefix: hcm_a
                route_config:
                  name: rc_a
                  virtual_hosts:
                    - name: vh_a
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: c_backend }
                http_filters:
                  - name: envoy.filters.http.lua
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                      stat_prefix: scenario_a
                      default_source_code:
                        filename: "{{.ScriptA}}"
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

    # === l_test_b (scenario b) — replace user-agent header ===
    - name: l_test_b
      address: { socket_address: { address: 0.0.0.0, port_value: {{.LBTestPort}} } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP1
                stat_prefix: hcm_b
                route_config:
                  name: rc_b
                  virtual_hosts:
                    - name: vh_b
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: c_backend }
                http_filters:
                  - name: envoy.filters.http.lua
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                      stat_prefix: scenario_b
                      default_source_code:
                        filename: "{{.ScriptB}}"
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

    # === l_test_c (scenario c) — remove header ===
    - name: l_test_c
      address: { socket_address: { address: 0.0.0.0, port_value: {{.LCTestPort}} } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP1
                stat_prefix: hcm_c
                route_config:
                  name: rc_c
                  virtual_hosts:
                    - name: vh_c
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: c_backend }
                http_filters:
                  - name: envoy.filters.http.lua
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                      stat_prefix: scenario_c
                      default_source_code:
                        filename: "{{.ScriptC}}"
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

    # === l_test_d (scenario d) — :respond() short-circuit (403/denied) ===
    - name: l_test_d
      address: { socket_address: { address: 0.0.0.0, port_value: {{.LDTestPort}} } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP1
                stat_prefix: hcm_d
                route_config:
                  name: rc_d
                  virtual_hosts:
                    - name: vh_d
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: c_backend }
                http_filters:
                  - name: envoy.filters.http.lua
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                      stat_prefix: scenario_d
                      default_source_code:
                        filename: "{{.ScriptD}}"
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

    # === l_test_e (scenario e) — log-only pass-through ===
    - name: l_test_e
      address: { socket_address: { address: 0.0.0.0, port_value: {{.LETestPort}} } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP1
                stat_prefix: hcm_e
                route_config:
                  name: rc_e
                  virtual_hosts:
                    - name: vh_e
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: c_backend }
                http_filters:
                  - name: envoy.filters.http.lua
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                      stat_prefix: scenario_e
                      default_source_code:
                        filename: "{{.ScriptE}}"
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

    # === l_test_f (scenario f) — headers iteration count ===
    - name: l_test_f
      address: { socket_address: { address: 0.0.0.0, port_value: {{.LFTestPort}} } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP1
                stat_prefix: hcm_f
                route_config:
                  name: rc_f
                  virtual_hosts:
                    - name: vh_f
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: c_backend }
                http_filters:
                  - name: envoy.filters.http.lua
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                      stat_prefix: scenario_f
                      default_source_code:
                        filename: "{{.ScriptF}}"
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: c_backend
      type: STATIC
      connect_timeout: 0.25s
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: c_backend
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: 127.0.0.1, port_value: {{.BackendPort}} }
