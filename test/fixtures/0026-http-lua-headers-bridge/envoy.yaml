# Reference Envoy bootstrap for fixture 0026-http-lua-headers-bridge.
#
# Per phase 22 parent SPEC §8 + AMEND-10 + AMEND-11 + phase 22.1 SPEC §9 +
# Task 14 PLAN. Six-listener topology (one listener per wire-interactive
# scenario (a)..(f)); each listener carries an `envoy.filters.http.lua`
# HTTP filter that consumes `Lua.default_source_code` via the
# `DataSource.Filename` arm pointing at a per-scenario `.lua` source
# file. The shared upstream cluster `c_backend` proxies the SHARED
# echobackend helper (test/helpers/echobackend/cmd/echobackend) which
# reflects request headers as JSON in the response body — needed for the
# driver's `classifyBody` of scenarios (a)/(b)/(c)/(f) where the
# Lua-mutated header set is asserted via the reflected JSON.
#
# Scenario routing:
#   l_test_a (port {{.LATestPort}})  — scripts/a_add_header.lua
#   l_test_b (port {{.LBTestPort}})  — scripts/b_replace_header.lua
#   l_test_c (port {{.LCTestPort}})  — scripts/c_remove_header.lua
#   l_test_d (port {{.LDTestPort}})  — scripts/d_respond.lua (short-circuit)
#   l_test_e (port {{.LETestPort}})  — scripts/e_log_only.lua (pass-through)
#   l_test_f (port {{.LFTestPort}})  — scripts/f_headers_iter.lua
#
# Boot-reject path (scenario (g)): when the driver's BootRejectScript()
# is queried by the runner's runBootRejectFixture branch, the driver
# splices the g_compile_error.lua container path into ALL six listener
# script slots (any one of the six will trigger the compile-time PARSE-
# REJECT at config load; the listener bind never happens).
#
# scripts/ subdirectory bind-mount discipline (mirrors fixture-0019 PKI
# mount + ADR-0010 host.docker.internal pattern): the driver implements
# fixture.ReferenceLogMounter to bind-mount each host-side .lua file
# under test/fixtures/0026-http-lua-headers-bridge/scripts/<scenario>.lua
# into the container at /scripts/<scenario>.lua. The template's
# {{.ScriptX}} substitutions are container-side absolute paths. envoy-go
# (subject) runs on the host directly + consumes the host-side scripts/
# subdirectory paths via {{.FixtureDir}}/scripts/<scenario>.lua (see
# envoy-go.yaml). The Filename DataSource arm at compile-time reads the
# Lua source byte-exact on both sides, so cross-side byte-equivalence of
# the per-stream Lua dispatch holds for scenarios (a)-(f).
#
# Templating: rendered by the driver's mustRender() at ReferenceBootstrap
# time. Substitution keys:
#   {{.AdminPort}}    — admin endpoint port (reference container; 9901).
#   {{.LATestPort}}   — l_test_a listener port (10026 per fixture convention).
#   {{.LBTestPort}}   — l_test_b listener port (10026 + 1).
#   {{.LCTestPort}}   — l_test_c listener port (10026 + 2).
#   {{.LDTestPort}}   — l_test_d listener port (10026 + 3).
#   {{.LETestPort}}   — l_test_e listener port (10026 + 4).
#   {{.LFTestPort}}   — l_test_f listener port (10026 + 5).
#   {{.BackendHost}}  — echobackend host (host.docker.internal per ADR-0010).
#   {{.BackendPort}}  — echobackend port (runner-allocated).
#   {{.ScriptA}}      — container-side absolute path to a_add_header.lua.
#   {{.ScriptB}}      — container-side absolute path to b_replace_header.lua.
#   {{.ScriptC}}      — container-side absolute path to c_remove_header.lua.
#   {{.ScriptD}}      — container-side absolute path to d_respond.lua.
#   {{.ScriptE}}      — container-side absolute path to e_log_only.lua.
#   {{.ScriptF}}      — container-side absolute path to f_headers_iter.lua.
#
# Cluster c_backend: STRICT_DNS to host.docker.internal:<BackendPort> per
# ADR-0010 (reference Envoy reaches host-spawned echobackend via the
# docker bridge). dns_lookup_family: V4_ONLY per phase-14/15/16 precedent.
admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: {{.AdminPort}} }

static_resources:
  listeners:
    # === l_test_a (scenario a) — add fixed header ===
    - name: l_test_a
      address: { socket_address: { address: 0.0.0.0, port_value: {{.LATestPort}} } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP1
                stat_prefix: hcm_a
                route_config:
                  name: rc_a
                  virtual_hosts:
                    - name: vh_a
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: c_backend }
                http_filters:
                  - name: envoy.filters.http.lua
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                      stat_prefix: scenario_a
                      default_source_code:
                        filename: "{{.ScriptA}}"
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

    # === l_test_b (scenario b) — replace user-agent header ===
    - name: l_test_b
      address: { socket_address: { address: 0.0.0.0, port_value: {{.LBTestPort}} } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP1
                stat_prefix: hcm_b
                route_config:
                  name: rc_b
                  virtual_hosts:
                    - name: vh_b
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: c_backend }
                http_filters:
                  - name: envoy.filters.http.lua
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                      stat_prefix: scenario_b
                      default_source_code:
                        filename: "{{.ScriptB}}"
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

    # === l_test_c (scenario c) — remove header ===
    - name: l_test_c
      address: { socket_address: { address: 0.0.0.0, port_value: {{.LCTestPort}} } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP1
                stat_prefix: hcm_c
                route_config:
                  name: rc_c
                  virtual_hosts:
                    - name: vh_c
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: c_backend }
                http_filters:
                  - name: envoy.filters.http.lua
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                      stat_prefix: scenario_c
                      default_source_code:
                        filename: "{{.ScriptC}}"
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

    # === l_test_d (scenario d) — :respond() short-circuit (403/denied) ===
    - name: l_test_d
      address: { socket_address: { address: 0.0.0.0, port_value: {{.LDTestPort}} } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP1
                stat_prefix: hcm_d
                route_config:
                  name: rc_d
                  virtual_hosts:
                    - name: vh_d
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: c_backend }
                http_filters:
                  - name: envoy.filters.http.lua
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                      stat_prefix: scenario_d
                      default_source_code:
                        filename: "{{.ScriptD}}"
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

    # === l_test_e (scenario e) — log-only pass-through ===
    - name: l_test_e
      address: { socket_address: { address: 0.0.0.0, port_value: {{.LETestPort}} } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP1
                stat_prefix: hcm_e
                route_config:
                  name: rc_e
                  virtual_hosts:
                    - name: vh_e
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: c_backend }
                http_filters:
                  - name: envoy.filters.http.lua
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                      stat_prefix: scenario_e
                      default_source_code:
                        filename: "{{.ScriptE}}"
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

    # === l_test_f (scenario f) — headers iteration count ===
    - name: l_test_f
      address: { socket_address: { address: 0.0.0.0, port_value: {{.LFTestPort}} } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP1
                stat_prefix: hcm_f
                route_config:
                  name: rc_f
                  virtual_hosts:
                    - name: vh_f
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: c_backend }
                http_filters:
                  - name: envoy.filters.http.lua
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                      stat_prefix: scenario_f
                      default_source_code:
                        filename: "{{.ScriptF}}"
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: c_backend
      type: STRICT_DNS
      connect_timeout: 0.25s
      lb_policy: ROUND_ROBIN
      dns_lookup_family: V4_ONLY
      load_assignment:
        cluster_name: c_backend
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: {{.BackendHost}}, port_value: {{.BackendPort}} }
