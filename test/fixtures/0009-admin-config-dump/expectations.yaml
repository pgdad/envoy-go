# Phase 08.1 fixture 0009-admin-config-dump — expectations
#
# This file is prose, not machine-evaluated (per ADR-0019). The runner
# enforces the assertions described below via the driver's ProbeAdmin
# canonicalisation + the runner's CompareBytes pass on the canonicalised
# scrape results.
#
# Asserted equivalence (per SPEC §7.1 (refined per Task 14 iter-2 to
# structural-projection assertion shape per ADR-0086 EmitUnpopulated:true
# consequence) + ADR-0086 + ADR-0087 + ADR-0088, refined per planner-time
# decision 8 in PLAN §"Planner-time deferred-decision resolution"):
#
# The four per-endpoint canonicalisers in driver/driver.go each project
# the body down to a narrow assertion shape rather than apply per-field
# allow-listing to the full body. The projection captures the load-
# bearing equivalence claim and discards surrounding noise (notably
# the proto-default enum-string divergences induced by ADR-0086's
# EmitUnpopulated:true marshal posture across deeply-nested admin/v3
# proto fields, which would otherwise require ~40 allow-list entries
# to handle uniformly across /config_dump and /server_info). This is
# the same correctness discipline used by phase 06.1 for
# /stats/prometheus (twin-series filter discipline).
#
#   /config_dump (per ADR-0086; canonicaliseConfigDump):
#     - body parsed as JSON; projected to {configs_types, static_listeners,
#       static_clusters} where configs_types is intersected to the three
#       envoy-go-emitted envelope types (BootstrapConfigDump,
#       ListenersConfigDump, ClustersConfigDump) so reference Envoy's
#       additional envelopes (Routes / Secrets / Endpoints /
#       ScopedRoutes — all deferred per ADR-0089) are filtered to the
#       envoy-go-emitted subset.
#     - projection structurally drops the §13.2 allow-listed paths:
#       bootstrap.node.user_agent_name, bootstrap.node.user_agent_build_version,
#       bootstrap.node.extensions[], configs[*].last_updated.
#     - asserted: three sub-envelopes in order on the configs_types list
#       (BootstrapConfigDump first, ListenersConfigDump second,
#       ClustersConfigDump third); static_listeners[] populated with one
#       entry (l_main); static_clusters[] populated with one entry
#       (c_backend with 2 endpoints — endpoint count asserted separately
#       via /clusters per-endpoint lines).
#
#   /clusters (per ADR-0087, refined by planner-time decision 8;
#              canonicaliseClusters):
#     - body parsed into (cluster, key, value) tuple set with two
#       normalisations:
#       (i) the 8 per-endpoint cx_*/rq_* counter tuples are DROPPED on
#           both sides before set comparison (planner-time decision 8 —
#           envoy-go emits 0 for all 8; Envoy emits per-endpoint observed
#           values; the gap is intentional and codified);
#       (ii) the per-endpoint address suffix is STRIPPED from the tuple
#            key so 127.0.0.1:18001 (subj loopback bind) and
#            host.docker.internal:18001 (ref bridge resolution) converge
#            to a single tuple per endpoint key, AND the `hostname` field-
#            key is dropped on both sides because Envoy's STRICT_DNS
#            resolution emits `host.docker.internal` while envoy-go's
#            STATIC bind emits empty.
#     - per-endpoint key allow-set: hostname (dropped per (ii)),
#       health_flags, weight, region, zone, sub_zone, canary, priority,
#       success_rate, local_origin_success_rate.
#     - cluster-level key allow-set (10): observability_name,
#       default_priority::max_connections, default_priority::max_pending_requests,
#       default_priority::max_requests, default_priority::max_retries,
#       high_priority::max_connections, high_priority::max_pending_requests,
#       high_priority::max_requests, high_priority::max_retries,
#       added_via_api.
#     - asserted: the canonicalised set of (cluster, key, value) tuples
#       matches across sides; cluster ordering (alphabetical-by-name) is
#       inherent in the canonicaliser's sort step.
#
#   /listeners (per ADR-0087; canonicaliseListeners):
#     - body parsed line-by-line; the address suffix after the first
#       `::` is STRIPPED so only the listener name remains per line.
#       This sheds the cross-side address discrepancy (subj is host-
#       loopback 127.0.0.1:<ephemeral>; ref is container-internal
#       0.0.0.0:<refContainerListenerPort>) without requiring a framing-
#       aware diff (the runner's existing dechunk preprocessor still
#       handles the upstream transfer-encoding: chunked).
#     - asserted: name-only line set is byte-equal across sides;
#       alphabetical ordering inherent in the canonicaliser's sort step.
#
#   /server_info (per ADR-0088; canonicaliseServerInfo):
#     - body parsed as JSON; projected to {state: <enum string>}.
#     - projection structurally drops the §13.2 allow-listed paths:
#       version, uptime_current_epoch, uptime_all_epochs,
#       hot_restart_version, command_line_options.* (entire subtree),
#       node.user_agent_name, node.user_agent_build_version,
#       node.extensions[].
#     - asserted: state field byte-equal ("LIVE" on both sides).
#
# Not asserted (allow-listed structurally):
#   - Date / Server / Content-Length / Content-Type / Transfer-Encoding —
#     per the existing helpers / differential allow-list in
#     BEHAVIOR_CONTRACT.md ## Header allow-list. The driver's ProbeAdmin
#     does NOT include headers in the canonicalised byte stream.
#
# Per planner-time decision 4: the four new endpoints are NOT gated on
# MarkReady. The driver waits 200ms after the 5-request load completes
# before scraping the four endpoints; both proxies will be in LIVE state
# by then (envoy-go is post-MarkReady; reference Envoy is post-init). No
# pre-MarkReady scrape is exercised by this fixture.
#
# Per planner-time decision 7: /config_dump's three sub-envelope walks
# read from the bootstrap proto directly (NOT from the listener/cluster
# managers' runtime state). This makes the body deterministic and
# detached from any post-boot state changes.
