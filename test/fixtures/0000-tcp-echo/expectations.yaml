  access-log:
    applicable: false
    reason: subject does not emit access logs in phase 00
  stats:
    applicable: false
    reason: subject does not emit stats in phase 00
  xds:
    applicable: false
    reason: static config; no xDS in phase 00
  timing:
    applicable: false
    reason: timing not opt-in for echo fixture
