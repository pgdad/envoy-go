# Equivalence dimensions for fixture 0000-tcp-echo.
# Every dimension from BOOTSTRAP_PROMPT.md §7.2 (also captured in
# docs/envoy-go/BEHAVIOR_CONTRACT.md) is enumerated. Phase 00's diff is
# byte-exact on response-body only; the rest are not-applicable for this
# fixture and explicitly justified.

dimensions:
  response-status:
    applicable: true
    rule: exact
    scope: admin-/ready
  response-body:
    applicable: true
    rule: byte-exact
    scope: tcp-echo + admin-/ready
  response-headers:
    applicable: true
    rule: set-equal-modulo-allow-list
    scope: admin-/ready
    allow-list: BEHAVIOR_CONTRACT.md § "Admin API — /ready"
  response-trailers:
    applicable: false
    reason: no trailers on /ready; no HTTP layer on TCP path
  http2-http3-framing:
    applicable: false
    reason: admin is HTTP/1.1; TCP has no framing
  access-log:
    applicable: false
    reason: phase 01 does not emit access logs (phase 06)
  stats:
    applicable: false
    reason: phase 01 does not emit stats (phase 06)
  xds:
    applicable: false
    reason: static config; no xDS
  timing:
    applicable: false
    reason: not opt-in
