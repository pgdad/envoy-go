# Reference Envoy bootstrap for fixture 0028-http-lua-multi-script-and-per-route.
#
# Phase 22.3 IMPL Task 5 — CROSS-SIDE multi-listener fixture exercising the
# NEW 22.3 lua surface: `source_codes` named-script registry +
# `typed_per_filter_config` LuaPerRoute (3-arm override: name / source_code /
# disabled). Modeled on fixture-0027's MultiListenerDriver + ReferenceHostMounts
# + host.docker.internal backend reach (ADR-0010).
#
# 6-listener topology — one listener per cross-side scenario:
#
#   l_test_a  (port {{.LATestPort}})  — default_source_code only; route NO per-route
#                                       → default.lua runs → x-lua-script=default      (scenario a)
#   l_test_b  (port {{.LBTestPort}})  — source_codes{named_a,named_b}+default; route
#                                       LuaPerRoute{name:named_a} → x-lua-script=named_a (scenario b)
#   l_test_b2 (port {{.LB2TestPort}}) — source_codes+default; route
#                                       LuaPerRoute{name:ghost} (dangling) → SILENT NO-OP
#                                       → x-lua-script ABSENT (AMEND-22.3-1)            (scenario b dangling)
#   l_test_c  (port {{.LCTestPort}})  — default_source_code; route
#                                       LuaPerRoute{source_code:override.lua}
#                                       → x-lua-script=override                         (scenario c)
#   l_test_d  (port {{.LDTestPort}})  — default_source_code; route
#                                       LuaPerRoute{disabled:true} → hooks skipped
#                                       → x-lua-script ABSENT (default does NOT run)    (scenario d)
#   l_test_e  (port {{.LETestPort}})  — source_codes{named_a,named_b}+default; route
#                                       LuaPerRoute{name:named_b} → x-lua-script=named_b (scenario e:
#                                       distinct registry entry vs l_test_b's named_a)
#
# Shared upstream cluster c_backend (STRICT_DNS to host.docker.internal per
# ADR-0010) → echobackend subprocess reflects request headers as JSON. The
# driver classifies the reflected x-lua-script header per scenario. All 6
# scenarios are CROSS-SIDE byte-exact via CompareBytes — deterministic header
# mutations only (no :timestamp / :httpCall / non-deterministic API).
#
# Script paths are container-side absolute paths under /scripts/ (bind-mounted
# from the host fixture's scripts/ subdir via the driver's ReferenceHostMounts
# hook per fixture-0026/0027 precedent).
admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: {{.AdminPort}} }

static_resources:
  listeners:
    # === l_test_a (scenario a) — listener default; route NO per-route config ===
    - name: l_test_a
      address: { socket_address: { address: 0.0.0.0, port_value: {{.LATestPort}} } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP1
                stat_prefix: hcm_a
                route_config:
                  name: rc_a
                  virtual_hosts:
                    - name: vh_a
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: c_backend }
                http_filters:
                  - name: envoy.filters.http.lua
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                      stat_prefix: scenario_a
                      default_source_code:
                        filename: "{{.ScriptDefault}}"
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

    # === l_test_b (scenario b) — source_codes registry; route name:named_a ===
    - name: l_test_b
      address: { socket_address: { address: 0.0.0.0, port_value: {{.LBTestPort}} } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP1
                stat_prefix: hcm_b
                route_config:
                  name: rc_b
                  virtual_hosts:
                    - name: vh_b
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: c_backend }
                          typed_per_filter_config:
                            envoy.filters.http.lua:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.LuaPerRoute
                              name: named_a
                http_filters:
                  - name: envoy.filters.http.lua
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                      stat_prefix: scenario_b
                      default_source_code:
                        filename: "{{.ScriptDefault}}"
                      source_codes:
                        named_a:
                          filename: "{{.ScriptNamedA}}"
                        named_b:
                          filename: "{{.ScriptNamedB}}"
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

    # === l_test_b2 (scenario b dangling) — source_codes; route name:ghost (absent key) ===
    - name: l_test_b2
      address: { socket_address: { address: 0.0.0.0, port_value: {{.LB2TestPort}} } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP1
                stat_prefix: hcm_b2
                route_config:
                  name: rc_b2
                  virtual_hosts:
                    - name: vh_b2
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: c_backend }
                          typed_per_filter_config:
                            envoy.filters.http.lua:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.LuaPerRoute
                              name: ghost
                http_filters:
                  - name: envoy.filters.http.lua
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                      stat_prefix: scenario_b2
                      default_source_code:
                        filename: "{{.ScriptDefault}}"
                      source_codes:
                        named_a:
                          filename: "{{.ScriptNamedA}}"
                        named_b:
                          filename: "{{.ScriptNamedB}}"
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

    # === l_test_c (scenario c) — default; route source_code inline override ===
    - name: l_test_c
      address: { socket_address: { address: 0.0.0.0, port_value: {{.LCTestPort}} } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP1
                stat_prefix: hcm_c
                route_config:
                  name: rc_c
                  virtual_hosts:
                    - name: vh_c
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: c_backend }
                          typed_per_filter_config:
                            envoy.filters.http.lua:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.LuaPerRoute
                              source_code:
                                filename: "{{.ScriptOverride}}"
                http_filters:
                  - name: envoy.filters.http.lua
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                      stat_prefix: scenario_c
                      default_source_code:
                        filename: "{{.ScriptDefault}}"
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

    # === l_test_d (scenario d) — default; route disabled:true (default skipped) ===
    - name: l_test_d
      address: { socket_address: { address: 0.0.0.0, port_value: {{.LDTestPort}} } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP1
                stat_prefix: hcm_d
                route_config:
                  name: rc_d
                  virtual_hosts:
                    - name: vh_d
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: c_backend }
                          typed_per_filter_config:
                            envoy.filters.http.lua:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.LuaPerRoute
                              disabled: true
                http_filters:
                  - name: envoy.filters.http.lua
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                      stat_prefix: scenario_d
                      default_source_code:
                        filename: "{{.ScriptDefault}}"
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

    # === l_test_e (scenario e) — source_codes registry; route name:named_b ===
    - name: l_test_e
      address: { socket_address: { address: 0.0.0.0, port_value: {{.LETestPort}} } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP1
                stat_prefix: hcm_e
                route_config:
                  name: rc_e
                  virtual_hosts:
                    - name: vh_e
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: c_backend }
                          typed_per_filter_config:
                            envoy.filters.http.lua:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.LuaPerRoute
                              name: named_b
                http_filters:
                  - name: envoy.filters.http.lua
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                      stat_prefix: scenario_e
                      default_source_code:
                        filename: "{{.ScriptDefault}}"
                      source_codes:
                        named_a:
                          filename: "{{.ScriptNamedA}}"
                        named_b:
                          filename: "{{.ScriptNamedB}}"
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: c_backend
      type: STRICT_DNS
      connect_timeout: 0.25s
      lb_policy: ROUND_ROBIN
      dns_lookup_family: V4_ONLY
      load_assignment:
        cluster_name: c_backend
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: {{.BackendHost}}, port_value: {{.BackendPort}} }
