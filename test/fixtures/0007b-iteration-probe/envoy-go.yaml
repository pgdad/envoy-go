# Phase 07.1 fixture 0007b-iteration-probe — subject (envoy-go) bootstrap.
#
# This is a TEMPLATE: the driver's SubjectConfig hook templates the admin
# port, listener port, and backend port via fmt.Sprintf before passing to
# envoy-go. The on-disk file is checked in for documentation parity
# (matching fixture 0007a's envoy-go.yaml + envoy.yaml pair) — the driver's
# subjectTmpl constant is the load-bearing one.
#
# Filter chain: [envoy.filters.http.envoy_go_test, envoy.filters.http.router].
# - envoy.filters.http.envoy_go_test is the test-only probe filter (Task 19;
#   ADR-0074); its hand-rolled proto schema (Task 19's
#   internal/filter/http/envoygotest/proto/envoygotest.pb.go) is registered
#   in protoregistry.GlobalTypes via init() so protojson round-trips this
#   typed_config without explicit caller wiring.
# - envoy.filters.http.router is the terminal filter (Task 11 migration of
#   the phase-04 routerAction).
#
# Per-route typed_per_filter_config[envoy.filters.http.envoy_go_test] =
# EnvoyGoTestPerRoute{count: 7} drives the encode-side header injection
# x-envoy-go-test-route-count: 7 on every response per filter_test.go.
admin:
  address:
    socket_address: { address: 127.0.0.1, port_value: 9901 }
static_resources:
  listeners:
    - name: l_h1
      address:
        socket_address: { address: 127.0.0.1, port_value: 15007 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP1
                stat_prefix: ingress_http
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: vh_default
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: c_backend }
                          typed_per_filter_config:
                            envoy.filters.http.envoy_go_test:
                              "@type": type.googleapis.com/envoy.filters.http.envoy_go_test.v0.EnvoyGoTestPerRoute
                              count: 7
                http_filters:
                  - name: envoy.filters.http.envoy_go_test
                    typed_config:
                      "@type": type.googleapis.com/envoy.filters.http.envoy_go_test.v0.EnvoyGoTest
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: c_backend
      type: STATIC
      connect_timeout: 0.25s
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: c_backend
        endpoints:
          - lb_endpoints:
              - endpoint: { address: { socket_address: { address: 127.0.0.1, port_value: 18007 } } }
