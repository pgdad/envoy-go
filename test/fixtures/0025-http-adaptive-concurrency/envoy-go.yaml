# envoy-go bootstrap for fixture 0025-http-adaptive-concurrency.
#
# Per phase-21 SPEC §7 + AMEND-6 + Task 10 brief. The fixture is
# REFERENCE-LESS (RequiresReference: false) per the phase-20 oauth2 +
# phase-07.1 iteration-probe single-directory precedent. The AMEND-6
# cross-side byte-exact promise for scenario (b) is deferred to a
# future cross-side extension per the Task 10 PROGRESS.md note
# (RATIFIED-PENDING-FUTURE-CROSS-SIDE-EXTENSION); envoy-go-side byte-
# exact pinning of the 503 + 25-byte body + content-type: text/plain
# still lands at scenario (b) per AMEND-6 wire-shape invariants — only
# the cross-side comparison is deferred.
#
# Listener topology (3 listeners, one per filter-config variant; the
# driver issues per-scenario requests against the appropriate
# listener):
#
#   l_a_default — Gradient-1 default config (no min_concurrency override
#                 so the SPEC §6.1 default minConcurrency=3 applies;
#                 default maxConcurrencyLimit=1000; enabled=true via
#                 default_value:true). Exercises scenario (a) parse_ok
#                 (single GET / → 200) and scenario (c) stat_surface
#                 (driver scrapes /stats and asserts the 7-name surface
#                 with concurrency_limit=3 + min_rtt_calculation_active=1
#                 per AMEND-2 C4 first-tick semantics).
#   l_b_overflow — min_concurrency=1 + max_concurrency_limit=1 +
#                  concurrency_limit_exceeded_status code:ServiceUnavailable.
#                  Initial concurrency_limit = minConcurrency = 1.
#                  Exercises scenario (b) overflow_503 — 2 concurrent
#                  GET /slow requests cause the second to be rejected
#                  with a 503 + "reached concurrency limit" body per
#                  AMEND-6 byte-pinned wire shape.
#   l_d_disabled — `enabled` field ABSENT (filter OFF per AMEND-4
#                  REFUTATION default). Exercises scenario (d)
#                  pass_through_when_disabled (single GET / → 200,
#                  rq_blocked=0, the filter never consults the
#                  controller).
#
# Templating: rendered by the driver's mustRender() at SubjectConfig
# time. Substitution keys:
#   {{.AdminPort}}     — admin endpoint port (subject).
#   {{.LADefaultPort}} — l_a_default listener port (= subjListenerPort).
#   {{.LBOverflowPort}} — l_b_overflow listener port (= subjListenerPort+1).
#   {{.LDDisabledPort}} — l_d_disabled listener port (= subjListenerPort+2).
#   {{.BackendPort}}   — HTTPSlowStream backend port (runner-allocated).
#
# YAML-to-proto note: `wrapperspb.UInt32Value` fields (max_concurrency_
# limit / min_concurrency / request_count) take a BARE scalar in YAML
# (per the phase-13 fixture-0015 `max_request_bytes: 1048576`
# precedent — protojson decodes wrapper-typed fields from bare scalars,
# NOT from `{value: N}` nested objects). The `typev3.Percent` fields
# (sample_aggregate_percentile / jitter / buffer) take a nested
# `{value: <double>}` form because Percent is a plain message with a
# `double value = 1` field. The `BoolValue` for `enabled.default_value`
# takes a bare bool per the same wrapper-decoding rule.
admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: {{.AdminPort}} }

static_resources:
  listeners:
    # === l_a_default — default Gradient-1 config (scenarios a + c) ===
    - name: l_a_default
      address: { socket_address: { address: 0.0.0.0, port_value: {{.LADefaultPort}} } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP1
                stat_prefix: hcm_a_default
                route_config:
                  name: rc_a_default
                  virtual_hosts:
                    - name: vh_a_default
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: c_backend }
                http_filters:
                  - name: envoy.filters.http.adaptive_concurrency
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.adaptive_concurrency.v3.AdaptiveConcurrency
                      gradient_controller_config:
                        sample_aggregate_percentile:
                          value: 50
                        concurrency_limit_params:
                          concurrency_update_interval: 0.1s
                        min_rtt_calc_params:
                          interval: 30s
                          request_count: 50
                          jitter:
                            value: 15
                          min_concurrency: 3
                          buffer:
                            value: 25
                      enabled:
                        default_value: true
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

    # === l_b_overflow — min=max=1 + 503 status (scenario b) ===
    - name: l_b_overflow
      address: { socket_address: { address: 0.0.0.0, port_value: {{.LBOverflowPort}} } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP1
                stat_prefix: hcm_b_overflow
                route_config:
                  name: rc_b_overflow
                  virtual_hosts:
                    - name: vh_b_overflow
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: c_backend }
                http_filters:
                  - name: envoy.filters.http.adaptive_concurrency
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.adaptive_concurrency.v3.AdaptiveConcurrency
                      gradient_controller_config:
                        sample_aggregate_percentile:
                          value: 50
                        concurrency_limit_params:
                          max_concurrency_limit: 1
                          concurrency_update_interval: 0.1s
                        min_rtt_calc_params:
                          interval: 30s
                          request_count: 50
                          jitter:
                            value: 15
                          min_concurrency: 1
                          buffer:
                            value: 25
                      enabled:
                        default_value: true
                      concurrency_limit_exceeded_status:
                        code: ServiceUnavailable
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

    # === l_d_disabled — `enabled` ABSENT (filter OFF per AMEND-4) ===
    # The driver verifies the pass-through path: no 503, no rq_blocked
    # increment, controller is never consulted (cc.enabled == false at
    # decode_headers.go leg 1).
    - name: l_d_disabled
      address: { socket_address: { address: 0.0.0.0, port_value: {{.LDDisabledPort}} } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP1
                stat_prefix: hcm_d_disabled
                route_config:
                  name: rc_d_disabled
                  virtual_hosts:
                    - name: vh_d_disabled
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: c_backend }
                http_filters:
                  - name: envoy.filters.http.adaptive_concurrency
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.adaptive_concurrency.v3.AdaptiveConcurrency
                      gradient_controller_config:
                        sample_aggregate_percentile:
                          value: 50
                        concurrency_limit_params:
                          concurrency_update_interval: 0.1s
                        min_rtt_calc_params:
                          interval: 30s
                          request_count: 50
                          jitter:
                            value: 15
                          min_concurrency: 3
                          buffer:
                            value: 25
                      # `enabled` field intentionally ABSENT per AMEND-4
                      # (filter OFF default) — exercises scenario (d)'s
                      # decode_headers.go leg-1 pass-through.
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: c_backend
      type: STATIC
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: c_backend
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: 127.0.0.1
                      port_value: {{.BackendPort}}
