# Fixture 0008-listener-chain-match — reference (Envoy v1.37.2) — primary variant.
#
# Same dual-listener / 3-chain + default_filter_chain shape as `envoy-go.yaml`.
# Per ADR-0010 the reference Envoy runs in a Docker container and reaches host
# backends via `host.docker.internal` with `dns_lookup_family: V4_ONLY` (the
# subject uses `STATIC` clusters at `127.0.0.1`; that is the only structural
# divergence permitted between the two bootstraps). Per ADR-0028 the reference
# container is launched with `--concurrency 1` so that per-worker LB state
# does not introduce non-determinism into the differential gate.
#
# Driver-rendered placeholders (sprintf-style — see Task 16 driver/driver.go):
#   - admin port_value          (= 9901, container fixed)
#   - l_test_a port_value       (= 15008, container fixed — Task 16
#                                ReferenceListenerPort())
#   - l_test_b port_value       (= 15009, container fixed — Task 16
#                                ReferenceListenerPorts()[1])
#   - chain_dstport_alpha.destination_port (= 15008 — must match l_test_a port)
#   - chain_srcprefix_loopback.source_ports[0] (= known_driver_port — driver
#                                                pre-allocates)
#   - 4 backend port_values (host.docker.internal — runner-rendered)
admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: 9901 }
static_resources:
  listeners:
    - name: l_test_a
      address:
        socket_address: { address: 0.0.0.0, port_value: 15008 }
      filter_chains:
        - name: chain_dstport_alpha
          filter_chain_match:
            destination_port: 15008                            # = l_test_a port
          filters:
            - name: envoy.filters.network.tcp_proxy
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
                stat_prefix: tcp_dstport
                cluster: c_dstport
        - name: chain_srcprefix_loopback
          filter_chain_match:
            source_prefix_ranges:
              - { address_prefix: 127.0.0.1, prefix_len: 32 }
            source_ports: [0]                                  # = known_driver_port — driver-rendered
          filters:
            - name: envoy.filters.network.tcp_proxy
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
                stat_prefix: tcp_srcprefix
                cluster: c_srcprefix
        - name: chain_other
          filter_chain_match: {}
          filters:
            - name: envoy.filters.network.tcp_proxy
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
                stat_prefix: tcp_other
                cluster: c_other
      default_filter_chain:
        name: chain_default
        filters:
          - name: envoy.filters.network.tcp_proxy
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
              stat_prefix: tcp_default
              cluster: c_default
    - name: l_test_b
      address:
        socket_address: { address: 0.0.0.0, port_value: 15009 }
      filter_chains:
        - name: chain_dstport_alpha
          filter_chain_match:
            destination_port: 15008                            # = l_test_a port (same value as on l_test_a's chain)
          filters:
            - name: envoy.filters.network.tcp_proxy
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
                stat_prefix: tcp_dstport
                cluster: c_dstport
        - name: chain_srcprefix_loopback
          filter_chain_match:
            source_prefix_ranges:
              - { address_prefix: 127.0.0.1, prefix_len: 32 }
            source_ports: [0]                                  # = known_driver_port — driver-rendered
          filters:
            - name: envoy.filters.network.tcp_proxy
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
                stat_prefix: tcp_srcprefix
                cluster: c_srcprefix
        - name: chain_other
          filter_chain_match: {}
          filters:
            - name: envoy.filters.network.tcp_proxy
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
                stat_prefix: tcp_other
                cluster: c_other
      default_filter_chain:
        name: chain_default
        filters:
          - name: envoy.filters.network.tcp_proxy
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
              stat_prefix: tcp_default
              cluster: c_default
  clusters:
    - name: c_dstport
      type: STRICT_DNS
      connect_timeout: 1s
      dns_lookup_family: V4_ONLY     # ADR-0010
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: c_dstport
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: host.docker.internal, port_value: 0 }   # backend 1 — runner-rendered
    - name: c_srcprefix
      type: STRICT_DNS
      connect_timeout: 1s
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: c_srcprefix
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: host.docker.internal, port_value: 0 }   # backend 2 — runner-rendered
    - name: c_other
      type: STRICT_DNS
      connect_timeout: 1s
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: c_other
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: host.docker.internal, port_value: 0 }   # backend 3 — runner-rendered
    - name: c_default
      type: STRICT_DNS
      connect_timeout: 1s
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: c_default
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: host.docker.internal, port_value: 0 }   # backend 4 — runner-rendered
