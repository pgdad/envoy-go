# Reference Envoy bootstrap for fixture 0091-stats-sink-metrics-service-labels.
#
# Single-listener plaintext H1 topology (phase 47.2b — the emit_tags_as_labels
# knob on the landed 47.1/47.2a metrics_service stats-sink). One downstream HTTP/1.1
# listener routes every request to the HTTPFixedBody backend (cluster
# {{.BackendName}}). A bootstrap-level stats_sinks[] metrics_service entry
# (transport_api_version V3, emit_tags_as_labels:true) names the c_metrics
# cluster — a driver-owned in-process MetricsService gRPC receiver — and a SHORT
# stats_flush_interval (500ms) drives fast deterministic convergence. Under the
# labels knob each stat name is split per the statsd SN tag rules into a RESIDUAL
# dotted name plus a set of metric[].label[] LabelPairs (keyed by the dotted
# tag-name envoy.<tag>); the COUNTER value stays the CUMULATIVE absolute (== K
# after K 2xx requests). Every flush the reference snapshots its stats registry
# and streams it as io.prometheus.client.MetricFamily protos.
#
# Templating: rendered by the driver's mustRender() at ReferenceBootstrap time.
# Substitution keys:
#   {{.AdminPort}}    — admin endpoint port (hard-coded 9901 by driver).
#   {{.ListenerPort}} — l_test in-container port (10091 per fixture convention).
#   {{.BackendHost}}  — HTTPFixedBody backend host (host.docker.internal per ADR-0010).
#   {{.BackendPort}}  — HTTPFixedBody backend port (runner-allocated).
#   {{.BackendName}}  — backend cluster name (FIXED identical both sides → the
#                       envoy.cluster_name LabelPair value on the residual
#                       cluster.upstream_rq_total family).
#   {{.StatPrefix}}   — HCM stat_prefix (FIXED identical both sides → the
#                       envoy.http_conn_manager_prefix LabelPair value on the
#                       residual http.downstream_rq_* families).
#   {{.MetricsHost}}  — driver-owned MetricsService receiver host
#                       (host.docker.internal for the reference container).
#   {{.MetricsPort}}  — driver-owned MetricsService receiver port (driver-allocated;
#                       the in-process metricsservice.Server binds 0.0.0.0:<port>
#                       before the container starts).
#   {{.NodeID}}       — bootstrap node id (FIXED identical both sides → the
#                       StreamMetricsMessage.identifier.node.id).
#   {{.NodeCluster}}  — bootstrap node cluster (FIXED identical both sides).
#
# Cluster type: STRICT_DNS so the reference Envoy container resolves
# host.docker.internal (the Docker bridge host alias per ADR-0010).
# dns_lookup_family: V4_ONLY per the established fixture precedent.
node:
  id: {{.NodeID}}
  cluster: {{.NodeCluster}}

admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: {{.AdminPort}} }

# Bootstrap-level stats sink: the metrics_service gRPC sink. transport_api_version
# V3 (the reference HARD-REJECTS a deprecated non-V3 value). emit_tags_as_labels
# true → each stat name is split into a RESIDUAL dotted name + metric[].label[]
# LabelPairs (keyed by the dotted tag-name envoy.<tag>); COUNTER values stay
# cumulative-absolute. grpc_service.envoy_grpc names the c_metrics cluster (h2c).
# A SHORT stats_flush_interval (500ms) drives fast deterministic convergence (vs the 5s default).
stats_sinks:
  - name: envoy.stat_sinks.metrics_service
    typed_config:
      "@type": type.googleapis.com/envoy.config.metrics.v3.MetricsServiceConfig
      transport_api_version: V3
      emit_tags_as_labels: true
      grpc_service:
        envoy_grpc:
          cluster_name: c_metrics
stats_flush_interval: 0.5s

static_resources:
  listeners:
    - name: l_test
      address: { socket_address: { address: 0.0.0.0, port_value: {{.ListenerPort}} } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP1
                stat_prefix: {{.StatPrefix}}
                route_config:
                  name: rc_test
                  virtual_hosts:
                    - name: vh_test
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: {{.BackendName}} }
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    # backend: HTTPFixedBody subprocess (17-byte fixed body) reached via
    # host.docker.internal from the reference Envoy container per ADR-0010.
    - name: {{.BackendName}}
      type: STRICT_DNS
      connect_timeout: 1s
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: {{.BackendName}}
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: {{.BackendHost}}, port_value: {{.BackendPort}} }
    # c_metrics: driver-owned in-process MetricsService gRPC receiver.
    # MANDATORY http2_protocol_options: {} for gRPC framing. Plaintext h2c — no TLS
    # (D-MS-RECEIVER-WIRING). STRICT_DNS so the container can resolve the bridge hostname.
    - name: c_metrics
      type: STRICT_DNS
      connect_timeout: 1s
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: c_metrics
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: {{.MetricsHost}}, port_value: {{.MetricsPort}} }
