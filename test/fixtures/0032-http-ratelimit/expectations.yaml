# Phase 24.1 + 24.2 fixture 0032 expectations (per ADR-0019 — prose; the driver
# enforces). NINE scenarios per parent SPEC §7.1 — 24.1 scope a/b/c/d-core/e/h
# EXTENDED at 24.2 Task 6 with scenarios (f1/f2/f3 = vh_inclusion 3 sub-rows)
# + (g = x_ratelimit_headers) + (d) extended to all 10 framework-reachable
# actions (minus destination_cluster — framework-limited at master tip).
#
# Topology (per parent SPEC §7.3 single-listener + envoy-go single-vhost
# canonical at internal/filter/hcm/config.go; ADR-0166 plaintext h2c rls
# cluster):
#
#   l_test_a (hcm_a)
#     domain: domain_b
#     enable_x_ratelimit_headers: DRAFT_VERSION_03 (24.2 Task 6 — exercised by (g) only)
#     response_headers_to_add: [{key: x-from-config, value: filtercfg}] (24.2 Task 6)
#     failure_mode_deny: false (AMEND-3 proto-zero default)
#     rate_limit_service.grpc_service.envoy_grpc.cluster_name: c_ratelimit
#
#   c_backend      — synthetic always-200 echobackend subprocess (reused from
#                    the shared test/helpers/echobackend; Task 9 wiring).
#   c_ratelimit    — in-process gRPC RateLimitService fake on a driver-
#                    allocated pre-bound 127.0.0.1:<port> (per the 0021
#                    extauthzgrpc.NewAtAddr precedent); the cluster carries
#                    the mandatory http2_protocol_options:{} for gRPC framing.
#
#   Bootstrap node.cluster: rls_test_cluster (24.2 — feeds source_cluster
#                    action in scenario (d) extension).
#
#   Single virtual_host vh_a (domains: ["*"]) per envoy-go's HCM constraint
#   (single-vh canonical). The vhost carries a vhost-level rate_limits
#   emitting generic_key{vh:vh_a} — Phase 24.2 ADDITION; consumed by the (f)
#   sub-scenarios via §4.3 Axis-B composition. The 24.1 scenarios (b/c/d/e)
#   + (g) all carry their own route-level rate_limits ⇒ OVERRIDE-default vh
#   SKIP arm fires ⇒ vh-policy is INVISIBLE on 24.1 scenarios. Scenario (a)
#   carries vh_rate_limits=IGNORE TPFC to preserve 24.1 zero-descriptor
#   semantics.
#
# Reference Envoy v1.37.2 (STRICT_DNS via host.docker.internal) vs envoy-go
# (STATIC, in-process on host loopback).
#
# Per parent SPEC §7.1 the cross-side gate is CompareBytes on the driver's
# emitted per-scenario byte stream (status + body-classification, plus the
# X-RateLimit triple byte-pin on scenario g). Subject-side counter assertions
# for scenario (h) live in StatsAsserter.AssertStats per
# reference_differential_asserter_dispatch (the runner's runFixture
# dispatch only invokes SubjectAsserter on the reference-less path; this
# fixture is cross-side ⇒ SubjectAsserter is NEVER called; subject-side
# assertions MUST go through StatsAsserter).
#
# ## Scenario matrix (24.1 + 24.2 combined)
#
# Scenario (a) parse_ok — subject-only structural via cross-side byte stream.
#   Request:  GET /scenario_a on l_test_a.
#   Route:    NO rate_limits[] + typed_per_filter_config[ratelimit].vh_rate_limits=IGNORE
#             → vhost SKIPPED → zero-descriptor short-circuit at the
#             ratelimit filter (DecodeHeaders Continue).
#   Both sides: 200 + echo body. The driver emits
#             "scenario a status=200 body=ok" into the cross-side byte
#             stream; CompareBytes confirms byte-equivalence.
#   Counter impact: none (RLS not called).
#
# Scenario (b) ok_admit — cross-side byte-exact.
#   Request:  GET /scenario_b on l_test_a.
#   Descriptors: [{scenario:b}] (single-action generic_key policy;
#             OVERRIDE-default vh-skip arm fires since route is non-empty).
#   RLS script: domain_b|scenario=b → OK (AMEND-6: per-descriptor OK
#               status; no per-descriptor optionals set).
#   Both sides: 200 + echo body. CompareBytes on
#               "scenario b status=200 body=ok".
#   Counter impact: cluster.c_ratelimit.ratelimit.ok +1 (per side).
#
# Scenario (c) over_limit_429 — cross-side byte-exact.
#   Request:  GET /scenario_c on l_test_a.
#   Descriptors: [{scenario:c}].
#   RLS script: domain_b|scenario=c → OVER_LIMIT (proto-number-faithful,
#               AMEND-6: no RawBody, no Quota, no per-descriptor optionals;
#               OverallCode=OVER_LIMIT + per-descriptor OVER_LIMIT statuses).
#   Both sides: 429 + empty body + x-envoy-ratelimited:true header
#               (AMEND-8 header [a] — emitted because
#               disable_x_envoy_ratelimited_header is false / absent)
#               + x-from-config: filtercfg (24.2 filter-config addition).
#               NO X-RateLimit triple (the statuses do NOT carry
#               current_limit ⇒ buildXRateLimitHeaders returns ok=false).
#   Driver byte stream: "scenario c status=429 body=ok" — body=ok signals
#               an empty body (no RawBody on the scripted response).
#   Counter impact: cluster.c_ratelimit.ratelimit.over_limit +1 (per side).
#
# Scenario (d) descriptor_actions — cross-side byte-exact (9 actions; 24.2 EXTENDED).
#   Request:  GET /scenario_d?region=us-east&plan=premium on l_test_a with
#             x-tenant: tenant-x, x-canary: true headers.
#   Route metadata: filter_metadata.envoy.filters.http.ratelimit.tier: gold
#               (consumed by metadata action's ROUTE_ENTRY source path).
#   Bootstrap: node.cluster: rls_test_cluster (consumed by source_cluster action).
#   Descriptors: [{
#       scenario=d,                          (generic_key)             [24.1]
#       tenant=tenant-x,                     (request_headers)          [24.1]
#       remote_address=127.0.0.1,            (remote_address)           [24.1]
#       header_match=canaried,               (header_value_match)       [24.1]
#       source_cluster=rls_test_cluster,     (source_cluster)           [24.2]
#       masked_remote_address=127.0.0.0/24,  (masked_remote_address)    [24.2]
#       tier=gold,                           (metadata ROUTE_ENTRY)     [24.2]
#       region=us-east,                      (query_parameters)         [24.2]
#       query_match=premium_plan             (query_parameter_value_match) [24.2]
#   }]
#   AMEND-6 action-list order is load-bearing: the fake's CanonicalKey
#   carries entries in the order the engine appended them.
#   RLS script: domain_b|scenario=d;tenant=tenant-x;remote_address=127.0.0.1;
#               header_match=canaried;source_cluster=rls_test_cluster;
#               masked_remote_address=127.0.0.0/24;tier=gold;region=us-east;
#               query_match=premium_plan → OK.
#   Both sides: 200 + echo body. CompareBytes on
#               "scenario d status=200 body=ok".
#   Counter impact: cluster.c_ratelimit.ratelimit.ok +1 (per side).
#   NOTE: destination_cluster is INTENTIONALLY EXCLUDED from this chain
#         per Task 7 framework-limitation note (no MatchedClusterName()
#         accessor on DecoderFilterCallbacks at master tip → engine drops
#         any descriptor whose chain includes the action under empty
#         cluster-name input). A future framework primitive may close
#         this gap.
#
# Scenario (e) failure_mode_open — cross-side byte-exact.
#   Setup:    driver STOPS the RLS fake BEFORE issuing the request
#             (this happens AFTER all other scenarios per the 24.2
#             probe-order change — (e) is the LAST probe).
#   Request:  GET /scenario_e on l_test_a.
#   Descriptors: [{scenario:e}].
#   RLS dial: fails fast on loopback connection-refused → applyError arm
#             with failure_mode_deny:false (the AMEND-3 default) →
#             increment error + failure_mode_allowed → ContinueDecoding
#             (fail-open admit).
#   Both sides: 200 + echo body. CompareBytes on
#               "scenario e status=200 body=ok".
#   Counter impact:
#     cluster.c_ratelimit.ratelimit.error                +1 (per side)
#     cluster.c_ratelimit.ratelimit.failure_mode_allowed +1 (per side)
#   Driver does NOT restart the fake — scenario (h) is OBSERVATIONAL (no
#   additional probes) so the fake stays stopped through the end of the run.
#
# Scenario (f1) vh_override — cross-side byte-exact (24.2 §4.3 OVERRIDE arm).
#   Request:  GET /scenario_f_override on l_test_a.
#   Per-route: NO typed_per_filter_config ⇒ vh_rate_limits=OVERRIDE
#             (the proto-zero default).
#   §4.3 disposition: route non-empty AND OVERRIDE ⇒ vhost SKIPPED.
#   Descriptors: [{scenario:f_override}] (route only).
#   RLS script: domain_b|scenario=f_override → OK.
#   Both sides: 200 + echo body. CompareBytes on
#               "scenario f_override status=200 body=ok".
#   Counter impact: cluster.c_ratelimit.ratelimit.ok +1 (per side).
#
# Scenario (f2) vh_include — cross-side byte-exact (24.2 §4.3 INCLUDE arm).
#   Request:  GET /scenario_f_include on l_test_a.
#   Per-route: typed_per_filter_config[envoy.filters.http.ratelimit] =
#             RateLimitPerRoute{vh_rate_limits: INCLUDE}.
#   §4.3 disposition: route policy walked + vhost policy walked (route first
#             per AMEND-6 walk order).
#   Descriptors: [{scenario:f_include}, {vh:vh_a}] (2 descriptors).
#   RLS script: domain_b|scenario=f_include|vh=vh_a → OK.
#   Both sides: 200 + echo body. CompareBytes on
#               "scenario f_include status=200 body=ok".
#   Counter impact: cluster.c_ratelimit.ratelimit.ok +1 (per side).
#
# Scenario (f3) vh_ignore — cross-side byte-exact (24.2 §4.3 IGNORE arm).
#   Request:  GET /scenario_f_ignore on l_test_a.
#   Per-route: typed_per_filter_config[envoy.filters.http.ratelimit] =
#             RateLimitPerRoute{vh_rate_limits: IGNORE}.
#   §4.3 disposition: vhost SKIPPED unconditionally; route policy walked.
#   Descriptors: [{scenario:f_ignore}] (route only).
#   RLS script: domain_b|scenario=f_ignore → OK.
#   Both sides: 200 + echo body. CompareBytes on
#               "scenario f_ignore status=200 body=ok".
#   Counter impact: cluster.c_ratelimit.ratelimit.ok +1 (per side).
#
# Scenario (g) x_ratelimit_headers — cross-side byte-exact + X-RateLimit byte-pin (24.2).
#   Request:  GET /scenario_g on l_test_a.
#   Route:    TWO single-action rate_limits[] policies →
#             generic_key{tier:bronze} (descriptor 1) +
#             generic_key{scope:burst} (descriptor 2).
#   Descriptors: [{tier:bronze}, {scope:burst}] (2 descriptors; AMEND-6
#             policy-order: input-slice order).
#   RLS script: domain_b|tier=bronze|scope=burst → OVER_LIMIT with per-
#             descriptor statuses:
#               statuses[0]: code=OVER_LIMIT, current_limit{rpu=10, unit=SECOND},
#                            limit_remaining=2, duration_until_reset.seconds=1
#               statuses[1]: code=OVER_LIMIT, current_limit{rpu=100, unit=MINUTE},
#                            limit_remaining=7, duration_until_reset.seconds=60
#   §4.7 + AMEND-8 + Task 5 follow-up wire order on the 429 response:
#     [a] x-envoy-ratelimited: true
#     [b] (no RLS response_headers_to_add scripted)
#     [c-pre] X-RateLimit triple (inlined at applyOverLimit per Task 5
#             follow-up wire-order discipline):
#               x-ratelimit-limit:     10, 10;w=1, 100;w=60
#               x-ratelimit-remaining: 2
#               x-ratelimit-reset:     1
#             (MIN selection: statuses[0] wins per strict-`<` first-equal-
#             min on limit_remaining; quota-policy suffix appends segments
#             for ALL statuses including the MIN's own descriptor per
#             upstream's iterate-all pattern; no `;name=` clause since
#             no `name` field is set on the scripted CurrentLimit.)
#     [c] x-from-config: filtercfg (filter-config response_headers_to_add)
#   Both sides: 429 + empty body. The driver emits FOUR lines per (g):
#               scenario g status=429 body=ok
#               scenario g x-ratelimit-limit=10, 10;w=1, 100;w=60
#               scenario g x-ratelimit-remaining=2
#               scenario g x-ratelimit-reset=1
#             CompareBytes detects any cross-side divergence in:
#               - MIN selection (different status would change all 3 values)
#               - unit→seconds mapping (different windows would change limit suffix)
#               - quota-policy suffix construction (segment count/order)
#               - duration_until_reset.seconds emission (different reset value)
#               - DRAFT_VERSION_03 gating (ABSENT instead of values)
#   Counter impact: cluster.c_ratelimit.ratelimit.over_limit +1 (per side).
#
# Scenario (h) stat_surface — subject-only via StatsAsserter.AssertStats.
#   OBSERVATIONAL — no additional probe burst; (h) asserts the counter
#   deltas accumulated by the preceding probes. StatsAsserter.AssertStats
#   scrapes the SUBJECT admin /stats/prometheus and asserts:
#
#     envoy_cluster_ratelimit_ok                  {envoy_cluster_name="c_ratelimit"} = 5
#     envoy_cluster_ratelimit_over_limit          {envoy_cluster_name="c_ratelimit"} = 2
#     envoy_cluster_ratelimit_error               {envoy_cluster_name="c_ratelimit"} = 1
#     envoy_cluster_ratelimit_failure_mode_allowed{envoy_cluster_name="c_ratelimit"} = 1
#
#   NOTE: the lines above show the underscore-normalized form (the SN2
#   dot→underscore transform shape that a future stats-cleanup phase MAY
#   land). The driver matches BOTH dot-form (SN1 as-implemented:
#   `envoy_cluster_ratelimit.<stat>`) AND underscore-form
#   (`envoy_cluster_ratelimit_<stat>`) per the dual-prefix lookup in
#   driver.go (clusterRatelimitCounter + needlePrefixes) — so this fixture
#   survives a stats-cleanup phase without churn. The current envoy-go
#   emit shape is the literal-dot form per SN1.
#
#   Source:
#     ok=5                    — scenarios (b) + (d) + (f-override) + (f-include) + (f-ignore)
#     over_limit=2            — scenarios (c) + (g)
#     error=1                 — scenario (e) RLS unreachable → applyError
#     failure_mode_allowed=1  — scenario (e) failure_mode_deny:false (the
#                                AMEND-3 proto-zero default; applyError's
#                                fail-open arm increments this counter
#                                INSIDE the error path per dispositions.go).
#
#   The observational shape (vs a separate burst phase) is INTENTIONAL —
#   the in-process fake stops cleanly but the subject's gRPC sub-channel
#   manages reconnect state per ADR-0158, and a stop-then-restart-on-the-
#   same-port within a single fixture run is NOT a pattern the existing
#   fake-toggle fixtures exercise (0021 puts the STOPPED state at the END
#   of the live batch; never a mid-stream restart). Observational (h)
#   avoids the reconnect edge AND keeps the per-scenario counter deltas
#   pinned 1:1 to the probe sequence.
#
#   The reference-side counter values are NOT asserted at 24.1/24.2 (the
#   primary cross-side gate is the byte-stream CompareBytes on b/c/d/e/f/g).
#   PROVEN LIVE per reference_differential_asserter_dispatch via the
#   Task 10 PROGRESS deliberate-break recipe.
#
# ## Documented divergence-windows
#
# 1. **destination_cluster action — engine-drop under empty cluster-name input.**
#    The DecoderFilterCallbacks surface has NO MatchedClusterName() accessor
#    at master tip; decode_headers.go threads clusterName="" to the engine.
#    The actionDestinationCluster arm at descriptors.go drops the whole
#    descriptor on empty input (per §4.5 behavior 1). Fixture 0032 does NOT
#    exercise this action at 24.1 OR 24.2 (scenario (d) restricts to the 9
#    framework-reachable actions). A future framework primitive may close
#    this gap.
#
# 2. **rc-details ABSENT-BY-API on the 3-arg SendLocalReply.**
#    Parent SPEC §4.7 specifies response_code_details="request_rate_limited"
#    on OVER_LIMIT replies + "rate_limiter_error" on error/fail-closed. The
#    3-arg envoyhttp SendLocalReply API carries no rc-details slot; the
#    constants are pinned at dispositions.go for forward consumption when/if
#    the API extends to a 4-arg variant. Fixture 0032 does NOT assert
#    rc-details (parent §4.7 documented).
#
# 3. **gRPC trailer envelope (8 RESOURCE_EXHAUSTED vs 14 UNAVAILABLE) ABSENT-BY-API.**
#    Parent §4.7 specifies a gRPC trailer envelope on OVER_LIMIT replies for
#    gRPC-shaped downstream requests. The 3-arg SendLocalReply has no trailer
#    slot; cc.rateLimitedAsResourceExhausted is consumed by the
#    rateLimitedAsResourceExhaustedGrpcCode helper but not emitted at 24.1/24.2.
#    Fixture 0032 does NOT exercise gRPC-shaped downstream requests.
#
# 4. **24.1-baked x-envoy-ratelimited-before-RLS slot inversion.**
#    Per the Task 5 follow-up PROGRESS entry, the slot [a]/[b] ordering on
#    OVER_LIMIT (x-envoy-ratelimited before RLS response_headers_to_add) is
#    an inherited 24.1 behavior; the Task 5 follow-up only fixed the
#    X-RateLimit-vs-filter-config slot. Scenario (g) does NOT script RLS
#    response_headers_to_add so this divergence is INVISIBLE in (g).
#
# 5. **Stats values asserted SUBJECT-ONLY at 24.1/24.2.**
#    AssertStats reads the SUBJECT counters only; the reference counters are
#    NOT asserted (the primary cross-side gate is CompareBytes on the
#    per-scenario byte stream). Reference Envoy v1.37.2 emits the same four
#    `cluster.<rls>.ratelimit.*` counter names; their values are not pinned
#    here (24.1/24.2 scope).
#
# 6. **Cross-side body comparison via STATUS + structural body classification
#    only — NOT the full echo body.** The cross-side byte stream emits
#    "scenario <id> status=<code> body=<ok|mismatch(...)>" lines; the body
#    classification is structural ("ok" iff the response body matches the
#    per-scenario shape expectation: echo JSON containing method+path keys
#    for the allow scenarios; empty body for the over_limit scenarios). The
#    full echo body is NOT emitted because reference Envoy adds per-hop
#    headers (x-forwarded-for, x-request-id, x-envoy-*) that the echobackend
#    reflects back into its JSON body — those headers diverge from the
#    envoy-go side. Same discipline as fixtures 0021 + 0030.
#
# 7. **Per-hop response headers (other than the 3 X-RateLimit triple emitted
#    on scenario g) are NOT byte-stream emitted.** The driver's byte stream
#    captures status + body classification universally and the X-RateLimit
#    triple ONLY for scenario (g). Other response headers (e.g.,
#    x-envoy-ratelimited on (c)/(g), x-from-config on (c)/(g)) are NOT
#    cross-side byte-pinned; their emission is proven via unit tests at
#    `dispositions_test.go` + `encode_test.go`.
#
# ## Wall-clock tolerance
#
# Fixture 0032 has no throttle / wait-time scenarios. Per-scenario wall-clock
# is dominated by the gRPC RLS loopback round-trip (< 1ms typical for the
# success scenarios) + the connection-refused fail-fast on scenario (e)
# (also < 1ms typical on the host loopback). Total fixture wallclock ~2s
# (9 sequential scenarios + a single fake stop before scenario (e); scenario
# (h) is OBSERVATIONAL — no additional probes, no fake restart). NO wall-clock-
# tolerance assertion is enforced.
#
# ## Header allow-list
#
# Per BEHAVIOR_CONTRACT.md `## Header allow-list`. The cross-side byte stream
# captures status + body classification universally; scenario (g)
# ADDITIONALLY captures the x-ratelimit-* triple (3 extra lines per side).
# The OVER_LIMIT scenarios do NOT assert the x-envoy-ratelimited header set
# explicitly in the byte stream for (c) — the empty-body assertion + the
# 429 status carry the load-bearing AMEND-8 emission proof; for (g) the
# X-RateLimit triple itself proves the AMEND-8 wire-order discipline holds
# (the triple lands AFTER x-envoy-ratelimited per the inline applyOverLimit
# slot [c-pre]; a regression would either emit ABSENT or wrong values).
