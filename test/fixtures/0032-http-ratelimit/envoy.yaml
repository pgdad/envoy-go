# Reference Envoy bootstrap for fixture 0032-http-ratelimit.
#
# Single-listener topology per phase-24 parent SPEC §7.3 — ONE HCM with the
# ratelimit filter (alphabetical) + router terminator + two clusters:
#   c_backend     — synthetic always-200 echobackend subprocess on the host
#                   (reached via host.docker.internal per ADR-0010 STRICT_DNS).
#   c_ratelimit   — the in-process gRPC RateLimitService fake (the SAME
#                   pre-allocated 127.0.0.1:<RLSPort> reached via
#                   host.docker.internal from the reference container; plaintext
#                   h2c per parent SPEC §7.2 + ADR-0166).
#
# Per-scenario routes (matched by exact :path) — each carries its own
# route_action.rate_limits[] policy producing per-scenario descriptors:
#
#   /scenario_a — NO rate_limits → zero-descriptor short-circuit → echo 200.
#   /scenario_b — generic_key{scenario:b}                       → OK admit.
#   /scenario_c — generic_key{scenario:c}                       → OVER_LIMIT 429.
#   /scenario_d — 4-action chain: generic_key{scenario:d} +
#                  request_headers{x-tenant→tenant} +
#                  remote_address +
#                  header_value_match{descriptor_value:canaried,
#                                    headers:[present_match x-canary]}.
#   /scenario_e — generic_key{scenario:e} (RLS server stopped by driver
#                  before the request → transport error → fail-open admit).
#
# The filter's domain is "domain_b" so the fake's CanonicalKey lookups
# carry the domain prefix; the driver's setupRLS builds keys matching
# exactly what the engine emits at descriptor-build time (AMEND-6
# action-list order; per-action key defaults per AMEND-11).
#
# Templating: rendered by the driver's ReferenceBootstrap() at runtime.
# Substitution keys:
#   {{.AdminPort}}    — admin endpoint port (9901 for reference container).
#   {{.LATestPort}}   — l_test_a listener port (reference container-fixed; 10032).
#   {{.BackendHost}}  — echobackend host (host.docker.internal per ADR-0010).
#   {{.BackendPort}}  — echobackend port (runner-allocated).
#   {{.RLSHost}}      — RLS fake host (host.docker.internal for reference).
#   {{.RLSPort}}      — RLS fake port (driver-allocated; pre-bound by the
#                       in-process server before any request fires).
admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: {{.AdminPort}} }

static_resources:
  listeners:
    - name: l_test_a
      address: { socket_address: { address: 0.0.0.0, port_value: {{.LATestPort}} } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP1
                stat_prefix: hcm_a
                route_config:
                  name: rc_a
                  virtual_hosts:
                    - name: vh_a
                      domains: ["*"]
                      routes:
                        # (a) parse_ok — NO rate_limits → zero-descriptor short-circuit.
                        - match: { path: "/scenario_a" }
                          route: { cluster: c_backend }
                        # (b) ok_admit — single generic_key policy → OK.
                        - match: { path: "/scenario_b" }
                          route:
                            cluster: c_backend
                            rate_limits:
                              - actions:
                                  - generic_key:
                                      descriptor_key: scenario
                                      descriptor_value: b
                        # (c) over_limit_429 — single generic_key policy → OVER_LIMIT.
                        - match: { path: "/scenario_c" }
                          route:
                            cluster: c_backend
                            rate_limits:
                              - actions:
                                  - generic_key:
                                      descriptor_key: scenario
                                      descriptor_value: c
                        # (d) descriptor_actions — 4-action core-action chain.
                        # The action order is the AMEND-6 entries-in-action-list
                        # order: generic_key → request_headers → remote_address
                        # → header_value_match. The fake's script key MUST
                        # carry the entries in this exact order.
                        - match: { path: "/scenario_d" }
                          route:
                            cluster: c_backend
                            rate_limits:
                              - actions:
                                  - generic_key:
                                      descriptor_key: scenario
                                      descriptor_value: d
                                  - request_headers:
                                      header_name: x-tenant
                                      descriptor_key: tenant
                                  - remote_address: {}
                                  - header_value_match:
                                      descriptor_value: canaried
                                      headers:
                                        - name: x-canary
                                          present_match: true
                        # (e) failure_mode_open — single generic_key policy;
                        # the driver stops the RLS server before this request
                        # → ShouldRateLimit dial fails fast → fail-open admit
                        # via cc.failureModeDeny=false (the AMEND-3 proto-zero
                        # default; no failure_mode_deny field on the filter
                        # config below).
                        - match: { path: "/scenario_e" }
                          route:
                            cluster: c_backend
                            rate_limits:
                              - actions:
                                  - generic_key:
                                      descriptor_key: scenario
                                      descriptor_value: e
                http_filters:
                  - name: envoy.filters.http.ratelimit
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ratelimit.v3.RateLimit
                      domain: domain_b
                      # timeout absent → AMEND-3 default 20ms. The fake replies
                      # within microseconds on loopback; 20ms is plenty.
                      # failure_mode_deny absent → false (the AMEND-3 proto-zero
                      # default; scenario (e) relies on this for fail-open
                      # admit on RLS-transport-error).
                      rate_limit_service:
                        grpc_service:
                          envoy_grpc:
                            cluster_name: c_ratelimit
                          timeout: 1s
                        transport_api_version: V3
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: c_backend
      type: STRICT_DNS
      connect_timeout: 1s
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: c_backend
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: {{.BackendHost}}, port_value: {{.BackendPort}} }
    # c_ratelimit: in-process gRPC RateLimitService fake on the host loopback.
    # MANDATORY http2_protocol_options:{} for gRPC framing per parent SPEC
    # §11.P13 + §6.5 (UseH2() true PARSE-REJECT gate); plaintext h2c per
    # ADR-0166 (H2-without-TLS relaxation; no TLS in phase 24.1 fixtures
    # per parent §7.2).
    - name: c_ratelimit
      type: STRICT_DNS
      connect_timeout: 1s
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: c_ratelimit
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: {{.RLSHost}}, port_value: {{.RLSPort}} }
