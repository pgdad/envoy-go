# envoy-go bootstrap for fixture 0032-http-ratelimit.
#
# Functionally equivalent to envoy.yaml modulo:
#   - cluster type: STATIC (envoy-go convention per ADR-0002) vs STRICT_DNS
#     (reference Envoy).
#   - cluster endpoint addresses: 127.0.0.1 (envoy-go runs on the host loopback)
#     vs host.docker.internal (reference Envoy runs in a Docker container).
#   - admin/listener ports independently allocated by the runner per proxy.
#   - no dns_lookup_family (STATIC clusters do not DNS-resolve).
#
# Single-listener topology per parent SPEC §7.3 — see envoy.yaml header for
# the per-scenario route table; the route policies + the filter config are
# byte-identical between the two YAMLs (so both sides build the same
# descriptors at runtime).
#
# Templating: rendered by the driver's SubjectConfig() at runtime.
# Substitution keys:
#   {{.AdminPort}}    — admin endpoint port (runner-allocated).
#   {{.LATestPort}}   — l_test_a listener port (runner-allocated).
#   {{.BackendPort}}  — echobackend port (runner-allocated).
#   {{.RLSHost}}      — RLS fake host (127.0.0.1 for envoy-go on the host).
#   {{.RLSPort}}      — RLS fake port (driver-allocated; pre-bound).
admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: {{.AdminPort}} }

static_resources:
  listeners:
    - name: l_test_a
      address: { socket_address: { address: 0.0.0.0, port_value: {{.LATestPort}} } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP1
                stat_prefix: hcm_a
                route_config:
                  name: rc_a
                  virtual_hosts:
                    - name: vh_a
                      domains: ["*"]
                      routes:
                        - match: { path: "/scenario_a" }
                          route: { cluster: c_backend }
                        - match: { path: "/scenario_b" }
                          route:
                            cluster: c_backend
                            rate_limits:
                              - actions:
                                  - generic_key:
                                      descriptor_key: scenario
                                      descriptor_value: b
                        - match: { path: "/scenario_c" }
                          route:
                            cluster: c_backend
                            rate_limits:
                              - actions:
                                  - generic_key:
                                      descriptor_key: scenario
                                      descriptor_value: c
                        - match: { path: "/scenario_d" }
                          route:
                            cluster: c_backend
                            rate_limits:
                              - actions:
                                  - generic_key:
                                      descriptor_key: scenario
                                      descriptor_value: d
                                  - request_headers:
                                      header_name: x-tenant
                                      descriptor_key: tenant
                                  - remote_address: {}
                                  - header_value_match:
                                      descriptor_value: canaried
                                      headers:
                                        - name: x-canary
                                          present_match: true
                        - match: { path: "/scenario_e" }
                          route:
                            cluster: c_backend
                            rate_limits:
                              - actions:
                                  - generic_key:
                                      descriptor_key: scenario
                                      descriptor_value: e
                http_filters:
                  - name: envoy.filters.http.ratelimit
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ratelimit.v3.RateLimit
                      domain: domain_b
                      rate_limit_service:
                        grpc_service:
                          envoy_grpc:
                            cluster_name: c_ratelimit
                          timeout: 1s
                        transport_api_version: V3
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: c_backend
      type: STATIC
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: c_backend
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: 127.0.0.1, port_value: {{.BackendPort}} }
    # c_ratelimit: in-process gRPC RateLimitService fake on host loopback.
    # MANDATORY http2_protocol_options:{} for gRPC framing per parent SPEC
    # §11.P13 + §6.5; plaintext h2c per ADR-0166.
    - name: c_ratelimit
      type: STATIC
      lb_policy: ROUND_ROBIN
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: c_ratelimit
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: {{.RLSHost}}, port_value: {{.RLSPort}} }
