# Reference: upstream Envoy configuration for fixture 0004-h2-routing.
#
# This file is documentation only. The driver's ReferenceBootstrap() method
# (Task 14) generates the actual bootstrap YAML at runtime with runtime-allocated
# backend ports substituted for {{BACKEND_PORT_N}}, and inline PEM bytes
# substituted for {{LISTENER_CERT}}, {{LISTENER_KEY}}, and {{CA_CERT}}.
#
# Shape:
#   - 1 listener l_h2 on 0.0.0.0:15004 with:
#       * downstream TLS termination (alpn_protocols: ["h2","http/1.1"])
#       * HCM with codec_type=AUTO (ALPN drives the per-conn codec choice)
#       * http_filters: an EMPTY header_mutation (phase 89 — zero listener-scope
#         mutations; it only makes the filter name live for per-route configs)
#         followed by the router
#       * 4 base routes (/health direct_response, /api prefix → cluster, //edge
#         direct_response (phase 87 leading-`//` origin form), /missing 404)
#         plus 7 phase-89 exact-path arm routes ABOVE the /api prefix route,
#         each with its own header_mutation typed_per_filter_config
#   - Cluster c_h2_backend: STRICT_DNS (ADR-0010 V4_ONLY); 3 endpoints reaching
#     backends via host.docker.internal:{{BACKEND_PORT_N}}; upstream TLS with
#     ALPN h2; trusted_ca: the fixture-local CA (driver-rendered inline_string).
#   - typed_extension_protocol_options.HttpProtocolOptions.explicit_http_config
#     .http2_protocol_options{} pins the upstream codec to H/2.
#
# --concurrency 1 (ADR-0028) is set by the harness's testcontainers Cmd.

admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: 9901 }

static_resources:
  listeners:
    - name: l_h2
      address:
        socket_address: { address: 0.0.0.0, port_value: 15004 }
      filter_chains:
        - transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
              common_tls_context:
                alpn_protocols: ["h2", "http/1.1"]
                tls_certificates:
                  - certificate_chain:
                      inline_string: |
                        {{LISTENER_CERT}}
                    private_key:
                      inline_string: |
                        {{LISTENER_KEY}}
          filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: AUTO
                stat_prefix: ingress_h2
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: vh_default
                      domains: ["*"]
                      routes:
                        - match: { path: "/health" }
                          direct_response:
                            status: 200
                            body: { inline_string: "OK\n" }
                        # ── Phase 89 (ADR-0311) decode-side H/2 filter-mutation arms ──
                        #
                        # Each arm is an EXACT-path route carrying its OWN
                        # header_mutation `typed_per_filter_config`, declared ABOVE
                        # the `prefix: "/api"` route so first-match-wins picks it.
                        # All of them route to c_h2_backend, whose backend serves
                        # `/api/v1/reflect-headers/` by reflecting the request
                        # headers it ACTUALLY received (sorted, one `name: value`
                        # line per (name, value) pair).
                        #
                        # ⚠️ Arm A5 ("no per-route config") deliberately has NO route
                        # entry here — `/api/v1/reflect-headers/a5` falls through to
                        # the `prefix: "/api"` route below, which IS the
                        # no-per-route-mutation case. An explicit route with an empty
                        # config would be indistinguishable and is not added.
                        #
                        # ⚠️ `te` is appended AT MOST ONCE (arm A7a only): reference
                        # Envoy comma-coalesces repeated `te` into a single field, and
                        # a coalesced `te: trailers,trailers` is rejected by the
                        # conformant x/net backend (`TE may only be "trailers"`).
                        - match: { path: "/api/v1/reflect-headers/a1" }
                          route: { cluster: c_h2_backend }
                          typed_per_filter_config:
                            envoy.filters.http.header_mutation:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.header_mutation.v3.HeaderMutationPerRoute
                              mutations:
                                request_mutations:
                                  - append:
                                      header: { key: "x-p89-added", value: "a1" }
                                      append_action: APPEND_IF_EXISTS_OR_ADD
                        - match: { path: "/api/v1/reflect-headers/a2" }
                          route: { cluster: c_h2_backend }
                          typed_per_filter_config:
                            envoy.filters.http.header_mutation:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.header_mutation.v3.HeaderMutationPerRoute
                              mutations:
                                request_mutations:
                                  - remove: "x-p89-removed"
                        - match: { path: "/api/v1/reflect-headers/a3" }
                          route: { cluster: c_h2_backend }
                          typed_per_filter_config:
                            envoy.filters.http.header_mutation:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.header_mutation.v3.HeaderMutationPerRoute
                              mutations:
                                request_mutations:
                                  - append:
                                      header: { key: "x-p89-changed", value: "new" }
                                      append_action: OVERWRITE_IF_EXISTS_OR_ADD
                        - match: { path: "/api/v1/reflect-headers/a4" }
                          route: { cluster: c_h2_backend }
                          typed_per_filter_config:
                            envoy.filters.http.header_mutation:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.header_mutation.v3.HeaderMutationPerRoute
                              mutations:
                                request_mutations:
                                  - append:
                                      header: { key: "x-p89-dup", value: "v1" }
                                      append_action: APPEND_IF_EXISTS_OR_ADD
                        - match: { path: "/api/v1/reflect-headers/a6" }
                          route: { cluster: c_h2_backend }
                          typed_per_filter_config:
                            envoy.filters.http.header_mutation:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.header_mutation.v3.HeaderMutationPerRoute
                              mutations:
                                request_mutations:
                                  - append:
                                      header: { key: "X-P89-Case", value: "c1" }
                                      append_action: APPEND_IF_EXISTS_OR_ADD
                        - match: { path: "/api/v1/reflect-headers/a7" }
                          route: { cluster: c_h2_backend }
                          typed_per_filter_config:
                            envoy.filters.http.header_mutation:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.header_mutation.v3.HeaderMutationPerRoute
                              mutations:
                                request_mutations:
                                  - append:
                                      header: { key: "x-p89-benign", value: "kept" }
                                      append_action: APPEND_IF_EXISTS_OR_ADD
                                  - append:
                                      header: { key: "te", value: "trailers" }
                                      append_action: APPEND_IF_EXISTS_OR_ADD
                        - match: { path: "/api/v1/reflect-headers/a8" }
                          route: { cluster: c_h2_backend }
                          typed_per_filter_config:
                            envoy.filters.http.header_mutation:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.header_mutation.v3.HeaderMutationPerRoute
                              mutations:
                                request_mutations:
                                  - append:
                                      header: { key: "x-p89-added", value: "a1" }
                                      append_action: APPEND_IF_EXISTS_OR_ADD
                        - match: { prefix: "/api" }
                          route: { cluster: c_h2_backend }
                        - match: { prefix: "//edge" }
                          direct_response:
                            status: 200
                            body: { inline_string: "edge-ok" }
                        - match: { prefix: "/" }
                          direct_response:
                            status: 404
                            body: { inline_string: "not found\n" }
                http_filters:
                  # Phase 89: an EMPTY listener-level HeaderMutation. It declares
                  # ZERO listener-scope mutations, so the pre-existing 31
                  # round-trips are byte-untouched; its only job is to make
                  # `envoy.filters.http.header_mutation` a live filter name so the
                  # per-route `typed_per_filter_config` entries above attach.
                  # MEASURED: reference Envoy contrib-v1.37.2 boots this shape
                  # (`--mode validate` => `configuration OK`, rc=0).
                  - name: envoy.filters.http.header_mutation
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.header_mutation.v3.HeaderMutation
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: c_h2_backend
      type: STRICT_DNS
      connect_timeout: 1s
      dns_lookup_family: V4_ONLY     # ADR-0010
      lb_policy: ROUND_ROBIN
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
          sni: localhost   # ServerName for SNI + cert validation; backend leaves carry SAN "localhost"
          common_tls_context:
            alpn_protocols: ["h2"]
            validation_context:
              trusted_ca:
                inline_string: |
                  {{CA_CERT}}
      load_assignment:
        cluster_name: c_h2_backend
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: host.docker.internal, port_value: 0 }   # backend 0 — driver-rendered
              - endpoint:
                  address:
                    socket_address: { address: host.docker.internal, port_value: 0 }   # backend 1 — driver-rendered
              - endpoint:
                  address:
                    socket_address: { address: host.docker.internal, port_value: 0 }   # backend 2 — driver-rendered
