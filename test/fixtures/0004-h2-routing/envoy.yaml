# Reference: upstream Envoy configuration for fixture 0004-h2-routing.
#
# This file is documentation only. The driver's ReferenceBootstrap() method
# (Task 14) generates the actual bootstrap YAML at runtime with runtime-allocated
# backend ports substituted for {{BACKEND_PORT_N}}, and inline PEM bytes
# substituted for {{LISTENER_CERT}}, {{LISTENER_KEY}}, and {{CA_CERT}}.
#
# Shape:
#   - 1 listener l_h2 on 0.0.0.0:15004 with:
#       * downstream TLS termination (alpn_protocols: ["h2","http/1.1"])
#       * HCM with codec_type=AUTO (ALPN drives the per-conn codec choice)
#       * 3 routes (/health direct_response, /api prefix → cluster, /missing 404)
#   - Cluster c_h2_backend: STRICT_DNS (ADR-0010 V4_ONLY); 3 endpoints reaching
#     backends via host.docker.internal:{{BACKEND_PORT_N}}; upstream TLS with
#     ALPN h2; trusted_ca: the fixture-local CA (driver-rendered inline_string).
#   - typed_extension_protocol_options.HttpProtocolOptions.explicit_http_config
#     .http2_protocol_options{} pins the upstream codec to H/2.
#
# --concurrency 1 (ADR-0028) is set by the harness's testcontainers Cmd.

admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: 9901 }

static_resources:
  listeners:
    - name: l_h2
      address:
        socket_address: { address: 0.0.0.0, port_value: 15004 }
      filter_chains:
        - transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
              common_tls_context:
                alpn_protocols: ["h2", "http/1.1"]
                tls_certificates:
                  - certificate_chain:
                      inline_string: |
                        {{LISTENER_CERT}}
                    private_key:
                      inline_string: |
                        {{LISTENER_KEY}}
          filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: AUTO
                stat_prefix: ingress_h2
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: vh_default
                      domains: ["*"]
                      routes:
                        - match: { path: "/health" }
                          direct_response:
                            status: 200
                            body: { inline_string: "OK\n" }
                        - match: { prefix: "/api" }
                          route: { cluster: c_h2_backend }
                        - match: { prefix: "/" }
                          direct_response:
                            status: 404
                            body: { inline_string: "not found\n" }
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: c_h2_backend
      type: STRICT_DNS
      connect_timeout: 1s
      dns_lookup_family: V4_ONLY     # ADR-0010
      lb_policy: ROUND_ROBIN
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
          sni: localhost   # ServerName for SNI + cert validation; backend leaves carry SAN "localhost"
          common_tls_context:
            alpn_protocols: ["h2"]
            validation_context:
              trusted_ca:
                inline_string: |
                  {{CA_CERT}}
      load_assignment:
        cluster_name: c_h2_backend
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: host.docker.internal, port_value: 0 }   # backend 0 — driver-rendered
              - endpoint:
                  address:
                    socket_address: { address: host.docker.internal, port_value: 0 }   # backend 1 — driver-rendered
              - endpoint:
                  address:
                    socket_address: { address: host.docker.internal, port_value: 0 }   # backend 2 — driver-rendered
