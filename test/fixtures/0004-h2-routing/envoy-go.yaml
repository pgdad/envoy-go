# Subject: envoy-go configuration for fixture 0004-h2-routing.
#
# This file is documentation only. The driver's SubjectConfig() method (Task 14)
# generates the actual bootstrap YAML at runtime with runtime-allocated ports
# substituted for {{BACKEND_PORT_N}}, {{SUBJECT_LISTENER_PORT}}, and
# {{ADMIN_PORT}}, and inline PEM bytes substituted for {{LISTENER_CERT}},
# {{LISTENER_KEY}}, and {{CA_CERT}}.
#
# Shape mirrors envoy.yaml with these divergences:
#   - Cluster type: STATIC (ADR-0027) — subject uses 127.0.0.1 not host.docker.internal.
#   - Admin address: 127.0.0.1:{{ADMIN_PORT}} (randomly-allocated per run).
#   - No listener_filters needed: envoy-go's HCM reads ALPN natively via crypto/tls.
#
# Route table and http_filters are IDENTICAL to envoy.yaml, including the phase-89
# empty listener-level header_mutation and the 7 exact-path arm routes carrying
# per-route HeaderMutationPerRoute configs.
#
# See also: ADR-0010 (V4_ONLY), ADR-0027 (STATIC vs STRICT_DNS), ADR-0028
# (--concurrency 1 reference pin), ADR-0056 (Cluster.UseH2 from
# typed_extension_protocol_options.HttpProtocolOptions), ADR-0057 (the closure
# of ADR-0035's H2 leg via this fixture).

node: { id: envoy-go-subject-0004, cluster: envoy-go-differential }

admin:
  address:
    socket_address: { address: 127.0.0.1, port_value: 0 }   # ADMIN_PORT — driver-rendered

static_resources:
  listeners:
    - name: l_h2
      address:
        socket_address: { address: 127.0.0.1, port_value: 0 }   # SUBJECT_LISTENER_PORT — driver-rendered
      filter_chains:
        - transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
              common_tls_context:
                alpn_protocols: ["h2", "http/1.1"]
                tls_certificates:
                  - certificate_chain:
                      inline_string: |
                        {{LISTENER_CERT}}
                    private_key:
                      inline_string: |
                        {{LISTENER_KEY}}
          filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: AUTO   # ALPN-driven selection per-conn (driver advertises h2 only)
                stat_prefix: ingress_h2
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: vh_default
                      domains: ["*"]
                      routes:
                        - match: { path: "/health" }
                          direct_response:
                            status: 200
                            body: { inline_string: "OK\n" }
                        # ── Phase 89 (ADR-0311) decode-side H/2 filter-mutation arms ──
                        #
                        # Each arm is an EXACT-path route carrying its OWN
                        # header_mutation `typed_per_filter_config`, declared ABOVE
                        # the `prefix: "/api"` route so first-match-wins picks it.
                        # All of them route to c_h2_backend, whose backend serves
                        # `/api/v1/reflect-headers/` by reflecting the request
                        # headers it ACTUALLY received (sorted, one `name: value`
                        # line per (name, value) pair).
                        #
                        # ⚠️ Arm A5 ("no per-route config") deliberately has NO route
                        # entry here — `/api/v1/reflect-headers/a5` falls through to
                        # the `prefix: "/api"` route below, which IS the
                        # no-per-route-mutation case. An explicit route with an empty
                        # config would be indistinguishable and is not added.
                        #
                        # ⚠️ `te` is appended AT MOST ONCE (arm A7a only): reference
                        # Envoy comma-coalesces repeated `te` into a single field, and
                        # a coalesced `te: trailers,trailers` is rejected by the
                        # conformant x/net backend (`TE may only be "trailers"`).
                        - match: { path: "/api/v1/reflect-headers/a1" }
                          route: { cluster: c_h2_backend }
                          typed_per_filter_config:
                            envoy.filters.http.header_mutation:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.header_mutation.v3.HeaderMutationPerRoute
                              mutations:
                                request_mutations:
                                  - append:
                                      header: { key: "x-p89-added", value: "a1" }
                                      append_action: APPEND_IF_EXISTS_OR_ADD
                        - match: { path: "/api/v1/reflect-headers/a2" }
                          route: { cluster: c_h2_backend }
                          typed_per_filter_config:
                            envoy.filters.http.header_mutation:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.header_mutation.v3.HeaderMutationPerRoute
                              mutations:
                                request_mutations:
                                  - remove: "x-p89-removed"
                        - match: { path: "/api/v1/reflect-headers/a3" }
                          route: { cluster: c_h2_backend }
                          typed_per_filter_config:
                            envoy.filters.http.header_mutation:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.header_mutation.v3.HeaderMutationPerRoute
                              mutations:
                                request_mutations:
                                  - append:
                                      header: { key: "x-p89-changed", value: "new" }
                                      append_action: OVERWRITE_IF_EXISTS_OR_ADD
                        - match: { path: "/api/v1/reflect-headers/a4" }
                          route: { cluster: c_h2_backend }
                          typed_per_filter_config:
                            envoy.filters.http.header_mutation:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.header_mutation.v3.HeaderMutationPerRoute
                              mutations:
                                request_mutations:
                                  - append:
                                      header: { key: "x-p89-dup", value: "v1" }
                                      append_action: APPEND_IF_EXISTS_OR_ADD
                        - match: { path: "/api/v1/reflect-headers/a6" }
                          route: { cluster: c_h2_backend }
                          typed_per_filter_config:
                            envoy.filters.http.header_mutation:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.header_mutation.v3.HeaderMutationPerRoute
                              mutations:
                                request_mutations:
                                  - append:
                                      header: { key: "X-P89-Case", value: "c1" }
                                      append_action: APPEND_IF_EXISTS_OR_ADD
                        - match: { path: "/api/v1/reflect-headers/a7" }
                          route: { cluster: c_h2_backend }
                          typed_per_filter_config:
                            envoy.filters.http.header_mutation:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.header_mutation.v3.HeaderMutationPerRoute
                              mutations:
                                request_mutations:
                                  - append:
                                      header: { key: "x-p89-benign", value: "kept" }
                                      append_action: APPEND_IF_EXISTS_OR_ADD
                                  - append:
                                      header: { key: "te", value: "trailers" }
                                      append_action: APPEND_IF_EXISTS_OR_ADD
                        - match: { path: "/api/v1/reflect-headers/a8" }
                          route: { cluster: c_h2_backend }
                          typed_per_filter_config:
                            envoy.filters.http.header_mutation:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.header_mutation.v3.HeaderMutationPerRoute
                              mutations:
                                request_mutations:
                                  - append:
                                      header: { key: "x-p89-added", value: "a1" }
                                      append_action: APPEND_IF_EXISTS_OR_ADD
                        - match: { prefix: "/api" }
                          route: { cluster: c_h2_backend }
                        - match: { prefix: "//edge" }
                          direct_response:
                            status: 200
                            body: { inline_string: "edge-ok" }
                        - match: { prefix: "/" }
                          direct_response:
                            status: 404
                            body: { inline_string: "not found\n" }
                http_filters:
                  # Phase 89: an EMPTY listener-level HeaderMutation. It declares
                  # ZERO listener-scope mutations, so the pre-existing 31
                  # round-trips are byte-untouched; its only job is to make
                  # `envoy.filters.http.header_mutation` a live filter name so the
                  # per-route `typed_per_filter_config` entries above attach.
                  # MEASURED: reference Envoy contrib-v1.37.2 boots this shape
                  # (`--mode validate` => `configuration OK`, rc=0).
                  - name: envoy.filters.http.header_mutation
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.header_mutation.v3.HeaderMutation
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: c_h2_backend
      type: STATIC
      connect_timeout: 1s
      lb_policy: ROUND_ROBIN
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
          sni: localhost   # ServerName for SNI + cert validation; backend leaves carry SAN "localhost"
          common_tls_context:
            alpn_protocols: ["h2"]
            validation_context:
              trusted_ca:
                inline_string: |
                  {{CA_CERT}}
      load_assignment:
        cluster_name: c_h2_backend
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: 127.0.0.1, port_value: 0 }   # backend 0 — driver-rendered
              - endpoint:
                  address:
                    socket_address: { address: 127.0.0.1, port_value: 0 }   # backend 1 — driver-rendered
              - endpoint:
                  address:
                    socket_address: { address: 127.0.0.1, port_value: 0 }   # backend 2 — driver-rendered
