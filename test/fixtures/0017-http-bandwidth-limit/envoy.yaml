# Reference Envoy bootstrap for fixture 0017-http-bandwidth-limit.
# Two-listener topology per SPEC §7.2: one HCM listener `l_test_a` carrying
# the bandwidth_limit filter at listener level + 6 routes (4 direct_response
# + 2 cluster); `l_test_b` is the upstream echo-backend listener exposed via
# cluster `c_backend_b` (the runner spawns the SHARED echobackend helper at
# test/helpers/echobackend/cmd/echobackend on `BackendPort` per fixture
# precedent — fixture 0016 introduced HTTPCompressor; fixture 0017 reuses
# the same helper as HTTPBandwidthLimit per phase-15 SPEC §7.2 +
# fixture.BackendKind = 14).
#
# Listener-level config (per SPEC §7.2 verbatim):
#
#   envoy.filters.http.bandwidth_limit:
#     stat_prefix: default
#     enable_mode: REQUEST_AND_RESPONSE
#     limit_kbps: 10               # KiB/s per SPEC §1.1 amendment 6 (NOT kilobits-per-second)
#     fill_interval: 0.05s         # 50ms per SPEC §7.2; durations carried as canonical
#                                  # protobuf-JSON `<seconds>s` form for portability.
#
# `limit_kbps=10` + `fill_interval=50ms` ⇒ `chunk_size = 10 × 1024 × 0.050 =
# 512 bytes/tick` per SPEC §6.6 throttle-math. A 10240-byte body chunks into
# ceil(10240/512) = 20 ticks × 50ms = 1000ms throttle (per scenario 1 +
# scenarios 2 + 3). A 100-byte body fits one tick (50ms; scenario 4). The
# scenario-6 per-route override raises `limit_kbps` to 100 → `chunk_size =
# 5120 bytes/tick` → 10240-byte body chunks into 2 ticks × 50ms = 100ms.
#
# Six routes per SPEC §7.2 + driver scenarios per SPEC §7.1:
#
#   1. /echo-response — direct_response 200; 10240-byte body. Inherits
#      listener REQUEST_AND_RESPONSE → response-side throttle only (no
#      request body). Scenario 1: 1000ms wall-clock ±70ms.
#
#   2. /echo-request  — cluster c_backend_b; per-route TPFC `enable_mode:
#      REQUEST, limit_kbps: 10, stat_prefix: default` (overrides listener
#      REQUEST_AND_RESPONSE → request-side only). Scenario 2: POST 10240-
#      byte body; 1000ms upstream-arrival ±70ms.
#
#   3. /echo-both     — cluster c_backend_b; no per-route TPFC; inherits
#      listener REQUEST_AND_RESPONSE → BOTH directions throttle. Scenario 3:
#      POST 5120-byte body; 1000ms total ±70ms (decode 500ms + encode 500ms).
#
#   4. /echo-tiny     — direct_response 200; 100-byte body. Inherits
#      listener. Scenario 4: 50ms one-tick-floor ±70ms.
#
#   5. /echo-disabled — direct_response 200; 10240-byte body; per-route TPFC
#      `enable_mode: DISABLED, limit_kbps: 10, stat_prefix: default`. The
#      `enable_mode: DISABLED` is the per-route disable mechanism per SPEC
#      §1.1 amendment 1 (NO `BandwidthLimitPerRoute` envelope; bare
#      `BandwidthLimit` proto via TPFC). `limit_kbps: 10` is still required
#      at per-route position per SPEC §1.1 amendment 4 even though
#      structurally ignored under `DISABLED`. Scenario 5: no throttle.
#
#   6. /echo-override — direct_response 200; 10240-byte body; per-route TPFC
#      `stat_prefix: override, enable_mode: RESPONSE, limit_kbps: 100,
#      fill_interval: 0.05s`. INDEPENDENT-stats per ADR-0139 + SPEC §11.P4
#      + §11.P14: the per-route `stat_prefix: override` registers a SEPARATE
#      stat namespace `override.http_bandwidth_limit.*` whose counters are
#      INDEPENDENT of the listener-level `default.http_bandwidth_limit.*`
#      namespace (mirrors phase-11 local_ratelimit per ADR-0117). Scenario
#      6: 100ms response-only ±70ms.
#
# Cluster type STRICT_DNS targeting `host.docker.internal` per ADR-0010 +
# `dns_lookup_family: V4_ONLY` per phase-14 compressor precedent (Docker
# Desktop's host.docker.internal can resolve IPv6 by default; V4_ONLY forces
# v4 routing from inside the reference Envoy container).
admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: {{.AdminPort}} }

static_resources:
  listeners:
    - name: l_test_a
      address: { socket_address: { address: 0.0.0.0, port_value: {{.ListenerPort}} } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP1
                stat_prefix: ingress_bandwidth_limit
                route_config:
                  name: rc_test_a
                  # Raise the direct_response body cap above Envoy's 4096-byte default
                  # (per envoy.config.route.v3.RouteConfiguration.max_direct_response_body_size_bytes).
                  # Three routes in this fixture issue 10240-byte direct_response bodies
                  # (scenarios 1 + 5 + 6); the default cap rejects them at boot
                  # ("response body size is 10240 bytes; maximum is 4096"). 16384 bytes
                  # accommodates the 10240-byte scenarios with headroom.
                  max_direct_response_body_size_bytes: 16384
                  virtual_hosts:
                    - name: vh_test_a
                      domains: ["*"]
                      routes:
                        - match: { path: "/echo-response" }
                          direct_response:
                            status: 200
                            body: { inline_string: "" }
                        - match: { path: "/echo-request" }
                          route: { cluster: c_backend_b }
                          typed_per_filter_config:
                            envoy.filters.http.bandwidth_limit:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.bandwidth_limit.v3.BandwidthLimit
                              stat_prefix: default
                              enable_mode: REQUEST
                              limit_kbps: 10
                        - match: { path: "/echo-both" }
                          route: { cluster: c_backend_b }
                        - match: { path: "/echo-tiny" }
                          direct_response:
                            status: 200
                            body: { inline_string: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA" }
                        - match: { path: "/echo-disabled" }
                          direct_response:
                            status: 200
                            body: { inline_string: "" }
                          typed_per_filter_config:
                            envoy.filters.http.bandwidth_limit:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.bandwidth_limit.v3.BandwidthLimit
                              stat_prefix: default
                              enable_mode: DISABLED
                              limit_kbps: 10
                        - match: { path: "/echo-override" }
                          direct_response:
                            status: 200
                            body: { inline_string: "" }
                          typed_per_filter_config:
                            envoy.filters.http.bandwidth_limit:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.bandwidth_limit.v3.BandwidthLimit
                              stat_prefix: override
                              enable_mode: RESPONSE
                              limit_kbps: 100
                              fill_interval: 0.05s
                http_filters:
                  - name: envoy.filters.http.bandwidth_limit
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.bandwidth_limit.v3.BandwidthLimit
                      stat_prefix: default
                      enable_mode: REQUEST_AND_RESPONSE
                      limit_kbps: 10
                      fill_interval: 0.05s
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: c_backend_b
      type: STRICT_DNS
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: c_backend_b
        endpoints:
          - lb_endpoints:
              - endpoint: { address: { socket_address: { address: host.docker.internal, port_value: {{.BackendPort}} } } }
