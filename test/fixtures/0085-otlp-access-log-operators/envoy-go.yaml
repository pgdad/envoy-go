# envoy-go bootstrap for fixture 0085-otlp-access-log-operators.
#
# Functionally equivalent to envoy.yaml modulo:
#   - cluster type: STATIC (envoy-go convention per ADR-0002) vs STRICT_DNS.
#   - cluster endpoint addresses: 127.0.0.1 (envoy-go runs on the host loopback)
#     vs host.docker.internal (reference Envoy runs in a Docker container).
#   - admin/listener ports independently allocated by the runner.
#
# Single-listener plaintext H1 topology: one downstream HTTP/1.1 listener routes
# every request to the HTTPFixedBody backend (cluster c_backend); the HCM carries
# one `access_log[]` OpenTelemetryAccessLogConfig entry that exports an OTLP
# LogRecord per completed request to the driver-owned in-process LogsService
# receiver (cluster c_otlp; h2c, no TLS — D-OTLP-RECEIVER).
#
# The access-logger carries command-operator-TEMPLATED content
# (D-OTLP-2-FIXTURE-SHAPE): a templated body, attributes (op_method string,
# nested kvlist, arr array), and resource_attributes (service_name literal +
# authority_literal — a %REQ(:AUTHORITY)%-looking string emitted VERBATIM, NOT
# substituted; AMEND-OPS-1). Cross-side EXACT against the reference engine.
#
# Templating: rendered by the driver's mustRender() at SubjectConfig time.
# Substitution keys:
#   {{.AdminPort}}    — admin endpoint port (runner-allocated).
#   {{.ListenerPort}} — l_test listener port (runner-allocated).
#   {{.BackendPort}}  — HTTPFixedBody backend port (runner-allocated).
#   {{.OTLPHost}}     — driver-owned OTLP receiver host (127.0.0.1 for envoy-go).
#   {{.OTLPPort}}     — driver-owned OTLP receiver port (driver-allocated; pre-bound).
admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: {{.AdminPort}} }

static_resources:
  listeners:
    - name: l_test
      address: { socket_address: { address: 0.0.0.0, port_value: {{.ListenerPort}} } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP1
                stat_prefix: hcm_local
                access_log:
                  - name: envoy.access_loggers.open_telemetry
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.open_telemetry.v3.OpenTelemetryAccessLogConfig
                      common_config:
                        log_name: "0085"
                        grpc_service:
                          envoy_grpc:
                            cluster_name: c_otlp
                      body:
                        string_value: "%REQ(:METHOD)% %REQ(:PATH)% %PROTOCOL% %RESPONSE_CODE% %BYTES_SENT%"
                      attributes:
                        values:
                          - key: "op_method"
                            value: { string_value: "%REQ(:METHOD)%" }
                          - key: "nested"
                            value:
                              kvlist_value:
                                values:
                                  - key: "inner_code"
                                    value: { string_value: "%RESPONSE_CODE%" }
                                  - key: "inner_authority"
                                    value: { string_value: "%REQ(:AUTHORITY)%" }
                          - key: "arr"
                            value:
                              array_value:
                                values:
                                  - { string_value: "%REQ(:METHOD)%" }
                                  - { string_value: "literal-elem" }
                      resource_attributes:
                        values:
                          - key: "service_name"
                            value: { string_value: "envoy-go-test" }
                          - key: "authority_literal"
                            value: { string_value: "%REQ(:AUTHORITY)%" }
                route_config:
                  name: rc_test
                  virtual_hosts:
                    - name: vh_test
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: c_backend }
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    # c_backend: HTTPFixedBody subprocess (17-byte fixed body) on host loopback.
    - name: c_backend
      type: STATIC
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: c_backend
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: 127.0.0.1, port_value: {{.BackendPort}} }
    # c_otlp: driver-owned in-process OTLP LogsService gRPC receiver on host
    # loopback. MANDATORY http2_protocol_options: {} for gRPC framing. Plaintext
    # h2c — no TLS (D-OTLP-RECEIVER).
    - name: c_otlp
      type: STATIC
      lb_policy: ROUND_ROBIN
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: c_otlp
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: {{.OTLPHost}}, port_value: {{.OTLPPort}} }
