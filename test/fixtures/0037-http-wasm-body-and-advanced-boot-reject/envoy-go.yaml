# envoy-go bootstrap for fixture 0037-http-wasm-body-and-advanced-boot-reject.
#
# Per phase 25.2 SPEC §6.4 + §8.2 + D-25.2-P1 closure at 25.2 IMPL Task 21.
# This file is a DOCUMENTATION ARTIFACT — the actual bootstrap is
# synthesized inline in renderBootRejectBootstrap() (driver.go) per
# Option B2 (fixture-0029 / 0031 / 0033 / 0035 precedent).
#
# # Subject-side boot-reject arm
#
# The subject-side trigger is the envoy-go-strict-only PARSE-REJECT arm
# 19 (parseRejectEnvoyGoStrictBodyBufferCapBytesZero) at
# internal/filter/http/wasm/compiled_config.go line 302:
#   "wasm: config.envoy_go_strict_body_buffer_cap_bytes must be > 0
#   (envoy-go-strict)"
# Substring assertion: "envoy_go_strict_body_buffer_cap_bytes" (37
# chars; verbatim per D-25.2-P1 closure).
#
# # Parsing order
#
# envoy-go's buildCompiledConfig (compiled_config.go lines 844-862)
# orders cap-field validators (arms 19-23) BEFORE resolveDataSource —
# so arm 19 fires before the .wasm file is even read. The filename
# field below is spliced for symmetry of diagnostic + reference-side
# bind-mount, but envoy-go's subject never opens it.
#
# Runtime discriminator: envoy.wasm.runtime.wazero per AMEND-A1. (Arm
# 11 — runtime discriminator — fires BEFORE arm 19, so an unsupported
# runtime string would short-circuit the arm 19 PARSE-REJECT and break
# the cross-side substring assertion.)
#
# NOTE: The driver's renderBootRejectBootstrap() is the authoritative
# source. This file documents the intended shape for operator reference.
admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: 9902 }

static_resources:
  listeners:
    - name: l_test_a
      address: { socket_address: { address: 0.0.0.0, port_value: 10138 } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP1
                stat_prefix: hcm_bootreject_37
                route_config:
                  name: rc_bootreject_37
                  virtual_hosts:
                    - name: vh_bootreject_37
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: c_unused }
                http_filters:
                  - name: envoy.filters.http.wasm
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.wasm.v3.Wasm
                      config:
                        name: plugin_bootreject_37
                        root_id: rootid_bootreject_37
                        vm_config:
                          vm_id: vm_bootreject_37
                          runtime: envoy.wasm.runtime.wazero  # per AMEND-A1
                          code:
                            local:
                              # Splice the same .wasm path as the reference
                              # side — never read by envoy-go subject because
                              # arm 19 fires at buildCompiledConfig BEFORE
                              # resolveDataSource per compiled_config.go
                              # lines 844-862 ordering.
                              filename: /tmp/probe.wasm
                        configuration:
                          "@type": type.googleapis.com/google.protobuf.Struct
                          value:
                            envoy_go_strict:
                              body_buffer_cap_bytes: 0  # arm 19 trigger
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: c_unused
      type: STATIC
      connect_timeout: 0.25s
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: c_unused
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: 127.0.0.1, port_value: 1 }
