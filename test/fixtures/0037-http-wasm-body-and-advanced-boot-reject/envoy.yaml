# Reference Envoy bootstrap for fixture 0037-http-wasm-body-and-advanced-boot-reject.
#
# Per phase 25.2 SPEC §6.4 + §8.2 + D-25.2-P1 closure at 25.2 IMPL Task 21.
# This file is a DOCUMENTATION ARTIFACT — the actual bootstrap is
# synthesized inline in renderBootRejectBootstrap() (driver.go) per
# Option B2 (fixture-0029 / 0031 / 0033 / 0035 precedent).
#
# # Subject-only boot-reject arm
#
# The subject-side trigger is the envoy-go-strict-only PARSE-REJECT arm
# 19 (parseRejectEnvoyGoStrictBodyBufferCapBytesZero) at
# internal/filter/http/wasm/compiled_config.go line 302:
#   "wasm: config.envoy_go_strict_body_buffer_cap_bytes must be > 0
#   (envoy-go-strict)"
#
# The reference Envoy v1.37.2 side BOOTS SUCCESSFULLY against the SAME
# config — the `envoy_go_strict` key inside `configuration.value` is
# silently dropped by upstream's protobuf Struct parser (upstream has
# no equivalent extension field). The wasm filter then loads the
# bind-mounted .wasm blob normally + admin /ready returns 200.
#
# # Bytecode reuse
#
# The reference side uses a real .wasm blob bind-mounted at
# `/bytecode/probe.wasm` inside the container — the host-side path is
# `test/fixtures/0036-http-wasm-body-and-advanced/bytecode/a_body_read_only.wasm`
# (REUSED from sibling fixture-0036 per Task 20 wasm-source). The blob
# compiles cleanly under both V8 (upstream) and wazero (subject) per
# Task 20 acceptance. The subject-side never reads the .wasm file —
# arm 19 fires at buildCompiledConfig BEFORE resolveDataSource per
# compiled_config.go lines 844-862 ordering.
#
# NOTE: The driver's renderBootRejectBootstrap() is the authoritative
# source. This file documents the intended shape for operator reference.
admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: 9901 }

static_resources:
  listeners:
    - name: l_test_a
      address: { socket_address: { address: 0.0.0.0, port_value: 10137 } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP1
                stat_prefix: hcm_bootreject_37
                route_config:
                  name: rc_bootreject_37
                  virtual_hosts:
                    - name: vh_bootreject_37
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: c_unused }
                http_filters:
                  - name: envoy.filters.http.wasm
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.wasm.v3.Wasm
                      config:
                        name: plugin_bootreject_37
                        root_id: rootid_bootreject_37
                        vm_config:
                          vm_id: vm_bootreject_37
                          runtime: envoy.wasm.runtime.v8  # upstream default
                          code:
                            local:
                              filename: /bytecode/probe.wasm
                        configuration:
                          "@type": type.googleapis.com/google.protobuf.Struct
                          value:
                            envoy_go_strict:
                              # body_buffer_cap_bytes: 0 is the SUBJECT-side
                              # arm-19 PARSE-REJECT trigger. The reference
                              # silently DROPS the unknown envoy_go_strict
                              # extension key — boot proceeds successfully.
                              body_buffer_cap_bytes: 0
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: c_unused
      type: STATIC
      connect_timeout: 0.25s
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: c_unused
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: 127.0.0.1, port_value: 1 }
