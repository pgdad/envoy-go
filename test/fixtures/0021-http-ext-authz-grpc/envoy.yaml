# Reference Envoy bootstrap for fixture 0021-http-ext-authz-grpc.
#
# Three-listener plaintext topology per SPEC §7.2 + planner-time decision D10:
#
#   l_test_a (port {{.LATestPort}}) — scenarios 1+2+5+6+7+8.
#     failure_mode_allow: false (default).
#     Auth cluster: c_authz_grpc (LIVE; in-process gRPC Authorization/Check
#     server at host.docker.internal:{{.AuthPort}}; h2c).
#     with_request_body{max_request_bytes: 8192, allow_partial_message: true}
#     for S5 body-inspection (listener-level; covers /scenario5).
#     Per-route overrides:
#       /disabled → ExtAuthzPerRoute{disabled: true}                 (S6)
#       /ctx      → ExtAuthzPerRoute{check_settings.context_extensions:
#                       {policy: "scenario7"}}                       (S7)
#
#   l_test_b (port {{.LBTestPort}}) — scenario 3.
#     failure_mode_allow: false; status_on_error: ServiceUnavailable (503).
#     Same c_authz_grpc cluster reference. The driver STOPS the auth server
#     before scenario 3 → gRPC dial fails → dispError → 503 LocalReply.
#
#   l_test_c (port {{.LCTestPort}}) — scenario 4.
#     failure_mode_allow: true; failure_mode_allow_header_add: true.
#     Same c_authz_grpc cluster reference. The driver STOPS the auth server
#     before scenario 4 → gRPC dial fails → dispError → request PROCEEDS to
#     backend with x-envoy-auth-failure-mode-allowed: true injected upstream.
#
# Clusters:
#   c_backend:    STRICT_DNS → {{.BackendHost}}:{{.BackendPort}}
#   c_authz_grpc: STRICT_DNS → {{.AuthHost}}:{{.AuthPort}} with mandatory
#                 typed_extension_protocol_options.HttpProtocolOptions
#                 .explicit_http_config.http2_protocol_options: {} for gRPC
#                 framing per SPEC §11.P13 + §6.5 (UseH2() == true gate).
#
# Templating: rendered by the driver's mustRender() at ReferenceBootstrap time.
# Substitution keys:
#   {{.AdminPort}}    — admin endpoint port (hard-coded 9901 by driver).
#   {{.LATestPort}}   — l_test_a in-container port (10021 per fixture convention).
#   {{.LBTestPort}}   — l_test_b in-container port (10022).
#   {{.LCTestPort}}   — l_test_c in-container port (10023).
#   {{.BackendHost}}  — echobackend host (host.docker.internal per ADR-0010).
#   {{.BackendPort}}  — echobackend port (runner-allocated).
#   {{.AuthHost}}     — live gRPC auth server host (host.docker.internal for ref).
#   {{.AuthPort}}     — live gRPC auth server port (driver-allocated; bound by
#                       the in-process server before any request fires).
#
# Cluster type: STRICT_DNS so the reference Envoy container can resolve
# host.docker.internal (the Docker bridge host alias per ADR-0010).
# dns_lookup_family: V4_ONLY per phase-14/15/16/17/18.1 precedent.
admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: {{.AdminPort}} }

static_resources:
  listeners:
    # === l_test_a — failure_mode_allow:false + live gRPC auth (c_authz_grpc) ===
    # Scenarios 1 (gRPC allow), 2 (gRPC deny), 5 (with_request_body),
    # 6 (per-route disabled), 7 (per-route context_extensions), 8 (OkHttpResponse mutation).
    - name: l_test_a
      address: { socket_address: { address: 0.0.0.0, port_value: {{.LATestPort}} } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP1
                stat_prefix: hcm_local_a
                route_config:
                  name: rc_test_a
                  virtual_hosts:
                    - name: vh_test_a
                      domains: ["*"]
                      routes:
                        # Scenario 1: gRPC allow — auth returns OK + OkHttpResponse{}.
                        - match: { path: "/scenario1" }
                          route: { cluster: c_backend }
                        # Scenario 2: gRPC deny — auth returns PERMISSION_DENIED +
                        # DeniedResponse{403, body, headers}. Body + headers applied verbatim
                        # (gRPC-mode does NOT filter through allowed_client_headers).
                        - match: { path: "/scenario2" }
                          route: { cluster: c_backend }
                        # Scenario 5: with_request_body POST — listener-level with_request_body
                        # active; the filter buffers the body (ADR-0128) and attaches it to
                        # AttributeContext.request.http.body per pack_as_bytes discipline.
                        - match: { path: "/scenario5" }
                          route: { cluster: c_backend }
                        # Scenario 6: per-route disabled — ExtAuthzPerRoute{disabled: true}.
                        # No auth call; no ext_authz counter increments.
                        - match: { path: "/disabled" }
                          route: { cluster: c_backend }
                          typed_per_filter_config:
                            envoy.filters.http.ext_authz:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                              disabled: true
                        # Scenario 7: per-route check_settings.context_extensions — populates
                        # AttributeContext.context_extensions["policy"] = "scenario7"; the
                        # auth server's /ctx script echoes the policy back via the
                        # x-authz-policy upstream header (coarse confirmation).
                        - match: { path: "/ctx" }
                          route: { cluster: c_backend }
                          typed_per_filter_config:
                            envoy.filters.http.ext_authz:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                              check_settings:
                                context_extensions:
                                  policy: scenario7
                        # Scenario 8: OkHttpResponse upstream mutation — auth returns OK
                        # with 4 header mutations (one per append_action arm) +
                        # headers_to_remove:[user-agent]. The echo backend reflects the
                        # upstream-arrival headers in its response body.
                        - match: { path: "/scenario8" }
                          route: { cluster: c_backend }
                http_filters:
                  - name: envoy.filters.http.ext_authz
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
                      transport_api_version: V3
                      # failure_mode_allow: false is the proto default — not emitted.
                      # with_request_body: enabled for S5 — the filter buffers up to
                      # 8192 bytes (allow_partial_message:true) and attaches to
                      # AttributeContext.request.http.body before invoking the auth Check.
                      with_request_body:
                        max_request_bytes: 8192
                        allow_partial_message: true
                      grpc_service:
                        envoy_grpc:
                          cluster_name: c_authz_grpc
                        timeout: 10s
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

    # === l_test_b — failure_mode_allow:false + status_on_error:503 + auth-down at request time ===
    # Scenario 3: driver stops the auth server before request → gRPC dial fails →
    # dispError → 503 LocalReply with empty body.
    - name: l_test_b
      address: { socket_address: { address: 0.0.0.0, port_value: {{.LBTestPort}} } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP1
                stat_prefix: hcm_local_b
                route_config:
                  name: rc_test_b
                  virtual_hosts:
                    - name: vh_test_b
                      domains: ["*"]
                      routes:
                        # Scenario 3: error path — auth dial fails; 503 returned.
                        - match: { path: "/scenario3" }
                          route: { cluster: c_backend }
                http_filters:
                  - name: envoy.filters.http.ext_authz
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
                      transport_api_version: V3
                      # failure_mode_allow: false (proto default; NOT emitted).
                      # status_on_error: 503 ServiceUnavailable — returned on dispError.
                      status_on_error:
                        code: ServiceUnavailable
                      grpc_service:
                        envoy_grpc:
                          cluster_name: c_authz_grpc
                        timeout: 10s
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

    # === l_test_c — failure_mode_allow:true + failure_mode_allow_header_add:true ===
    # Scenario 4: driver stops the auth server before request → gRPC dial fails →
    # dispError → request PROCEEDS to backend with x-envoy-auth-failure-mode-allowed: true
    # injected upstream.
    - name: l_test_c
      address: { socket_address: { address: 0.0.0.0, port_value: {{.LCTestPort}} } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP1
                stat_prefix: hcm_local_c
                route_config:
                  name: rc_test_c
                  virtual_hosts:
                    - name: vh_test_c
                      domains: ["*"]
                      routes:
                        # Scenario 4: failure_mode_allow path — auth dial fails; allowed through.
                        - match: { path: "/scenario4" }
                          route: { cluster: c_backend }
                http_filters:
                  - name: envoy.filters.http.ext_authz
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
                      transport_api_version: V3
                      failure_mode_allow: true
                      failure_mode_allow_header_add: true
                      grpc_service:
                        envoy_grpc:
                          cluster_name: c_authz_grpc
                        timeout: 10s
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    # c_backend: echobackend subprocess (HTTP/1.1) reached via host.docker.internal
    # from the reference Envoy container per ADR-0010.
    - name: c_backend
      type: STRICT_DNS
      connect_timeout: 1s
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: c_backend
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: {{.BackendHost}}, port_value: {{.BackendPort}} }
    # c_authz_grpc: in-process gRPC Authorization/Check server (live across S1+2+5+6+7+8
    # via l_test_a; stopped+restarted by the driver around S3+4 via l_test_b/c).
    # MANDATORY http2_protocol_options: {} for gRPC framing per SPEC §11.P13 + §6.5
    # (UseH2() == true PARSE-REJECT gate). Plaintext h2c — no TLS in phase 18.2 fixtures
    # (§7.2 known testing gap; TLS-plumbing closure is §11.P13 in-session-RATIFIED, not
    # fixture-exercised).
    - name: c_authz_grpc
      type: STRICT_DNS
      connect_timeout: 1s
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: c_authz_grpc
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: {{.AuthHost}}, port_value: {{.AuthPort}} }
