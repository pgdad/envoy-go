# envoy-go bootstrap for fixture 0115-tracing-custom-tags-metadata-route.
#
# Functionally equivalent to envoy.yaml modulo:
#   - cluster type: STATIC (envoy-go convention per ADR-0002) vs STRICT_DNS.
#   - cluster endpoint addresses: 127.0.0.1 (envoy-go runs on the host loopback)
#     vs host.docker.internal (reference Envoy runs in a Docker container).
#   - admin/listener ports independently allocated by the runner.
#
# Single-listener plaintext H1 topology, cloned from
# 0114-tracing-custom-tags-metadata WITHOUT the Lua http_filter/writer: one
# downstream HTTP/1.1 listener routes every request to the HTTPFixedBody
# backend (cluster c_backend). The HCM carries a `tracing` block (OpenTelemetry
# provider, service_name "0115", random_sampling 100%) naming c_otlp_collector,
# which points at the driver-owned in-process otlptrace.Server receiver on the
# host loopback. envoy-go exports one OTLP Span per completed request via the
# OTLPExporter (phase 46.1b).
#
# phase 71: the matched route carries a STATIC route.metadata.filter_metadata
# block (namespace "envoy.test", key "route_k", value "v-route-0115") — parsed
# from Route.metadata at HCM build time (internal/filter/hcm/config.go:616
# `metadata: r.GetMetadata()`) into routeEntry.metadata, seeded onto the
# FilterChain via SetRouteMetadata before RunDecodeHeaders, and read by the
# ROUTE `metadata` custom_tags resolver via chain.RouteMetaLookup. NO writer is
# needed — both sides read the IDENTICAL static route config, so the resolved
# value is cross-side EXACT. The `tracing` block carries TWO ROUTE `metadata`
# custom_tags:
#   route_hit     — metadata_key {key: envoy.test, path:[route_k]} → resolves to
#                   the static route value "v-route-0115" (default_value UNUSED).
#   route_default — metadata_key {key: envoy.test, path:[absent_k]} → the path is
#                   UNSET → the default_value "fallback-0115" is emitted.
#
# Templating: rendered by the driver's mustRender() at SubjectConfig time.
# Substitution keys:
#   {{.AdminPort}}    — admin endpoint port (runner-allocated).
#   {{.ListenerPort}} — l_test listener port (runner-allocated).
#   {{.BackendPort}}  — HTTPFixedBody backend port (runner-allocated, loopback).
#   {{.OTLPPort}}     — driver-owned OTLP receiver port (driver-allocated; pre-bound
#                       on 0.0.0.0:<port> before the subject starts).
admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: {{.AdminPort}} }

static_resources:
  listeners:
    - name: l_test
      address: { socket_address: { address: 0.0.0.0, port_value: {{.ListenerPort}} } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP1
                stat_prefix: hcm_local
                tracing:
                  provider:
                    name: envoy.tracers.opentelemetry
                    typed_config:
                      "@type": type.googleapis.com/envoy.config.trace.v3.OpenTelemetryConfig
                      grpc_service:
                        envoy_grpc:
                          cluster_name: c_otlp_collector
                      service_name: "0115"
                  random_sampling:
                    value: 100
                  custom_tags:
                  - tag: route_hit
                    metadata:
                      kind:
                        route: {}
                      metadata_key:
                        key: envoy.test
                        path:
                        - key: route_k
                      default_value: unused-default-0115
                  - tag: route_default
                    metadata:
                      kind:
                        route: {}
                      metadata_key:
                        key: envoy.test
                        path:
                        - key: absent_k
                      default_value: fallback-0115
                route_config:
                  name: rc_test
                  virtual_hosts:
                    - name: vh_test
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          metadata:
                            filter_metadata:
                              envoy.test:
                                route_k: v-route-0115
                          route: { cluster: c_backend }
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    # c_backend: HTTPFixedBody subprocess (17-byte fixed body) on host loopback.
    - name: c_backend
      type: STATIC
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: c_backend
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: 127.0.0.1, port_value: {{.BackendPort}} }
    # c_otlp_collector: driver-owned in-process OTLP TraceService gRPC receiver on
    # host loopback. MANDATORY http2_protocol_options: {} for gRPC framing.
    # Plaintext h2c — no TLS (D-OTLP-RECEIVER).
    - name: c_otlp_collector
      type: STATIC
      lb_policy: ROUND_ROBIN
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: c_otlp_collector
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: 127.0.0.1, port_value: {{.OTLPPort}} }
