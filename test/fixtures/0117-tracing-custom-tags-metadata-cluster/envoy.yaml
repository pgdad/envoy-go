# Reference Envoy bootstrap for fixture 0117-tracing-custom-tags-metadata-cluster.
#
# Single-listener plaintext H1 topology, cloned from
# 0116-tracing-custom-tags-metadata-host (the OTLP tracing custom_tags HOST
# metadata chassis) with the static metadata block RELOCATED from the cluster's
# lb_endpoints[0] onto the CLUSTER itself — and with the single cluster SPLIT IN
# TWO so the fixture can DISCRIMINATE the SELECTED cluster from the ONLY
# cluster (the limitation 0116 had to confess).
#
# phase 73: TWO clusters — c_backend_a and c_backend_b — point at the SAME
# single HTTPFixedBody backend host:port and differ ONLY in their
# `metadata.filter_metadata` block, which is a SIBLING of `name:`/`type:` on the
# Cluster message (NOT on lb_endpoints[] — that is 0116's HOST source):
#   c_backend_a  metadata.filter_metadata.envoy.test.cl_k = v-cluster-a-0117
#   c_backend_b  metadata.filter_metadata.envoy.test.cl_k = v-cluster-b-0117
# Two path-prefix routes select between them deterministically:
#   prefix "/a" -> c_backend_a ; prefix "/b" -> c_backend_b
# Because the routing is by PATH and each cluster carries exactly ONE
# lb_endpoint, the LB pick is deterministic and no round-robin spread enters the
# assertion (reference_round_robin_offset_randomized).
#
# NO writer is needed — both sides read the IDENTICAL static cluster config, so
# the resolved value is cross-side EXACT with NO Lua filter in the chain. The
# `tracing` block carries TWO CLUSTER `metadata` custom_tags:
#   cl_hit     — metadata_key {key: envoy.test, path:[cl_k]} -> resolves to the
#                OWNING cluster's static value, so a /a span carries
#                "v-cluster-a-0117" and a /b span carries "v-cluster-b-0117"
#                (default_value UNUSED). Two DIFFERENT values from ONE tag on
#                ONE HCM is the SELECTED-cluster proof.
#   cl_default — metadata_key {key: envoy.test, path:[absent_k]} -> the path is
#                UNSET on BOTH clusters -> the default_value "fallback-0117" is
#                emitted.
# The driver asserts BOTH tags on BOTH paths cross-side EXACT by key AND value.
#
# NOTE the reference gates a CLUSTER-kind tag on the PICKED HOST (the owning
# cluster of the selected upstream endpoint), not on the matched route
# (reference_cluster_tag_gated_on_pick_not_route) — every probe here drives a
# SUCCESSFUL upstream request, so a host is always picked.
#
# The namespace is "envoy.test", NOT "envoy.lb". envoy.lb is not a privileged
# namespace (reference_envoy_lb_namespace_not_privileged); a CLUSTER-kind
# custom_tag can address ANY filter_metadata namespace, and this fixture is the
# cross-side proof of that generality for the CLUSTER source.
#
# STRING VALUES ONLY. A struct-valued or numeric metadata value is NOT
# cross-side comparable: the reference serializes multi-key structs in an
# ARBITRARY key order (Go always sorts), scalar-vs-nested numbers use DIFFERENT
# reference renderers, and top-level scalar numbers render at ~6 significant
# digits on the reference (biting from 1000000 -> 1e+06) vs full precision in
# Go. Envoy's YAML loader additionally coerces any non-integer scalar to a
# string.
#
# Templating: rendered by the driver's mustRender() at ReferenceBootstrap time.
# Substitution keys:
#   {{.AdminPort}}    — admin endpoint port (hard-coded 9901 by driver).
#   {{.ListenerPort}} — l_test in-container port (10117 per fixture convention).
#   {{.BackendHost}}  — HTTPFixedBody backend host (host.docker.internal per ADR-0010).
#   {{.BackendPort}}  — HTTPFixedBody backend port (runner-allocated). BOTH
#                       backend clusters use the SAME host:port.
#   {{.OTLPHost}}     — driver-owned OTLP receiver host (host.docker.internal for ref).
#   {{.OTLPPort}}     — driver-owned OTLP receiver port (driver-allocated; the
#                       in-process otlptrace.Server binds 0.0.0.0:<port> before the
#                       container starts).
#
# Cluster type: STRICT_DNS so the reference Envoy container resolves
# host.docker.internal (the Docker bridge host alias per ADR-0010).
# dns_lookup_family: V4_ONLY per the established fixture precedent. Unlike 0116
# the metadata sits on the CLUSTER rather than the endpoint, so DNS resolution
# is not even in the metadata path here.
admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: {{.AdminPort}} }

static_resources:
  listeners:
    - name: l_test
      address: { socket_address: { address: 0.0.0.0, port_value: {{.ListenerPort}} } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP1
                stat_prefix: hcm_local
                tracing:
                  provider:
                    name: envoy.tracers.opentelemetry
                    typed_config:
                      "@type": type.googleapis.com/envoy.config.trace.v3.OpenTelemetryConfig
                      grpc_service:
                        envoy_grpc:
                          cluster_name: c_otlp_collector
                      service_name: "0117"
                  random_sampling:
                    value: 100
                  custom_tags:
                  - tag: cl_hit
                    metadata:
                      kind:
                        cluster: {}
                      metadata_key:
                        key: envoy.test
                        path:
                        - key: cl_k
                      default_value: unused-default-0117
                  - tag: cl_default
                    metadata:
                      kind:
                        cluster: {}
                      metadata_key:
                        key: envoy.test
                        path:
                        - key: absent_k
                      default_value: fallback-0117
                route_config:
                  name: rc_test
                  virtual_hosts:
                    - name: vh_test
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/a" }
                          route: { cluster: c_backend_a }
                        - match: { prefix: "/b" }
                          route: { cluster: c_backend_b }
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    # c_backend_a / c_backend_b: the SAME HTTPFixedBody subprocess (17-byte fixed
    # body) reached via host.docker.internal from the reference Envoy container
    # per ADR-0010. The two clusters are byte-identical EXCEPT for `name:`,
    # `load_assignment.cluster_name:` and the CLUSTER-level metadata value —
    # which is exactly what makes the cl_hit tag discriminate SELECTED from ONLY.
    # The `metadata:` block is a SIBLING of `name:`/`type:` on the Cluster
    # message; it is NOT on lb_endpoints[] (that is 0116's HOST source).
    - name: c_backend_a
      type: STRICT_DNS
      connect_timeout: 1s
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      metadata:
        filter_metadata:
          envoy.test:
            cl_k: v-cluster-a-0117
      load_assignment:
        cluster_name: c_backend_a
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: {{.BackendHost}}, port_value: {{.BackendPort}} }
    - name: c_backend_b
      type: STRICT_DNS
      connect_timeout: 1s
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      metadata:
        filter_metadata:
          envoy.test:
            cl_k: v-cluster-b-0117
      load_assignment:
        cluster_name: c_backend_b
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: {{.BackendHost}}, port_value: {{.BackendPort}} }
    # c_otlp_collector: driver-owned in-process OTLP TraceService gRPC receiver.
    # MANDATORY http2_protocol_options: {} for gRPC framing. Plaintext h2c — no TLS
    # (D-OTLP-RECEIVER). STRICT_DNS so the container can resolve the bridge hostname.
    # It carries NO metadata block — a CLUSTER tag on a span never resolves from
    # it, since the tracer's own export cluster is not the picked upstream.
    - name: c_otlp_collector
      type: STRICT_DNS
      connect_timeout: 1s
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: c_otlp_collector
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: {{.OTLPHost}}, port_value: {{.OTLPPort}} }
