# envoy-go bootstrap for fixture 0112-stats-sink-otlp (phase 69, ADR-0291).
#
# Functionally equivalent to envoy.yaml modulo:
#   - cluster type: STATIC (envoy-go convention per ADR-0002) vs STRICT_DNS.
#   - cluster endpoint addresses: 127.0.0.1 (envoy-go runs on the host loopback)
#     vs host.docker.internal (reference Envoy runs in a Docker container).
#   - admin/listener ports independently allocated by the runner.
#
# The DEFAULT arm of the open_telemetry OTLP metrics stats sink: knobs ABSENT ⇒
# cumulative temporality + tag-extracted RESIDUAL metric names + tags-as-attributes.
# Every flush envoy-go maps the frozen stats.Registry snapshot to ONE unary OTLP
# ExportMetricsServiceRequest and sends it via the OTLPMetricsSink (phase 69).
#
# Templating (rendered by the driver's mustRender() at SubjectConfig time):
#   {{.AdminPort}}    — admin endpoint port (runner-allocated).
#   {{.ListenerPort}} — l_test listener port (runner-allocated).
#   {{.BackendPort}}  — HTTPFixedBody backend port (runner-allocated, loopback).
#   {{.BackendName}}  — backend cluster name (FIXED identical both sides).
#   {{.StatPrefix}}   — HCM stat_prefix (FIXED identical both sides).
#   {{.OTLPPort}}     — driver-owned OTLP receiver port (driver-allocated;
#                       pre-bound on 0.0.0.0:<port> before the subject starts).

admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: {{.AdminPort}} }

# Bootstrap-level stats sink: the open_telemetry OTLP metrics gRPC sink. NO knob
# fields — the DEFAULT arm. grpc_service.envoy_grpc names the c_otlp cluster (h2c).
# A SHORT stats_flush_interval (0.1s) drives fast deterministic convergence.
stats_sinks:
  - name: envoy.stat_sinks.open_telemetry
    typed_config:
      "@type": type.googleapis.com/envoy.extensions.stat_sinks.open_telemetry.v3.SinkConfig
      grpc_service:
        envoy_grpc:
          cluster_name: c_otlp
stats_flush_interval: 0.1s

static_resources:
  listeners:
    - name: l_test
      address: { socket_address: { address: 0.0.0.0, port_value: {{.ListenerPort}} } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP1
                stat_prefix: {{.StatPrefix}}
                route_config:
                  name: rc_test
                  virtual_hosts:
                    - name: vh_test
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: {{.BackendName}} }
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    # backend: HTTPFixedBody subprocess (17-byte fixed body) on host loopback.
    - name: {{.BackendName}}
      type: STATIC
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: {{.BackendName}}
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: 127.0.0.1, port_value: {{.BackendPort}} }
    # c_otlp: driver-owned in-process OTLP MetricsService gRPC receiver on host
    # loopback. MANDATORY http2_protocol_options: {} for gRPC framing.
    # Plaintext h2c — no TLS.
    - name: c_otlp
      type: STATIC
      lb_policy: ROUND_ROBIN
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: c_otlp
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: 127.0.0.1, port_value: {{.OTLPPort}} }
