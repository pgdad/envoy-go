# envoy-go bootstrap for fixture 0094-stats-sink-dogstatsd-batching.
#
# Functionally equivalent to envoy.yaml modulo:
#   - cluster type: STATIC (envoy-go convention per ADR-0002) vs STRICT_DNS.
#   - cluster endpoint addresses: 127.0.0.1 (envoy-go runs on the host loopback)
#     vs host.docker.internal (reference Envoy runs in a Docker container).
#   - admin/listener ports independently allocated by the runner.
#   - dog_statsd receiver address: 127.0.0.1:<subjStatsdPort> (subject loopback)
#     vs <HostGatewayIP>:<refStatsdPort> (bridge gateway for the reference
#     container).
#
# Single-listener plaintext H1 topology: one downstream HTTP/1.1 listener routes
# every request to the HTTPFixedBody backend (cluster {{.BackendName}}). A
# bootstrap-level stats_sinks[] dog_statsd entry (DogStatsdSink TypeURL, UDP
# address 127.0.0.1:<subjStatsdPort>, prefix, an EXPLICIT max_bytes_per_datagram
# cap — ADR-0267, honored not strict-rejected) points at the driver-owned
# in-process statsdrecv UDP receiver. A SHORT stats_flush_interval (500ms)
# drives fast deterministic convergence.
#
# See envoy.yaml's header comment for the full D-DSDB-CAP batching design
# rationale (the deliberately-long backendName forcing oversized cluster-tagged
# lines to always flush alone, vs the short statPrefix keeping HCM-tagged lines
# small enough to co-batch) — identical on this side.
#
# NO node field is needed — dog_statsd carries no proxy identifier.
#
# Templating: rendered by the driver's mustRender() at SubjectConfig time.
# Substitution keys:
#   {{.AdminPort}}     — admin endpoint port (runner-allocated).
#   {{.ListenerPort}}  — l_test listener port (runner-allocated).
#   {{.BackendPort}}   — HTTPFixedBody backend port (runner-allocated, loopback).
#   {{.BackendName}}   — backend cluster name (FIXED identical both sides).
#   {{.StatPrefix}}    — HCM stat_prefix (FIXED identical both sides).
#   {{.DogStatsdHost}} — statsdrecv receiver host (127.0.0.1 for subject loopback).
#   {{.DogStatsdPort}} — statsdrecv receiver port (driver-allocated).
#   {{.Prefix}}        — dog_statsd metric prefix (baked identically on both sides).
#   {{.MaxBytesPerDatagram}} — the configured batching cap (D-DSDB-CAP, ADR-0267).

admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: {{.AdminPort}} }

# Bootstrap-level stats sink: the dog_statsd UDP sink, now with an EXPLICIT
# max_bytes_per_datagram cap (ADR-0267 — honored, not strict-rejected).
# address.socket_address carries 127.0.0.1:<subjStatsdPort> — the driver-owned
# in-process statsdrecv receiver on the host loopback. A SHORT
# stats_flush_interval (500ms) drives fast deterministic convergence. prefix is
# baked identically on both sides.
stats_sinks:
  - name: envoy.stat_sinks.dog_statsd
    typed_config:
      "@type": type.googleapis.com/envoy.config.metrics.v3.DogStatsdSink
      address:
        socket_address: { protocol: UDP, address: {{.DogStatsdHost}}, port_value: {{.DogStatsdPort}} }
      prefix: {{.Prefix}}
      max_bytes_per_datagram: {{.MaxBytesPerDatagram}}
stats_flush_interval: 0.5s

static_resources:
  listeners:
    - name: l_test
      address: { socket_address: { address: 0.0.0.0, port_value: {{.ListenerPort}} } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP1
                stat_prefix: {{.StatPrefix}}
                route_config:
                  name: rc_test
                  virtual_hosts:
                    - name: vh_test
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: {{.BackendName}} }
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    # backend: HTTPFixedBody subprocess (17-byte fixed body) on host loopback.
    - name: {{.BackendName}}
      type: STATIC
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: {{.BackendName}}
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: 127.0.0.1, port_value: {{.BackendPort}} }
