# envoy-go bootstrap for fixture 0019-http-jwt-authn.
#
# Functionally equivalent to envoy.yaml modulo:
#   - cluster type: STATIC (envoy-go convention) vs STRICT_DNS (reference Envoy).
#   - cluster endpoint addresses: 127.0.0.1 (envoy-go is in-process on the host)
#     vs host.docker.internal (reference Envoy runs in a Docker container).
#   - admin/listener ports independently allocated by the runner per proxy.
#
# Single-listener plaintext topology per SPEC §7.4 (mirrors envoy.yaml shape):
#   l_test_a — plaintext HCM with filter chain `jwt_authn → router`.
#              Listener-level JwtAuthentication carries 3 providers
#              (provider-rs256 RemoteJwks, provider-es256 LocalJwks inline,
#              provider-alt RemoteJwks) + 1 requirement_map entry (alt-req) +
#              bypass_cors_preflight: true. Three routes:
#                /                  → cluster c_backend (scenarios 1-6).
#                /alt-req           → cluster c_backend + per-route TPFC
#                                     JwtAuthentication{requirement_name: "alt-req"}.
#                /per-route-disabled → cluster c_backend + per-route TPFC
#                                     PerRouteConfig{disabled: true}.
#
# Templating: rendered by the driver's mustRender() at SubjectConfig time.
# Substitution keys (note: NO BackendHost; envoy-go always uses 127.0.0.1):
#   {{.AdminPort}}            — admin endpoint port (runner-allocated).
#   {{.LATestPort}}           — l_test_a listener port (runner-allocated).
#   {{.BackendPort}}          — echobackend port (runner-allocated).
#   {{.JWKSHost}}             — jwksbackend host (always "127.0.0.1" for envoy-go).
#   {{.JWKSPort}}             — jwksbackend port (runner-allocated by driver).
#   {{.LocalJWKSES256Inline}} — provider-es256's LocalJwks inline_string content
#                               (JWK Set JSON for the ES256 public key).
#
# Cluster c_backend: STATIC at 127.0.0.1:<BackendPort> (echobackend subprocess
# on the host loopback). Cluster c_jwks_backend: STATIC at 127.0.0.1:<JWKSPort>
# (jwksbackend in-process; same Go process as envoy-go since both are part of
# the differential test binary).
#
# The differential gate requires byte-exact body equivalence + counter
# equivalence between this side and envoy.yaml's reference side across all 8
# scenarios per SPEC §7.5.
admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: {{.AdminPort}} }

static_resources:
  listeners:
    # === l_test_a — plaintext HCM with listener-level JwtAuthentication ===
    - name: l_test_a
      address: { socket_address: { address: 0.0.0.0, port_value: {{.LATestPort}} } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP1
                stat_prefix: hcm_local_a
                route_config:
                  name: rc_test_a
                  virtual_hosts:
                    - name: vh_test_a
                      domains: ["*"]
                      routes:
                        - match: { path: "/" }
                          route: { cluster: c_backend }
                        - match: { path: "/alt-req" }
                          route: { cluster: c_backend }
                          typed_per_filter_config:
                            envoy.filters.http.jwt_authn:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.PerRouteConfig
                              requirement_name: alt-req
                        - match: { path: "/per-route-disabled" }
                          route: { cluster: c_backend }
                          typed_per_filter_config:
                            envoy.filters.http.jwt_authn:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.PerRouteConfig
                              disabled: true
                http_filters:
                  - name: envoy.filters.http.jwt_authn
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication
                      bypass_cors_preflight: true
                      providers:
                        provider-rs256:
                          issuer: https://issuer-rs.example.com
                          audiences: [api-rs]
                          remote_jwks:
                            http_uri:
                              uri: http://{{.JWKSHost}}:{{.JWKSPort}}/.well-known/jwks-rs.json
                              cluster: c_jwks_backend
                              timeout: 1s
                            cache_duration: 300s
                        provider-es256:
                          issuer: https://issuer-es.example.com
                          audiences: [api-es]
                          local_jwks:
                            inline_string: '{{.LocalJWKSES256Inline}}'
                        provider-alt:
                          issuer: https://issuer-alt.example.com
                          audiences: [api-alt]
                          remote_jwks:
                            http_uri:
                              uri: http://{{.JWKSHost}}:{{.JWKSPort}}/.well-known/jwks-alt.json
                              cluster: c_jwks_backend
                              timeout: 1s
                            cache_duration: 300s
                      rules:
                        - match: { prefix: / }
                          requires:
                            requires_any:
                              requirements:
                                - provider_name: provider-rs256
                                - provider_name: provider-es256
                      requirement_map:
                        alt-req:
                          provider_name: provider-alt
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    # c_backend: echobackend subprocess on host loopback.
    - name: c_backend
      type: STATIC
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: c_backend
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: 127.0.0.1, port_value: {{.BackendPort}} }
    # c_jwks_backend: jwksbackend in-process helper on host loopback.
    - name: c_jwks_backend
      type: STATIC
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: c_jwks_backend
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: {{.JWKSHost}}, port_value: {{.JWKSPort}} }
