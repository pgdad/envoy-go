# Reference Envoy bootstrap for fixture 0019-http-jwt-authn.
#
# Single-listener plaintext topology per SPEC §7.4 (no mTLS in phase 17):
#   l_test_a — plaintext HCM with filter chain `jwt_authn → router`.
#              Listener-level JwtAuthentication config carries 3 providers
#              (provider-rs256 RemoteJwks, provider-es256 LocalJwks inline,
#              provider-alt RemoteJwks) + 1 requirement_map entry (alt-req) +
#              bypass_cors_preflight: true. Three routes:
#                /                  → cluster c_backend (scenarios 1-6).
#                /alt-req           → cluster c_backend + per-route TPFC
#                                     JwtAuthentication{requirement_name: "alt-req"}
#                                     (scenario 7, 8th-canonical delegation).
#                /per-route-disabled → cluster c_backend + per-route TPFC
#                                     PerRouteConfig{disabled: true}
#                                     (scenario 8, 8th-canonical disabled).
#
# Templating: rendered by the driver's mustRender() at ReferenceBootstrap time.
# Substitution keys:
#   {{.AdminPort}}            — admin endpoint port (reference container).
#   {{.LATestPort}}           — l_test_a listener port (10019 per fixture convention).
#   {{.BackendHost}}          — echobackend host (host.docker.internal per ADR-0010).
#   {{.BackendPort}}          — echobackend port (runner-allocated).
#   {{.JWKSHost}}             — jwksbackend host (host.docker.internal — reference
#                               Envoy runs in a Docker container).
#   {{.JWKSPort}}             — jwksbackend port (runner-allocated by driver).
#   {{.LocalJWKSES256Inline}} — provider-es256's LocalJwks inline_string content
#                               (JWK Set JSON for the ES256 public key).
#
# Cluster c_backend: STRICT_DNS to host.docker.internal:<BackendPort> per
# ADR-0010 (reference Envoy reaches host-spawned echobackend via the docker
# bridge). dns_lookup_family: V4_ONLY per phase-14/15/16 precedent.
# Cluster c_jwks_backend: STRICT_DNS to host.docker.internal:<JWKSPort>
# serving the JWK Set JSON for provider-rs256 + provider-alt at
# /.well-known/jwks-rs.json + /.well-known/jwks-alt.json.
#
# Note on JWK Set path → provider mapping:
#   provider-rs256 → http://<jwks>/.well-known/jwks-rs.json
#   provider-alt   → http://<jwks>/.well-known/jwks-alt.json
#   provider-es256 → LocalJwks inline_string (NO JWKS fetch; scenarios 2 path).
#
# WWW-Authenticate canonical realm: "/" (matches the jwt_verify_lib default
# emitted by reference Envoy per SPEC §1.1 amendment 12). Scenario 3
# (JwtMissed) omits the `, error="invalid_token"` suffix per amendment 12;
# scenarios 4 + 5 include it.
admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: {{.AdminPort}} }

static_resources:
  listeners:
    # === l_test_a — plaintext HCM with listener-level JwtAuthentication ===
    - name: l_test_a
      address: { socket_address: { address: 0.0.0.0, port_value: {{.LATestPort}} } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP1
                stat_prefix: hcm_local_a
                route_config:
                  name: rc_test_a
                  virtual_hosts:
                    - name: vh_test_a
                      domains: ["*"]
                      routes:
                        # Scenarios 1-6: default JWT authentication applies via
                        # the listener-level rule `prefix: /` → requires_any
                        # [provider-rs256, provider-es256].
                        - match: { path: "/" }
                          route: { cluster: c_backend }
                        # Scenario 7: per-route 8th-canonical delegation via
                        # requirement_name. PerRouteConfig.requirement_name
                        # resolves to listener.requirement_map["alt-req"] =
                        # {provider_name: provider-alt}.
                        - match: { path: "/alt-req" }
                          route: { cluster: c_backend }
                          typed_per_filter_config:
                            envoy.filters.http.jwt_authn:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.PerRouteConfig
                              requirement_name: alt-req
                        # Scenario 8: per-route 8th-canonical disabled — filter
                        # bypass per ADR-0125 §(xiii) case (a). NO counter
                        # emission per SPEC §1.1 amendment 5.
                        - match: { path: "/per-route-disabled" }
                          route: { cluster: c_backend }
                          typed_per_filter_config:
                            envoy.filters.http.jwt_authn:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.PerRouteConfig
                              disabled: true
                http_filters:
                  - name: envoy.filters.http.jwt_authn
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication
                      bypass_cors_preflight: true
                      providers:
                        provider-rs256:
                          issuer: https://issuer-rs.example.com
                          audiences: [api-rs]
                          remote_jwks:
                            http_uri:
                              uri: http://{{.JWKSHost}}:{{.JWKSPort}}/.well-known/jwks-rs.json
                              cluster: c_jwks_backend
                              timeout: 1s
                            cache_duration: 300s
                        provider-es256:
                          issuer: https://issuer-es.example.com
                          audiences: [api-es]
                          local_jwks:
                            inline_string: '{{.LocalJWKSES256Inline}}'
                        provider-alt:
                          issuer: https://issuer-alt.example.com
                          audiences: [api-alt]
                          remote_jwks:
                            http_uri:
                              uri: http://{{.JWKSHost}}:{{.JWKSPort}}/.well-known/jwks-alt.json
                              cluster: c_jwks_backend
                              timeout: 1s
                            cache_duration: 300s
                      rules:
                        - match: { prefix: / }
                          requires:
                            requires_any:
                              requirements:
                                - provider_name: provider-rs256
                                - provider_name: provider-es256
                      requirement_map:
                        alt-req:
                          provider_name: provider-alt
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    # c_backend: echobackend subprocess (HTTP/1.1) reached via host.docker.internal
    # from the reference Envoy container per ADR-0010.
    - name: c_backend
      type: STRICT_DNS
      connect_timeout: 1s
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: c_backend
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: {{.BackendHost}}, port_value: {{.BackendPort}} }
    # c_jwks_backend: in-process jwksbackend test helper (HTTP/1.1) serving
    # /.well-known/jwks-rs.json + /.well-known/jwks-alt.json from the driver-
    # allocated port. Reached via host.docker.internal from the reference
    # Envoy container per ADR-0010.
    - name: c_jwks_backend
      type: STRICT_DNS
      connect_timeout: 1s
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: c_jwks_backend
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: {{.JWKSHost}}, port_value: {{.JWKSPort}} }
