# envoy-go bootstrap for fixture 0016-http-compressor.
# Identical to envoy.yaml modulo:
#   - cluster type: STATIC (envoy-go convention) vs STRICT_DNS (reference Envoy).
#   - backend address: 127.0.0.1 (envoy-go is in-process) vs host.docker.internal.
#   - admin/listener ports independently allocated by the runner per proxy.
#
# Single-listener `l_main` topology per SPEC §7.2 + planner-time decision 11:
# one HCM listener carrying the compressor filter at listener level with
# `compressor_library.name: text_optimized` + Gzip codec + `response_direction_config: {}`
# (defaults — `enabled` omitted per §1.1 amendment 2 = enabled; `min_content_length`
# omitted = 30 per §11.9; `content_type` omitted = 8-entry default list per §11.1;
# `disable_on_etag_header` omitted = false → strong-ETag stripped on compressed
# path per §1.1 amendment 6 mode-a; `remove_accept_encoding_header` omitted = false
# at listener level; per-route override on /per-route-rmae enables).
#
# Both sides use the SAME `compressor_library.name: text_optimized` per SPEC
# §11.5 + ADR-0132 §Decision (v) — load-bearing for stat-namespace identity:
# the 17 emitted counters carry `<library_name>` in their flattened
# `envoy_http_compressor_<library_name>_<codec>_<counter>` Prometheus
# namespace; divergent library names would diverge the stat namespace and
# break per-counter delta equivalence.
#
# Six routes per SPEC §7.2 + driver scenarios per SPEC §7.1:
#   1. /text-html-1024         — direct_response 200; 1024-byte text/html body.
#   2. /image-png-1024         — direct_response 200; 1024-byte image/png body.
#   3. /text-html-10           — direct_response 200; 10-byte text/html body.
#   4. /text-html-etag-strong  — direct_response 200; 1024-byte text/html body + ETag: "abc".
#   5. /per-route-disabled     — direct_response 200; 1024-byte text/html body; CompressorPerRoute{disabled: true}.
#   6. /per-route-rmae         — cluster route to c_backend (echobackend);
#                                  CompressorPerRoute{overrides: {response_direction_config: {remove_accept_encoding_header: true}}}.
admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: {{.AdminPort}} }

static_resources:
  listeners:
    - name: l_main
      address: { socket_address: { address: 0.0.0.0, port_value: {{.ListenerPort}} } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP1
                stat_prefix: ingress_compressor
                route_config:
                  name: rc_main
                  virtual_hosts:
                    - name: vh_main
                      domains: ["*"]
                      routes:
                        - match: { path: "/text-html-1024" }
                          direct_response:
                            status: 200
                            body: { inline_string: "" }
                          response_headers_to_add:
                            - { append_action: OVERWRITE_IF_EXISTS_OR_ADD, header: { key: content-type, value: "text/html" } }
                        - match: { path: "/image-png-1024" }
                          direct_response:
                            status: 200
                            body: { inline_string: "" }
                          response_headers_to_add:
                            - { append_action: OVERWRITE_IF_EXISTS_OR_ADD, header: { key: content-type, value: "image/png" } }
                        - match: { path: "/text-html-10" }
                          direct_response:
                            status: 200
                            body: { inline_string: "AAAAAAAAAA" }
                          response_headers_to_add:
                            - { append_action: OVERWRITE_IF_EXISTS_OR_ADD, header: { key: content-type, value: "text/html" } }
                        - match: { path: "/text-html-etag-strong" }
                          direct_response:
                            status: 200
                            body: { inline_string: "" }
                          response_headers_to_add:
                            - { append_action: OVERWRITE_IF_EXISTS_OR_ADD, header: { key: content-type, value: "text/html" } }
                            - { append_action: OVERWRITE_IF_EXISTS_OR_ADD, header: { key: etag, value: "\"abc\"" } }
                        - match: { path: "/per-route-disabled" }
                          direct_response:
                            status: 200
                            body: { inline_string: "" }
                          response_headers_to_add:
                            - { append_action: OVERWRITE_IF_EXISTS_OR_ADD, header: { key: content-type, value: "text/html" } }
                          typed_per_filter_config:
                            envoy.filters.http.compressor:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.compressor.v3.CompressorPerRoute
                              disabled: true
                        - match: { path: "/per-route-rmae" }
                          route: { cluster: c_backend }
                          typed_per_filter_config:
                            envoy.filters.http.compressor:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.compressor.v3.CompressorPerRoute
                              overrides:
                                response_direction_config:
                                  remove_accept_encoding_header: true
                http_filters:
                  - name: envoy.filters.http.compressor
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.compressor.v3.Compressor
                      compressor_library:
                        name: text_optimized
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.compression.gzip.compressor.v3.Gzip
                      response_direction_config: {}
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: c_backend
      type: STATIC
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: c_backend
        endpoints:
          - lb_endpoints:
              - endpoint: { address: { socket_address: { address: 127.0.0.1, port_value: {{.BackendPort}} } } }
