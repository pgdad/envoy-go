# envoy-go bootstrap for fixture 0030-http-admission-control.
#
# Per phase-23 SPEC §7.1 + §7.3 + AMEND-2 + Task 9 brief. Mirrors
# envoy.yaml's single-listener-per-scenario topology. Subject (envoy-go)
# runs on the host; backend is 127.0.0.1 (loopback) instead of
# host.docker.internal.
#
# Two listeners (mirroring envoy.yaml):
#   l_test_a — admission_control filter (full config; enabled=true default
#              per AMEND-4) + router terminator → c_backend (echobackend).
#              Scenarios (a) parse_ok + (b) all_admit_healthy (CROSS-SIDE
#              byte-exact per AMEND-2 RNG-independence at P=0) + (c) stat_surface.
#   l_test_d — admission_control filter with enabled.default_value=false
#              (pass-through) + router terminator. Scenario (d)
#              pass_through_disabled.
#
# Stat prefix for l_test_a: http.hcm_a.admission_control.{rq_rejected,
# rq_success, rq_failure} — scrape via /stats/prometheus per SPEC §6.6 +
# AMEND-3 (Rule SN2 flattening: envoy_http_admission_control_{stat} +
# label envoy_http_conn_manager_prefix="hcm_a").
#
# Templating: rendered by the driver's SubjectConfig() at runtime.
# Substitution keys:
#   {{.AdminPort}}    — admin endpoint port (runner-allocated).
#   {{.LATestPort}}   — l_test_a listener port (runner-allocated subjListenerPort).
#   {{.LDTestPort}}   — l_test_d listener port (subjListenerPort + 1).
#   {{.BackendPort}}  — echobackend port (runner-allocated).
#
# Cluster c_backend: STATIC + 127.0.0.1 (loopback; subject runs on host).
admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: {{.AdminPort}} }

static_resources:
  listeners:
    # === l_test_a — enabled=true (default), full config (scenarios a/b/c) ===
    - name: l_test_a
      address: { socket_address: { address: 0.0.0.0, port_value: {{.LATestPort}} } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP1
                stat_prefix: hcm_a
                route_config:
                  name: rc_a
                  virtual_hosts:
                    - name: vh_a
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: c_backend }
                http_filters:
                  - name: envoy.filters.http.admission_control
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.admission_control.v3.AdmissionControl
                      success_criteria:
                        http_criteria:
                          http_success_status:
                            - { start: 100, end: 500 }
                        grpc_criteria:
                          grpc_success_status: [0, 1, 2, 3, 5, 6, 7, 9, 11, 12, 16]
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

    # === l_test_d — enabled=false (pass-through, scenario d) ===
    - name: l_test_d
      address: { socket_address: { address: 0.0.0.0, port_value: {{.LDTestPort}} } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP1
                stat_prefix: hcm_d
                route_config:
                  name: rc_d
                  virtual_hosts:
                    - name: vh_d
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: c_backend }
                http_filters:
                  - name: envoy.filters.http.admission_control
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.admission_control.v3.AdmissionControl
                      enabled:
                        default_value: false
                      success_criteria:
                        http_criteria:
                          http_success_status:
                            - { start: 100, end: 500 }
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: c_backend
      type: STATIC
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: c_backend
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: 127.0.0.1
                      port_value: {{.BackendPort}}
