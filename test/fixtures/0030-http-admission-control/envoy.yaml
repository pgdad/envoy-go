# Reference Envoy bootstrap for fixture 0030-http-admission-control.
#
# Per phase-23 SPEC §7.1 + AMEND-2 + Task 9 brief. Two listeners in ONE
# bootstrap host the enabled config (scenarios a-c) + the disabled config
# (scenario d); a single bootstrap (no MultiListenerDriver) avoids the
# freeTCPPort combined-run flake surface per 22.2 REVIEW §7.4 — a documented
# extension of SPEC §7.3's single-listener intent. The admission_control
# filter sits in alphabetical position in the HCM chain with a router
# terminator + always-200 echobackend cluster.
#
# This bootstrap is consumed by the reference Envoy v1.37.2 container (the
# runner's StartReferenceProxy path). The cluster uses STRICT_DNS +
# host.docker.internal (ADR-0010) so the container can reach the host-spawned
# echobackend subprocess. Backend port is runner-allocated.
#
# Listener topology (two listeners in one bootstrap; see header note):
#   l_test_a — admission_control filter (full config: both success_criteria
#              arms + all knobs at defaults; enabled=true by default per
#              AMEND-4) + router terminator → c_backend (echobackend 200).
#              Used for scenario (a) parse_ok + (b) all_admit_healthy
#              (CROSS-SIDE byte-exact per AMEND-2 RNG-independence at P=0)
#              + (c) stat_surface.
#   l_test_d — admission_control filter with enabled.default_value=false
#              (pass-through per §5.3 case 2 / AMEND-4) + router terminator
#              → c_backend. Used for scenario (d) pass_through_disabled.
#
# NOTE: this fixture uses RequiresReference=true + the runner's cross-side
# CompareBytes path. The cross-side byte stream covers l_test_a (scenarios
# a/b/c status lines) plus a fixed placeholder line for scenario (d); both
# ref and subj emit the same bytes, so CompareBytes stays byte-exact.
# DriveReference MUST produce byte-equivalent output: the driver issues the
# SAME requests against both sides, and reference Envoy produces the same
# status bytes as envoy-go (both pass through to the echobackend unmodified
# when P_reject=0). The (c)/(d) subject-only counter checks run in the
# driver's StatsAsserter.AssertStats (which the cross-side path invokes), NOT
# in a SubjectAsserter (that interface is never called on the cross-side path).
#
# Templating: rendered by the driver's ReferenceBootstrap() at runtime.
# Substitution keys:
#   {{.AdminPort}}    — admin endpoint port (9901 for reference container).
#   {{.LATestPort}}   — l_test_a listener port (reference container-fixed).
#   {{.LDTestPort}}   — l_test_d listener port (reference container-fixed).
#   {{.BackendHost}}  — echobackend host (host.docker.internal per ADR-0010).
#   {{.BackendPort}}  — echobackend port (runner-allocated).
#
# Cluster c_backend: STRICT_DNS + host.docker.internal + V4_ONLY per
# ADR-0010 + phase-14/15/16/22 precedent.
admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: {{.AdminPort}} }

static_resources:
  listeners:
    # === l_test_a — enabled=true (default), full config (scenarios a/b/c) ===
    - name: l_test_a
      address: { socket_address: { address: 0.0.0.0, port_value: {{.LATestPort}} } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP1
                stat_prefix: hcm_a
                route_config:
                  name: rc_a
                  virtual_hosts:
                    - name: vh_a
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: c_backend }
                http_filters:
                  - name: envoy.filters.http.admission_control
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.admission_control.v3.AdmissionControl
                      success_criteria:
                        http_criteria:
                          http_success_status:
                            - { start: 100, end: 500 }
                        grpc_criteria:
                          grpc_success_status: [0, 1, 2, 3, 5, 6, 7, 9, 11, 12, 16]
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

    # === l_test_d — enabled=false (pass-through, scenario d) ===
    - name: l_test_d
      address: { socket_address: { address: 0.0.0.0, port_value: {{.LDTestPort}} } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP1
                stat_prefix: hcm_d
                route_config:
                  name: rc_d
                  virtual_hosts:
                    - name: vh_d
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: c_backend }
                http_filters:
                  - name: envoy.filters.http.admission_control
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.admission_control.v3.AdmissionControl
                      enabled:
                        default_value: false
                      success_criteria:
                        http_criteria:
                          http_success_status:
                            - { start: 100, end: 500 }
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: c_backend
      type: STRICT_DNS
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: c_backend
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: {{.BackendHost}}
                      port_value: {{.BackendPort}}
