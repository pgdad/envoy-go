# envoy-go subject bootstrap for fixture 0027-http-lua-full-bridge.
#
# Per phase 22.2 SPEC §8 + D5 closure option (f-B) + D-P11 closure
# (REUSE existing runReferenceLessFixture; NO NEW driver-helper). Same
# 13-listener topology as envoy.yaml — one listener per scenario (a)..
# (m). Cert + script paths are host-side absolute paths under the
# fixture directory (envoy-go runs on the host directly + has read
# access to the fixture tree without any bind-mount step).
#
# Template substitution keys:
#   {{.AdminPort}}    — admin endpoint port (runner-allocated).
#   {{.LATestPort}}.. {{.LMTestPort}} — per-scenario listener ports
#                        (= subjListenerPort + 0..12 consecutive).
#   {{.BackendPort}}  — echobackend port (runner-allocated; 127.0.0.1 host).
#   {{.ScriptA}}.. {{.ScriptM}} — host-side absolute paths to lua scripts.
#   {{.CertPath}}     — host-side absolute path to certs/cert.pem.
#   {{.KeyPath}}      — host-side absolute path to certs/key.pem.
admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: {{.AdminPort}} }

static_resources:
  listeners:
    # === l_test_a (scenario a) — :body() whole-buffer ===
    - name: l_test_a
      address: { socket_address: { address: 0.0.0.0, port_value: {{.LATestPort}} } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP1
                stat_prefix: hcm_a
                route_config:
                  name: rc_a
                  virtual_hosts:
                    - name: vh_a
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: c_backend }
                http_filters:
                  - name: envoy.filters.http.lua
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                      stat_prefix: scenario_a
                      default_source_code:
                        filename: "{{.ScriptA}}"
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

