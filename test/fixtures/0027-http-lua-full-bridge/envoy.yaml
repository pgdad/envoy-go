    # === l_test_f (scenario f) — TLS + :sha256PeerCertificateDigest() ===
    - name: l_test_f
      address: { socket_address: { address: 0.0.0.0, port_value: {{.LFTestPort}} } }
      filter_chains:
        - transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
              common_tls_context:
                tls_certificates:
                  - certificate_chain:
                      filename: "{{.CertPath}}"
                    private_key:
                      filename: "{{.KeyPath}}"
          filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP1
