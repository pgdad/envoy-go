# Reference Envoy bootstrap for fixture 0027-http-lua-full-bridge.
#
# Per phase 22.2 SPEC §8 + D5 closure option (f-B) + D-P11 closure
# (REUSE existing runReferenceLessFixture; NO NEW driver-helper).
# 13-listener topology — one listener per scenario (a)..(m):
#
#   l_test_a (port {{.LATestPort}})  — scripts/a_body_whole.lua          (plaintext)
#   l_test_b (port {{.LBTestPort}})  — scripts/b_body_chunks.lua         (plaintext)
#   l_test_c (port {{.LCTestPort}})  — scripts/c_trailers.lua            (plaintext)
#   l_test_d (port {{.LDTestPort}})  — scripts/d_metadata_empty.lua      (plaintext)
#   l_test_e (port {{.LETestPort}})  — scripts/e_dynamic_metadata.lua    (plaintext)
#   l_test_f (port {{.LFTestPort}})  — scripts/f_connection_ssl_fp.lua   (TLS — cert mount)
#   l_test_g (port {{.LGTestPort}})  — scripts/g_crypto.lua              (plaintext)
#   l_test_h (port {{.LHTestPort}})  — scripts/h_filebytes.lua           (plaintext; REFERENCE-LESS subject-only per D8)
#   l_test_i (port {{.LITestPort}})  — scripts/i_streaminfo_upstream.lua (plaintext)
#   l_test_j (port {{.LJTestPort}})  — scripts/j_httpcall_sync.lua       (plaintext; REFERENCE-LESS subject-only)
#   l_test_k (port {{.LKTestPort}})  — scripts/k_httpcall_async.lua      (plaintext; REFERENCE-LESS subject-only)
#   l_test_l (port {{.LLTestPort}})  — scripts/l_timestamp.lua           (plaintext; REFERENCE-LESS subject-only)
#   l_test_m (port {{.LMTestPort}})  — scripts/m_filterstate.lua         (plaintext; REFERENCE-LESS subject-only)
#
# Shared upstream cluster c_backend (STRICT_DNS to host.docker.internal
# per ADR-0010) reflects request headers as JSON via the shared
# echobackend helper. Cluster c_httpcall mirrors c_backend (used by
# :httpCall() scenarios j+k).
#
# Cross-side scenarios (a/b/c/d/e/f-B/g/i): both sides drive each listener
# + the driver byte-stream compares the per-scenario verdict. REFERENCE-
# LESS scenarios (h/j/k/l/m): the driver emits a normalized constant
# token on both sides; subject-side probe captures the real verdict via
# t.Logf side-channel (NOT byte-stream contents).
#
# TLS listener f-B (scenario f) presents the fixture-0027 cert pair
# mounted at /certs/cert.pem + /certs/key.pem (bind-mount via the
# driver's ReferenceHostMounts hook per Task 17 cert plumbing). Same PEM
# bytes mounted on BOTH sides → :sha256PeerCertificateDigest() returns
# byte-identical lowercase-hex 64-char digest → cross-side CompareBytes
# passes deterministically.
admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: {{.AdminPort}} }

static_resources:
  listeners:
    # === l_test_a (scenario a) — :body() whole-buffer ===
    - name: l_test_a
      address: { socket_address: { address: 0.0.0.0, port_value: {{.LATestPort}} } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP1
                stat_prefix: hcm_a
                route_config:
                  name: rc_a
                  virtual_hosts:
                    - name: vh_a
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: c_backend }
                http_filters:
                  - name: envoy.filters.http.lua
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                      stat_prefix: scenario_a
                      default_source_code:
                        filename: "{{.ScriptA}}"
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

    # === l_test_b (scenario b) — :bodyChunks() iterator ===
