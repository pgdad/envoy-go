# Phase 47.2a fixture 0090-stats-sink-metrics-service-deltas expectations (ADR-0019
# — prose; the driver is the enforcer via AssertStats; this file is documentation).
#
# This fixture proves report_counters_as_deltas:true end-to-end on the landed 47.1
# metrics_service stats sink. It clones the 0089 topology and replaces 0089's
# last-seen value==K assertion with the delta-SUM==K invariant.
#
# Topology (single-listener plaintext H1; HTTPFixedBody backend; driver-owned
# in-process MetricsService gRPC receiver):
#   l_test (hcm_local)  — one downstream HTTP/1.1 listener; route prefix "/" →
#                         cluster c_backend (HTTPFixedBody, 17-byte body).
#   c_backend           — HTTPFixedBody subprocess ("backend:v1/fixed\n" = 17 bytes).
#   c_metrics           — driver-owned in-process MetricsService receiver
#                         (test/helpers/metricsservice/) on a driver-allocated
#                         stable port, bound 0.0.0.0:<port>. The cluster carries the
#                         mandatory http2_protocol_options:{} for gRPC framing +
#                         plaintext h2c (D-MS-RECEIVER-WIRING — no TLS).
#
# A bootstrap-level stats_sinks[] metrics_service entry (transport_api_version V3,
# report_counters_as_deltas:true) on BOTH sides names c_metrics + a SHORT
# stats_flush_interval (500ms). Each side snapshots its stats registry every flush
# and streams it as io.prometheus.client.MetricFamily protos (identifier{node} on
# msg #1). Under the deltas knob each COUNTER family carries the per-flush DELTA
# (the increment since the previous flush), NOT the cumulative absolute value;
# gauges stay ABSOLUTE.
#
# Reference Envoy contrib-v1.37.2 (STRICT_DNS via host.docker.internal) vs
# envoy-go (STATIC, in-process). node{id,cluster} FIXED identically on both sides.
#
# ## Two private per-side receivers + hard Close() (as-built; not a shared receiver)
#
# The metrics_service sink flushes PERIODICALLY — the reference proxy keeps
# streaming into its receiver for the whole test, including during the subject's
# drive window. A single shared receiver would let the reference's concurrent
# flushes contaminate the subject snapshot (and silently defeat subject-side
# deliberate breaks). So the driver starts TWO private receivers — one per side —
# on two separately-allocated host ports, both bound 0.0.0.0 BEFORE either proxy
# starts. Each side owns an uncontaminated accumulator, so NO Reset() between
# sides is needed. After the subject snapshot BOTH receivers are hard-stopped via
# Close() (grpc.Server.Stop) — NOT Stop()/GracefulStop, which would block on the
# proxies' long-lived StreamMetrics streams until the test timeout.
#
# ## Workload + release barrier
#
# Each side fires K = 7 deterministic GET /probe requests (Host: metrics.example,
# UA: metrics-probe/1; all 2xx). The driver POLLS that side's private receiver
# until the deterministic COUNTER subset's per-flush deltas SUM to == 7 == K
# (poll-to-converge — the release barrier; never a fixed sleep,
# reference_concurrency_differential_release_barrier). A single flush is partial
# and the last idle flush reads ≈0 — the SUM across flushes is the invariant.
#
# ## Post-convergence stability barrier (the delta invariant; catches the breaks)
#
# A single-window request burst makes the FIRST post-request flush emit
# delta = 7 - 0 = 7, INDISTINGUISHABLE from a broken absolute = 7 — the
# delta-vs-absolute distinction only shows up in post-convergence STABILITY. So
# after the delta-SUM converges to K the driver observes >= 2 further flushes
# (awaitFurtherFlushes, riding on the receiver's Messages() per-message counter — a
# release barrier on the flush ticker, NOT a sleep) and snapshots only then,
# asserting the SUM is STILL K. Under correct deltas the now-idle counters emit a 0
# delta each flush so the SUM stays K (PASS); an absolute (or un-latched) sink
# re-adds the cumulative every flush so the SUM overshoots K and assertSide fails.
# This is what makes the deliberate emit-absolute / skip-the-latch breaks catchable.
#
# ## Framing NOT asserted (reference_streaming_sink_differential_framing)
#
# The cross-side assertion is on the AGGREGATED MetricFamily delta-SUM subset —
# NOT the StreamMetrics message/stream framing, per-message family count,
# connection count, or flush cadence, which legitimately vary side-to-side.
#
# ## Asserted (cross-side EXACT on the deterministic COUNTER NAME SUBSET, both sides)
#
# AMEND-MS-HISTOGRAM-PRESENT: a name-SUBSET, NOT the whole family set (the
# surfaces differ cross-side — envoy-go has no histograms; the reference does).
# AMEND-MSD-CX-NOT-K: upstream_cx_total is EXCLUDED from the subset — it sums to
# < K under connection reuse.
#
#   For each name in the subset:
#     cluster.c_backend.upstream_rq_total
#     http.hcm_local.downstream_rq_total
#     http.hcm_local.downstream_rq_2xx
#   on BOTH sides:
#     present  (decode ran — a zero-family pass is structurally impossible)
#     type     == COUNTER
#     delta-SUM == 7  (== K; the SUM of the per-flush deltas across flushes,
#                      AMEND-MSD-SUM-IS-THE-INVARIANT)
#   Identifier node (StreamMetricsMessage.identifier.node on msg #1):
#     id      == "envoy-go-subject-0090"  (cross-side EXACT)
#     cluster == "envoy-go-differential"  (cross-side EXACT)
#
# ## UNasserted (vary side-to-side / impl-specific / non-deterministic)
#
#   The WHOLE family set / family count (surfaces differ — envoy-go has no
#       histograms; lazy-instantiation grows the count).
#   metric[].timestamp_ms VALUE (flush wall-clock — non-deterministic;
#       AMEND-MS-TIMESTAMP-ALWAYS-SET — presence required, value unasserted).
#   help (empty both sides).
#   ABSOLUTE gauges (server.uptime, *_active, connection churn — gauges stay
#       absolute under the deltas knob and are non-deterministic).
#   The identifier user_agent_* / extensions[] (impl-specific).
#   StreamMetrics message/stream framing + per-message family count.
#
# Cross-refs: phase 47.2a SPEC + ADR-0263 + ADR-0262 +
#             reference_streaming_sink_differential_framing +
#             reference_differential_grpc_receiver_driver_owned +
#             reference_concurrency_differential_release_barrier +
#             reference_periodic_sink_differential_two_receivers +
#             reference_stats_sink_metrics_service_probe.
