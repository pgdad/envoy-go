# envoy-go bootstrap for fixture 0090-stats-sink-metrics-service-deltas.
#
# Functionally equivalent to envoy.yaml modulo:
#   - cluster type: STATIC (envoy-go convention per ADR-0002) vs STRICT_DNS.
#   - cluster endpoint addresses: 127.0.0.1 (envoy-go runs on the host loopback)
#     vs host.docker.internal (reference Envoy runs in a Docker container).
#   - admin/listener ports independently allocated by the runner.
#
# Single-listener plaintext H1 topology: one downstream HTTP/1.1 listener routes
# every request to the HTTPFixedBody backend (cluster {{.BackendName}}). A
# bootstrap-level stats_sinks[] metrics_service entry (transport_api_version V3,
# report_counters_as_deltas:true) names the c_metrics cluster — the driver-owned
# in-process metricsservice.Server receiver on the host loopback — and a SHORT
# stats_flush_interval (500ms) drives fast deterministic convergence. Under the
# deltas knob each flush carries each COUNTER's per-flush DELTA (gauges stay
# absolute; the per-flush deltas SUM across flushes to the cumulative total).
# Every flush envoy-go snapshots the frozen stats.Registry and streams it as
# io.prometheus.client.MetricFamily protos via the MetricsServiceSink (phase 47.1
# core + the 47.2a delta transform).
#
# Templating: rendered by the driver's mustRender() at SubjectConfig time.
# Substitution keys:
#   {{.AdminPort}}    — admin endpoint port (runner-allocated).
#   {{.ListenerPort}} — l_test listener port (runner-allocated).
#   {{.BackendPort}}  — HTTPFixedBody backend port (runner-allocated, loopback).
#   {{.BackendName}}  — backend cluster name (FIXED identical both sides).
#   {{.StatPrefix}}   — HCM stat_prefix (FIXED identical both sides).
#   {{.MetricsPort}}  — driver-owned MetricsService receiver port (driver-allocated;
#                       pre-bound on 0.0.0.0:<port> before the subject starts).
#   {{.NodeID}}       — bootstrap node id (FIXED identical both sides).
#   {{.NodeCluster}}  — bootstrap node cluster (FIXED identical both sides).
node:
  id: {{.NodeID}}
  cluster: {{.NodeCluster}}

admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: {{.AdminPort}} }

# Bootstrap-level stats sink: the metrics_service gRPC sink. transport_api_version
# V3; report_counters_as_deltas true → each COUNTER family carries the per-flush
# DELTA (gauges stay absolute). grpc_service.envoy_grpc names the c_metrics
# cluster (h2c). A SHORT stats_flush_interval (500ms) drives fast deterministic
# convergence.
stats_sinks:
  - name: envoy.stat_sinks.metrics_service
    typed_config:
      "@type": type.googleapis.com/envoy.config.metrics.v3.MetricsServiceConfig
      transport_api_version: V3
      report_counters_as_deltas: true
      grpc_service:
        envoy_grpc:
          cluster_name: c_metrics
stats_flush_interval: 0.5s

static_resources:
  listeners:
    - name: l_test
      address: { socket_address: { address: 0.0.0.0, port_value: {{.ListenerPort}} } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP1
                stat_prefix: {{.StatPrefix}}
                route_config:
                  name: rc_test
                  virtual_hosts:
                    - name: vh_test
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: {{.BackendName}} }
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    # backend: HTTPFixedBody subprocess (17-byte fixed body) on host loopback.
    - name: {{.BackendName}}
      type: STATIC
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: {{.BackendName}}
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: 127.0.0.1, port_value: {{.BackendPort}} }
    # c_metrics: driver-owned in-process MetricsService gRPC receiver on host
    # loopback. MANDATORY http2_protocol_options: {} for gRPC framing.
    # Plaintext h2c — no TLS (D-MS-RECEIVER-WIRING).
    - name: c_metrics
      type: STATIC
      lb_policy: ROUND_ROBIN
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: c_metrics
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: 127.0.0.1, port_value: {{.MetricsPort}} }
