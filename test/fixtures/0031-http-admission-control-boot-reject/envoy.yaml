# Reference Envoy bootstrap for fixture 0031-http-admission-control-boot-reject.
#
# Per phase-23 SPEC §7.2 + §5.1 row 2 + AMEND-8 + Task 9 brief.
# This file is a DOCUMENTATION ARTIFACT — the actual boot-reject bootstrap
# is synthesized inline in renderBootRejectBootstrap() (driver.go) per
# Option B2 (PLAN Task 9 / fixture-0029 precedent). The runner's
# tryStartReferenceProxy does NOT consult ReferenceLogMounter, so a
# file-based bootstrap would fail with "Invalid path" before the filter
# ever PARSE-REJECTed.
#
# The boot-reject trigger: sr_threshold.default_value = 0.5 (< 1.0%)
# per §5.1 arm 2 (config.cc:25-27):
#   reference Envoy: "Success rate threshold cannot be less than 1.0%."
#   envoy-go: "admission_control: sr_threshold cannot be less than 1.0%"
# Common substring: "cannot be less than 1.0%"
#
# NOTE: The driver's renderBootRejectBootstrap() is the authoritative
# source. This file documents the intended shape for operator reference.
admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: 9901 }

static_resources:
  listeners:
    - name: l_test_a
      address: { socket_address: { address: 0.0.0.0, port_value: 10131 } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP1
                stat_prefix: hcm_bootreject
                route_config:
                  name: rc_bootreject
                  virtual_hosts:
                    - name: vh_bootreject
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: c_unused }
                http_filters:
                  - name: envoy.filters.http.admission_control
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.admission_control.v3.AdmissionControl
                      sr_threshold:
                        default_value:
                          value: 0.5
                      success_criteria:
                        http_criteria:
                          http_success_status:
                            - { start: 100, end: 500 }
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: c_unused
      type: STATIC
      connect_timeout: 0.25s
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: c_unused
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: 127.0.0.1, port_value: 1 }
