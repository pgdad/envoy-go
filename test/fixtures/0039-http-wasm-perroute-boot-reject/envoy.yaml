# Reference Envoy bootstrap for fixture 0039-http-wasm-perroute-boot-reject.
#
# Per phase 25.3 Task 12 + D-25.3-P1 closure at 25.3 IMPL Task 12 first-action.
# This file is a DOCUMENTATION ARTIFACT — the actual bootstrap is
# synthesized inline in renderBootRejectBootstrap() (inputs/driver.go) per
# Option B2 (fixture-0029 / 0031 / 0033 / 0035 / 0037 precedent).
#
# # Subject-only boot-reject arm (C — env_vars cap-exceeded)
#
# The subject-side trigger is the envoy-go-strict 64-entry env_vars cap
# (parseRejectEnvVarsCapExceeded) at
# internal/filter/http/wasm/compiled_config.go:
#   "wasm: config.vm_config.environment_variables exceeds the
#   envoy-go-strict cap (max 64 entries, max 4096 bytes per value)"
#
# The reference Envoy v1.37.2 side BOOTS SUCCESSFULLY against the SAME
# config — upstream has NO env_vars entry cap, so all 65 key_values
# entries are accepted. The wasm filter then loads the bind-mounted .wasm
# blob at /bytecode/probe.wasm + admin /ready returns 200.
#
# # Bytecode
#
# Self-contained: the reference side bind-mounts this fixture's own
# bytecode/probe.wasm (copied from sibling fixture-0038's
# listener_default.wasm) at /bytecode/probe.wasm. The subject never reads
# it (arm C fires at parseEnvVars before resolveDataSource).
#
# NOTE: inputs/driver.go::renderBootRejectBootstrap() is the authoritative
# source. This file documents the intended shape for operator reference.
admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: 9901 }

static_resources:
  listeners:
    - name: l_test_a
      address: { socket_address: { address: 0.0.0.0, port_value: 10139 } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP1
                stat_prefix: hcm_bootreject_39
                route_config:
                  name: rc_bootreject_39
                  virtual_hosts:
                    - name: vh_bootreject_39
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: c_unused }
                http_filters:
                  - name: envoy.filters.http.wasm
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.wasm.v3.Wasm
                      config:
                        name: plugin_bootreject_39
                        root_id: rootid_bootreject_39
                        vm_config:
                          vm_id: vm_bootreject_39
                          runtime: envoy.wasm.runtime.v8
                          code:
                            local:
                              filename: /bytecode/probe.wasm
                          environment_variables:
                            # 65 entries (k0..k64) — one over the
                            # envoy-go-strict 64-entry cap. Reference Envoy
                            # v1.37.2 accepts all 65 (no upstream cap); the
