# Reference Envoy bootstrap for fixture 0098-stats-sink-statsd-tcp.
#
# Single-listener plaintext H1 topology (phase 55 — the statsd TCP line-protocol
# stats sink, ADR-0272). One downstream HTTP/1.1 listener routes every request to
# the HTTPFixedBody backend (cluster {{.BackendName}}). A bootstrap-level
# stats_sinks[] statsd entry uses the TCP transport arm (tcp_cluster_name) rather
# than a UDP address: the proxy opens a long-lived TCP connection to the named
# cluster {{.StatsdClusterName}} and writes the statsd line protocol over it
# ('\n'-TERMINATED lines). A SHORT stats_flush_interval (500ms) drives fast
# deterministic convergence. The {{.StatsdClusterName}} cluster's endpoint is the
# driver-owned in-process statsdrecv TCP receiver.
#
# AMEND-TCP-NODE (SPEC-55 §3.7, §11.6): the reference REFUSES TO BOOT a
# tcp_cluster_name statsd sink unless BOTH node.id and node.cluster are set --
# either alone fails with the identical message. The UDP address sink (0092)
# boots with no node at all (control probe), so the requirement is TCP-SPECIFIC.
# Do NOT drop this node block.
#
# The {{.StatsdClusterName}} endpoint address is a LITERAL IP (the host-gateway
# IP) so the reference container reaches the host receiver; the subject uses
# 127.0.0.1 (reference_host_gateway_ip_docker_desktop).
#
# Templating: rendered by the driver's mustRender() at ReferenceBootstrap time.
# Substitution keys:
#   {{.AdminPort}}         — admin endpoint port (hard-coded 9901 by driver).
#   {{.ListenerPort}}      — l_test in-container port (10098 per fixture convention).
#   {{.BackendHost}}       — HTTPFixedBody backend host (host.docker.internal per ADR-0010).
#   {{.BackendPort}}       — HTTPFixedBody backend port (runner-allocated).
#   {{.BackendName}}       — backend cluster name (FIXED identical both sides →
#                            cluster.<backend>.upstream_rq_total dotted stat name).
#   {{.StatPrefix}}        — HCM stat_prefix (FIXED identical both sides →
#                            http.<stat_prefix>.downstream_rq_* dotted stat names).
#   {{.StatsdClusterName}} — the cluster the statsd TCP sink dials (FIXED both sides).
#   {{.StatsdHost}}        — driver-owned statsdrecv TCP receiver host
#                            (host-gateway literal IP for the reference container).
#   {{.StatsdPort}}        — driver-owned statsdrecv TCP receiver port (driver-allocated;
#                            the in-process statsdrecv.Server binds 0.0.0.0:<port>
#                            before the container starts).
#   {{.Prefix}}            — statsd metric prefix (baked identically on both sides;
#                            all metric names are <prefix>.<name>).
#   {{.NodeID}} / {{.NodeCluster}} — node identity (REQUIRED, AMEND-TCP-NODE).
#
# Cluster type: STRICT_DNS for the backend so the reference Envoy container
# resolves host.docker.internal (the Docker bridge host alias per ADR-0010);
# STATIC for {{.StatsdClusterName}} (its endpoint is a literal host-gateway IP).
# dns_lookup_family: V4_ONLY per the established fixture precedent.

node:
  id: {{.NodeID}}
  cluster: {{.NodeCluster}}

admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: {{.AdminPort}} }

# Bootstrap-level stats sink: the statsd TCP sink. tcp_cluster_name names the
# {{.StatsdClusterName}} cluster whose single endpoint is the driver-owned
# in-process statsdrecv TCP receiver. A SHORT stats_flush_interval (500ms) drives
# fast deterministic convergence (vs the 5s default). Under the statsd model each
# COUNTER flush line carries the per-flush DELTA; gauges carry the absolute value;
# every line is '\n'-TERMINATED. prefix is baked identically on both sides so
# metric names match cross-side.
stats_sinks:
  - name: envoy.stat_sinks.statsd
    typed_config:
      "@type": type.googleapis.com/envoy.config.metrics.v3.StatsdSink
      tcp_cluster_name: {{.StatsdClusterName}}
      prefix: {{.Prefix}}
stats_flush_interval: 0.5s

static_resources:
  listeners:
    - name: l_test
      address: { socket_address: { address: 0.0.0.0, port_value: {{.ListenerPort}} } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP1
                stat_prefix: {{.StatPrefix}}
                route_config:
                  name: rc_test
                  virtual_hosts:
                    - name: vh_test
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: {{.BackendName}} }
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    # backend: HTTPFixedBody subprocess (17-byte fixed body) reached via
    # host.docker.internal from the reference Envoy container per ADR-0010.
    - name: {{.BackendName}}
      type: STRICT_DNS
      connect_timeout: 1s
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: {{.BackendName}}
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: {{.BackendHost}}, port_value: {{.BackendPort}} }

    # statsd TCP receiver: the driver-owned in-process statsdrecv.Server, reached
    # at the host-gateway literal IP from the reference container. STATIC (the
    # endpoint is a literal IP, no DNS).
    - name: {{.StatsdClusterName}}
      connect_timeout: 1s
      type: STATIC
      load_assignment:
        cluster_name: {{.StatsdClusterName}}
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: {{.StatsdHost}}, port_value: {{.StatsdPort}} }
