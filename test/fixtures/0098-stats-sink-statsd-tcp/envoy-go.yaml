# envoy-go bootstrap for fixture 0098-stats-sink-statsd-tcp.
#
# Functionally equivalent to envoy.yaml modulo:
#   - cluster type: STATIC (envoy-go convention per ADR-0002) vs STRICT_DNS for
#     the backend.
#   - cluster endpoint addresses: 127.0.0.1 (envoy-go runs on the host loopback)
#     vs host.docker.internal / the host-gateway literal IP (reference Envoy runs
#     in a Docker container).
#   - admin/listener ports independently allocated by the runner.
#   - statsd receiver endpoint: 127.0.0.1:<subjStatsdPort> (subject loopback)
#     vs <hostGatewayIP>:<refStatsdPort> (host gateway for the reference container).
#
# Single-listener plaintext H1 topology: one downstream HTTP/1.1 listener routes
# every request to the HTTPFixedBody backend (cluster {{.BackendName}}). A
# bootstrap-level stats_sinks[] statsd entry uses the TCP transport arm
# (tcp_cluster_name: {{.StatsdClusterName}}): the proxy dials the named cluster
# via DialSink (the UNACCOUNTED dial path — no upstream_cx_* accounting,
# AMEND-TCP-CXSTATS) and writes '\n'-TERMINATED statsd lines over the long-lived
# connection. A SHORT stats_flush_interval (500ms) drives fast deterministic
# convergence.
#
# AMEND-TCP-NODE (SPEC-55 §3.7, §11.6): node.id + node.cluster are REQUIRED for a
# tcp_cluster_name statsd sink on BOTH sides (the bootstrap parse rejects a
# TCP-arm statsd sink without them). Unlike 0092's UDP sink, which needs no node.
# Do NOT drop this node block.
#
# Templating: rendered by the driver's mustRender() at SubjectConfig time.
# Substitution keys:
#   {{.AdminPort}}         — admin endpoint port (runner-allocated).
#   {{.ListenerPort}}      — l_test listener port (runner-allocated).
#   {{.BackendPort}}       — HTTPFixedBody backend port (runner-allocated, loopback).
#   {{.BackendName}}       — backend cluster name (FIXED identical both sides).
#   {{.StatPrefix}}        — HCM stat_prefix (FIXED identical both sides).
#   {{.StatsdClusterName}} — the cluster the statsd TCP sink dials (FIXED both sides).
#   {{.StatsdHost}}        — statsdrecv receiver host (127.0.0.1 for subject loopback).
#   {{.StatsdPort}}        — statsdrecv receiver port (driver-allocated).
#   {{.Prefix}}            — statsd metric prefix (baked identically on both sides).
#   {{.NodeID}} / {{.NodeCluster}} — node identity (REQUIRED, AMEND-TCP-NODE).

node:
  id: {{.NodeID}}
  cluster: {{.NodeCluster}}

admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: {{.AdminPort}} }

# Bootstrap-level stats sink: the statsd TCP sink. tcp_cluster_name names the
# {{.StatsdClusterName}} cluster whose single endpoint (127.0.0.1:<subjStatsdPort>)
# is the driver-owned in-process statsdrecv TCP receiver on the host loopback. A
# SHORT stats_flush_interval (500ms) drives fast deterministic convergence.
# prefix is baked identically on both sides.
stats_sinks:
  - name: envoy.stat_sinks.statsd
    typed_config:
      "@type": type.googleapis.com/envoy.config.metrics.v3.StatsdSink
      tcp_cluster_name: {{.StatsdClusterName}}
      prefix: {{.Prefix}}
stats_flush_interval: 0.5s

static_resources:
  listeners:
    - name: l_test
      address: { socket_address: { address: 0.0.0.0, port_value: {{.ListenerPort}} } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP1
                stat_prefix: {{.StatPrefix}}
                route_config:
                  name: rc_test
                  virtual_hosts:
                    - name: vh_test
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: {{.BackendName}} }
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    # backend: HTTPFixedBody subprocess (17-byte fixed body) on host loopback.
    - name: {{.BackendName}}
      type: STATIC
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: {{.BackendName}}
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: 127.0.0.1, port_value: {{.BackendPort}} }

    # statsd TCP receiver: the driver-owned in-process statsdrecv.Server on the
    # host loopback (127.0.0.1:<subjStatsdPort>). STATIC.
    - name: {{.StatsdClusterName}}
      type: STATIC
      load_assignment:
        cluster_name: {{.StatsdClusterName}}
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: {{.StatsdHost}}, port_value: {{.StatsdPort}} }
