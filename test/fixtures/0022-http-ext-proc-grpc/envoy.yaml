# Reference Envoy bootstrap for fixture 0022-http-ext-proc-grpc.
#
# Three-listener plaintext topology per SPEC §7.2 + planner-time decision D13:
#
#   l_test_a (port {{.LATestPort}}) — scenarios 1+2+3+4+7+8.
#     failure_mode_allow: false (default). gRPC-mode processor at c_ext_proc.
#     Per-route overrides:
#       /disabled → ExtProcPerRoute{disabled: true}                     (S7)
#       /override → ExtProcPerRoute{overrides{processing_mode{...}}}    (S8)
#
#   l_test_b (port {{.LBTestPort}}) — scenario 5.
#     failure_mode_allow: true. Same c_ext_proc cluster reference. The
#     driver STOPS the processor server before scenario 5 → gRPC dial fails
#     → dispError → request PROCEEDS to backend (failureModeAllowed counter
#     fires per parent §5.P11).
#
#   l_test_c (port {{.LCTestPort}}) — scenario 6.
#     HTTP-service mode at http://{{.ProcHost}}:{{.ProcHTTPPort}}/process.
#     Per the ext_proc proto constraint, http_service mode requires
#     processing_mode that omits body-stage forwarding (BUFFERED/STREAMED
#     not allowed) — headers-only is the natural fit. failure_mode_allow:
#     false; the HTTP processor returns 200 + JSON-encoded
#     ProcessingResponse for each header stage.
#
# Clusters:
#   c_backend:    STRICT_DNS → {{.BackendHost}}:{{.BackendPort}}
#   c_ext_proc:   STRICT_DNS → {{.ProcHost}}:{{.ProcGRPCPort}} with mandatory
#                 typed_extension_protocol_options.HttpProtocolOptions
#                 .explicit_http_config.http2_protocol_options: {} for gRPC
#                 framing per SPEC §6.5 (UseH2() == true gate).
#   c_ext_proc_http: STRICT_DNS → {{.ProcHost}}:{{.ProcHTTPPort}} (scenario 6;
#                    plain HTTP/1.1).
#
# Templating: rendered by the driver's mustRender() at ReferenceBootstrap time.
admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: {{.AdminPort}} }

static_resources:
  listeners:
    # === l_test_a — failure_mode_allow:false + gRPC processor (c_ext_proc) ===
    # Scenarios 1 (allow + header_mutation), 2 (immediate_response 403),
    # 3 (response_headers mutation), 4 (mode_override mid-stream),
    # 7 (per-route disabled), 8 (per-route processing_mode override + ClearRouteCache cache-on-first-use).
    - name: l_test_a
      address: { socket_address: { address: 0.0.0.0, port_value: {{.LATestPort}} } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP1
                stat_prefix: hcm_local_a
                route_config:
                  name: rc_test_a
                  virtual_hosts:
                    - name: vh_test_a
                      domains: ["*"]
                      routes:
                        - match: { path: "/scenario1" }
                          route: { cluster: c_backend }
                        - match: { path: "/scenario2" }
                          route: { cluster: c_backend }
                        - match: { path: "/scenario3" }
                          route: { cluster: c_backend }
                        - match: { path: "/scenario4" }
                          route: { cluster: c_backend }
                        # Scenario 7: per-route disabled — NO ext_proc invocation.
                        - match: { path: "/disabled" }
                          route: { cluster: c_backend }
                          typed_per_filter_config:
                            envoy.filters.http.ext_proc:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExtProcPerRoute
                              disabled: true
                        # Scenario 8: per-route processing_mode override
                        # (request_header_mode: SKIP; response_header_mode: SEND).
                        # The request_headers stage is skipped; response_headers
                        # still flows through the processor. This also drives
                        # the §19.P7 cache-on-first-use closure (the per-route
                        # config resolved at DecodeHeaders time stays in effect
                        # for the entire bidi-stream's lifetime).
                        - match: { path: "/override" }
                          route: { cluster: c_backend }
                          typed_per_filter_config:
                            envoy.filters.http.ext_proc:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExtProcPerRoute
                              overrides:
                                processing_mode:
                                  request_header_mode: SKIP
                                  response_header_mode: SEND
                http_filters:
                  - name: envoy.filters.http.ext_proc
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
                      # failure_mode_allow: false (proto default; NOT emitted).
                      # allow_mode_override: true enables scenario 4's
                      # mode_override response_header_mode:SKIP escape.
                      allow_mode_override: true
                      message_timeout: 10s
                      grpc_service:
                        envoy_grpc:
                          cluster_name: c_ext_proc
                        timeout: 10s
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

    # === l_test_b — failure_mode_allow:true + gRPC processor stopped at request time ===
    # Scenario 5: driver stops the processor server before the request →
    # gRPC dial fails → dispError → request PROCEEDS to backend (200 echo)
    # + failure_mode_allowed counter increment.
    - name: l_test_b
      address: { socket_address: { address: 0.0.0.0, port_value: {{.LBTestPort}} } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP1
                stat_prefix: hcm_local_b
                route_config:
                  name: rc_test_b
                  virtual_hosts:
                    - name: vh_test_b
                      domains: ["*"]
                      routes:
                        - match: { path: "/scenario5" }
                          route: { cluster: c_backend }
                http_filters:
                  - name: envoy.filters.http.ext_proc
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
                      failure_mode_allow: true
                      message_timeout: 2s
                      grpc_service:
                        envoy_grpc:
                          cluster_name: c_ext_proc
                        timeout: 2s
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

    # === l_test_c — HTTP-service-mode processor ===
    # Scenario 6: HTTP-service mode. The processor exposes a plain HTTP/1.1
    # endpoint that receives a POST per header stage with a JSON-encoded
    # ProcessingRequest body and returns a JSON-encoded ProcessingResponse.
    # processing_mode is headers-only per the proto constraint that
    # http_service mode forbids body forwarding.
    - name: l_test_c
      address: { socket_address: { address: 0.0.0.0, port_value: {{.LCTestPort}} } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP1
                stat_prefix: hcm_local_c
                route_config:
                  name: rc_test_c
                  virtual_hosts:
                    - name: vh_test_c
                      domains: ["*"]
                      routes:
                        - match: { path: "/scenario6" }
                          route: { cluster: c_backend }
                http_filters:
                  - name: envoy.filters.http.ext_proc
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
                      message_timeout: 10s
                      http_service:
                        http_service:
                          http_uri:
                            uri: "http://{{.ProcHost}}:{{.ProcHTTPPort}}/process"
                            cluster: c_ext_proc_http
                            timeout: 10s
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    # c_backend: echobackend subprocess (HTTP/1.1).
    - name: c_backend
      type: STRICT_DNS
      connect_timeout: 1s
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: c_backend
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: {{.BackendHost}}, port_value: {{.BackendPort}} }
    # c_ext_proc: in-process bidi-stream gRPC ExternalProcessor.Process server.
    # MANDATORY http2_protocol_options: {} for gRPC framing per SPEC §6.5
    # (UseH2() == true gate). Plaintext h2c — no TLS in phase 19.1 fixtures
    # (parent §8 item 17 documents).
    - name: c_ext_proc
      type: STRICT_DNS
      connect_timeout: 1s
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: c_ext_proc
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: {{.ProcHost}}, port_value: {{.ProcGRPCPort}} }
    # c_ext_proc_http: HTTP/1.1 processor endpoint for scenario 6.
    - name: c_ext_proc_http
      type: STRICT_DNS
      connect_timeout: 1s
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: c_ext_proc_http
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: {{.ProcHost}}, port_value: {{.ProcHTTPPort}} }
