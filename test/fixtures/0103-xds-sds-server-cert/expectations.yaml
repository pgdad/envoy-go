# Phase 60.2 fixture 0103-xds-sds-server-cert expectations (ADR-0019 —
# prose; the driver is the enforcer via CompareBytes; this file is
# documentation).
#
# Topology (single-listener downstream-TLS tcp_proxy; driver-owned in-process
# SDS gRPC receiver; TCP echo backend):
#   l_sds_tls  — one TLS-terminating tcp_proxy listener. Its
#                DownstreamTlsContext carries
#                common_tls_context.tls_certificate_sds_secret_configs = [{
#                  name: server_cert,
#                  sds_config: { resource_api_version: V3,
#                                api_config_source: { api_type: GRPC,
#                                  transport_api_version: V3,
#                                  grpc_services: [{envoy_grpc:
#                                    {cluster_name: sds_cluster}}] } } }]
#                No tls_inspector — a single filter chain, no SNI match.
#   c_backend  — TCP echo backend (BackendCount=1). Never exercised: the
#                driver writes no application data, only completes the TLS
#                handshake.
#   sds_cluster — driver-owned in-process test/helpers/sdsserver.Server SDS
#                receiver (SotW StreamSecrets). The driver starts TWO private
#                receivers — one per side — on two separately-allocated
#                ports, each bound 0.0.0.0:<port>, BOTH configured to deliver
#                the SAME committed pki/leaf.pem + pki/leaf.key.pem under
#                secret name "server_cert". MANDATORY
#                http2_protocol_options:{} for gRPC framing + plaintext h2c
#                (no TLS).
#
# node: {id: envoygo-node, cluster: envoygo-cluster} is REQUIRED on BOTH
# sides — SDS boot-fails without it (internal/boot.NewSDSProvider arm 7).
#
# Reference Envoy contrib-v1.37.2 (STRICT_DNS via host.docker.internal) vs
# envoy-go (STATIC, in-process, loopback).
#
# ## PKI (test/fixtures/0103-xds-sds-server-cert/pki/)
#
#   ca.pem        — self-signed test CA (CN "envoy-go 0103 SDS test CA").
#   leaf.pem       — server leaf, CN "sds.envoy-go.test",
#                    SAN=DNS:sds.envoy-go.test, FIXED distinctive serial
#                    0x53445330313033 ("SDS0103" ASCII hex).
#   leaf.key.pem   — leaf's ECDSA P-256 private key.
#
# Generated by a one-shot generator (NOT committed — the committed PEMs are
# the authoritative source).
#
# ## Workload
#
# Each side dials the proxy's l_sds_tls listener, completes a TLS 1.2+/1.3
# handshake (validating against pki/ca.pem, ServerName
# "sds.envoy-go.test"), and inspects the served leaf via
# helpers.TLSServedLeaf — NO application data is written.
#
# ## Asserted (cross-side EXACT via CompareBytes)
#
#   The served leaf's "serial=<hex>\nsan=<comma-joined DNSNames>\n" —
#   proving both proxies served the SAME SDS-delivered leaf
#   (serial=53445330313033, san=sds.envoy-go.test on both sides).
#
# ## UNasserted
#
#   The tcp_proxy echo path (never exercised — no application I/O).
#   SDS stream framing (VersionInfo/Nonce/request-count/ACK cadence —
#   impl-specific; only the DELIVERED secret identity is asserted).
#   The sds.<secret>.* stat counters (surfaced by phase 60.1's
#   xds.RegisterSDSStats; not asserted by this fixture — no StatsAsserter).
#
# ## Liveness proof (Step 6)
#
# Temporarily pointing the reference-side sdsserver.Server at a DIFFERENT
# leaf (distinct serial, same SAN DNS:sds.envoy-go.test, signed by a
# throwaway second CA that the driver's caPool is ALSO temporarily made to
# trust alongside pki/ca.pem — so the TLS handshake stays valid on both
# sides) makes CompareBytes fail on the "serial=" line while the handshake
# still completes — proving the assertion is live on the served-leaf
# observable, not a boot/handshake error. See the task-7 report /
# PROGRESS-60.2.md for the captured break evidence.
#
# Cross-refs: phase 60.2 SPEC §8 + ADR-0280 +
#             reference_differential_grpc_receiver_driver_owned +
#             reference_periodic_sink_differential_two_receivers +
#             reference_docker_probe_bridge_network +
#             reference_host_gateway_ip_docker_desktop (NOT used here — SDS
#             is dialed via host.docker.internal STRICT_DNS, not the UDP
#             hostname-rejecting statsd sink case).
