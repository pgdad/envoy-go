# Reference Envoy bootstrap for fixture 0093-stats-sink-dogstatsd.
#
# Single-listener plaintext H1 topology (phase 49 — the dog_statsd UDP
# line-protocol stats sink WITH TAGS). One downstream HTTP/1.1 listener routes
# every request to the HTTPFixedBody backend (cluster {{.BackendName}}). A
# bootstrap-level stats_sinks[] dog_statsd entry (DogStatsdSink TypeURL, UDP
# address, prefix) points at the driver-owned in-process statsdrecv UDP
# receiver, and a SHORT stats_flush_interval (500ms) drives fast deterministic
# convergence. Each flush the reference Envoy sends one UDP datagram per metric
# line (<prefix>.<residual-name>:<delta>|c[|#tags] for counters;
# <prefix>.<residual-name>:<abs>|g[|#tags] for gauges).
#
# UNLIKE the plain statsd sink (0092), dog_statsd applies the SAME dotted-name
# -> (residual, tags) extraction as the Prometheus/metrics_service sinks (SN1-
# SN9 + the SN4 status-class collapse): cluster.<name>.<rest> HOISTS <name> to
# an envoy.cluster_name tag; http.<stat_prefix>.<rest> HOISTS <stat_prefix> to
# an envoy.http_conn_manager_prefix tag; a trailing _Nxx (e.g. _2xx) REWRITES
# the WIRE NAME to _xx and hoists the digit to an envoy.response_code_class tag
# — so downstream_rq_2xx's wire name is downstream_rq_xx, NOT downstream_rq_2xx
# (the SN4 gotcha this fixture's PLAN review caught). Tags are appended as
# |#key1:val1,key2:val2 in the extractor's NATURAL (unsorted) order — the
# reference does not alphabetically sort dog_statsd tags
# (reference_dogstatsd_tag_order_unsorted).
#
# The dog_statsd address is a LITERAL IP (HostGatewayIP — the Docker bridge
# gateway) because the dog_statsd UDP sink does NOT perform DNS resolution,
# the statsd sink precedent (AMEND-SD-REJECT;
# reference_docker_probe_bridge_network). The receiver is bound on
# 0.0.0.0:<port> so the reference container can send datagrams to the host.
#
# NO node field is needed — dog_statsd carries no proxy identifier.
#
# Templating: rendered by the driver's mustRender() at ReferenceBootstrap time.
# Substitution keys:
#   {{.AdminPort}}     — admin endpoint port (hard-coded 9901 by driver).
#   {{.ListenerPort}}  — l_test in-container port (10093 per fixture convention).
#   {{.BackendHost}}   — HTTPFixedBody backend host (host.docker.internal per ADR-0010).
#   {{.BackendPort}}   — HTTPFixedBody backend port (runner-allocated).
#   {{.BackendName}}   — backend cluster name (FIXED identical both sides →
#                        the envoy.cluster_name tag value on the wire).
#   {{.StatPrefix}}    — HCM stat_prefix (FIXED identical both sides →
#                        the envoy.http_conn_manager_prefix tag value on the wire).
#   {{.DogStatsdHost}} — driver-owned statsdrecv receiver host
#                        (HostGatewayIP literal IP for the reference container).
#   {{.DogStatsdPort}} — driver-owned statsdrecv receiver port (driver-allocated;
#                        the in-process statsdrecv.Server binds 0.0.0.0:<port>
#                        before the container starts).
#   {{.Prefix}}        — dog_statsd metric prefix (baked identically on both
#                        sides; all metric names are <prefix>.<residual>).
#
# Cluster type: STRICT_DNS so the reference Envoy container resolves
# host.docker.internal (the Docker bridge host alias per ADR-0010).
# dns_lookup_family: V4_ONLY per the established fixture precedent.

admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: {{.AdminPort}} }

# Bootstrap-level stats sink: the dog_statsd UDP sink. address.socket_address
# carries the LITERAL IP (HostGatewayIP) + UDP port of the driver-owned
# in-process statsdrecv receiver. A SHORT stats_flush_interval (500ms) drives
# fast deterministic convergence (vs the 5s default). Under the dog_statsd
# model each COUNTER flush line carries the per-flush DELTA plus its extracted
# tag suffix; gauges carry the absolute value plus tags. prefix is baked
# identically on both sides so metric names match cross-side.
stats_sinks:
  - name: envoy.stat_sinks.dog_statsd
    typed_config:
      "@type": type.googleapis.com/envoy.config.metrics.v3.DogStatsdSink
      address:
        socket_address: { protocol: UDP, address: {{.DogStatsdHost}}, port_value: {{.DogStatsdPort}} }
      prefix: {{.Prefix}}
stats_flush_interval: 0.5s

static_resources:
  listeners:
    - name: l_test
      address: { socket_address: { address: 0.0.0.0, port_value: {{.ListenerPort}} } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP1
                stat_prefix: {{.StatPrefix}}
                route_config:
                  name: rc_test
                  virtual_hosts:
                    - name: vh_test
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: {{.BackendName}} }
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    # backend: HTTPFixedBody subprocess (17-byte fixed body) reached via
    # host.docker.internal from the reference Envoy container per ADR-0010.
    - name: {{.BackendName}}
      type: STRICT_DNS
      connect_timeout: 1s
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: {{.BackendName}}
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: {{.BackendHost}}, port_value: {{.BackendPort}} }
