# Phase 49 fixture 0093-stats-sink-dogstatsd expectations (ADR-0019 — prose; the
# driver is the enforcer via AssertStats; this file is documentation).
#
# This fixture proves the dog_statsd UDP line-protocol stats sink WITH TAGS
# end-to-end: cross-side EXACT (subject envoy-go vs reference Envoy
# contrib-v1.37.2 in Docker) on a deterministic COUNTER WIRE-NAME subset
# (post-stats.ExtractTags, prefix-joined: <prefix>.<residual>), asserting BOTH
# the per-flush DELTA-SUM model AND the extracted tag SET per name. PLUS the
# absolute GAUGE subset (cluster.membership_total == 1, tagged with
# cluster_name).
#
# Topology (single-listener plaintext H1; HTTPFixedBody backend; driver-owned
# in-process statsdrecv UDP receivers, extended in Task 6 with a Tags()
# accessor):
#   l_test (hcm_local)  — one downstream HTTP/1.1 listener; route prefix "/" →
#                         cluster c_backend (HTTPFixedBody, 17-byte body).
#   c_backend           — HTTPFixedBody subprocess ("backend:v1/fixed\n" = 17 bytes).
#   dog_statsd receiver — driver-owned in-process statsdrecv.Server on a
#                         driver-allocated UDP port, bound 0.0.0.0:<port> so the
#                         Docker reference container can send datagrams to the
#                         host via the bridge gateway IP (HostGatewayIP).
#
# A bootstrap-level stats_sinks[] dog_statsd entry (DogStatsdSink TypeURL, UDP
# address, prefix) on BOTH sides + stats_flush_interval: 0.5s. Each flush the
# proxy sends one UDP datagram per metric line
# (<prefix>.<residual>:<delta>|c[|#tags] for counters;
# <prefix>.<residual>:<abs>|g[|#tags] for gauges). NO node field is needed —
# dog_statsd carries no proxy identifier.
#
# ## The WIRE-name correction (the load-bearing diff vs 0092)
#
# UNLIKE the plain statsd sink (0092), the dog_statsd sink applies
# stats.ExtractTags (the SAME SN1-SN9 + SN4 matcher the Prometheus/
# metrics_service sinks use) BEFORE formatting the wire line, so the residual +
# prefix join differs from 0092's raw dotted name for the "same" underlying
# stat:
#
#   cluster.c_backend.upstream_rq_total -> wire "dsdpfx.cluster.upstream_rq_total"
#       (c_backend HOISTED to an envoy.cluster_name tag, NOT part of the name)
#   http.hcm_local.downstream_rq_total  -> wire "dsdpfx.http.downstream_rq_total"
#       (hcm_local HOISTED to an envoy.http_conn_manager_prefix tag)
#   http.hcm_local.downstream_rq_2xx    -> wire "dsdpfx.http.downstream_rq_xx"
#       (Rule SN4 REWRITES the WIRE NAME _2xx -> _xx AND hoists the digit "2"
#        to an envoy.response_code_class tag — this is a NAME rewrite, not just
#        a tag addition; a naive "same name, plus tags" assumption is WRONG,
#        corrected at the SPEC-49 review after a live probe confirmed
#        "probepfx.http.downstream_rq_xx:...|c|#envoy.response_code_class:2,...")
#
# Tags are appended as |#key1:val1,key2:val2 in the extractor's NATURAL
# (unsorted, SN4-prepended) order on BOTH sides — the reference does not
# alphabetically sort dog_statsd tags (reference_dogstatsd_tag_order_unsorted).
# The cross-side assertion is nonetheless an ORDER-INDEPENDENT map equality
# (maps.Equal) — the differential does not depend on the wire's tag order even
# though production now matches the reference's natural order.
#
# ## Two private per-side receivers + hard Close() (as-built)
#
# The dog_statsd sink flushes PERIODICALLY — the reference proxy keeps sending
# to its receiver for the whole test, including during the subject's drive
# window (reference_periodic_sink_differential_two_receivers). A single shared
# receiver would let the reference's concurrent datagrams contaminate the
# subject snapshot (and silently defeat subject-side deliberate breaks). So the
# driver starts TWO private UDP receivers — one per side — on two
# separately-allocated host ports, both bound 0.0.0.0 BEFORE either proxy
# starts. Each side owns an uncontaminated accumulator (no Reset() needed).
# After the subject snapshot BOTH receivers are hard-stopped via Close() — UDP
# is connectionless, so Close is unambiguous (no GracefulStop-vs-hard-stop
# distinction).
#
# ## Reference dog_statsd address: LITERAL HostGatewayIP (not host.docker.internal)
#
# The reference Envoy bootstrap is templated with the Docker bridge gateway IP
# (HostGatewayIP — the LITERAL IP a throwaway container's host.docker.internal
# resolves to) as the dog_statsd UDP address. The dog_statsd sink does NOT
# perform DNS resolution, the statsd sink precedent (AMEND-SD-REJECT;
# reference_docker_probe_bridge_network). The host process binds 0.0.0.0:<port>
# and is reachable from the reference container at <HostGatewayIP>:<port>. The
# subject bootstrap uses 127.0.0.1:<subjStatsdPort> (loopback). The driver
# duplicates its OWN local hostGatewayIP function (copied verbatim from the
# 0092 driver) rather than importing test/differential's exported
# HostGatewayIP, to avoid an import cycle: runner_test.go blank-imports this
# driver from within package differential.
#
# ## Workload + release barrier
#
# Each side fires K = 7 deterministic GET /probe requests (Host:
# dogstatsd.example, UA: dogstatsd-probe/1; all 2xx). The driver POLLS that
# side's private receiver until the deterministic COUNTER subset's per-flush
# deltas SUM to == 7 (DeltaSum — the release barrier; never a fixed sleep,
# reference_concurrency_differential_release_barrier).
#
# ## Post-convergence stability barrier (the delta invariant; catches the breaks)
#
# A single-window request burst makes the FIRST post-request flush emit
# delta = 7 − 0 = 7, INDISTINGUISHABLE from a broken absolute = 7. The
# delta-vs-absolute distinction only manifests in post-convergence stability.
# After the delta-SUM converges to K, the driver observes >= 2 further flushes
# (awaitFurtherFlushes, riding on the receiver's SeenCount(marker) per-name
# flush counter — a release barrier on the flush ticker, NOT a sleep) and
# snapshots only then, asserting the SUM is STILL K. Under correct deltas the
# now-idle counters emit a 0-delta |c line each flush so the SUM stays K (PASS);
# an absolute (or un-latched) sink re-adds the cumulative every flush so the SUM
# OVERSHOOTS K (snapshot > K → assert fails). This is what makes the deliberate
# emit-absolute / skip-the-latch breaks catchable
# (reference_delta_sink_differential_stability_barrier).
#
# ## Tag-SET assertion (order-independent) + the admin same-name collision
#
# For each counter subset name, the driver uses statsdrecv.Server.DeltaSumTagged
# (NOT the plain per-name DeltaSum) — a running sum keyed by BOTH the wire name
# AND an exact tag-set match. This was required because the bootstrap's admin
# interface has its OWN internal http_conn_manager stats (stat_prefix "admin"),
# which, via the SAME SN2 hoist, collapse to the SAME residual wire names as
# the test listener's ("http.downstream_rq_total", "http.downstream_rq_xx"),
# differing only in the envoy.http_conn_manager_prefix tag VALUE. The
# reference container's own admin readiness poll (wait.ForHTTP("/ready")) is
# itself one such "admin"-tagged request, so a name-only sum converged to K+1
# (never K) on the reference side when first run live — 0092 never hit this
# because its RAW (pre-extraction) dotted names never collided with admin's.
# DeltaSumTagged(name, wantTags) only accumulates lines whose tag set matches
# wantTags EXACTLY, so the admin-tagged line contributes to a DIFFERENT bucket
# and the test-listener bucket converges cleanly to K. The gauge's tag
# assertion is unaffected (single cluster, no admin equivalent) and still uses
# the plain last-seen Tags accessor.
#
# ## Per-datagram framing NOT asserted
#
# The cross-side assertion is on the AGGREGATED delta-SUM + last-seen tag set
# per counter name across all datagrams received — NOT the per-datagram
# framing, line count per datagram, datagram count, or flush cadence, which
# legitimately vary side-to-side.
#
# ## Asserted (cross-side EXACT on the deterministic COUNTER WIRE-NAME subset +
#              their tag SETS + the absolute GAUGE subset + its tag SET, both
#              sides)
#
# This is a name-SUBSET, NOT the whole datagram/line set (the surfaces differ
# cross-side — the reference emits many more lines including |ms timer
# histograms that envoy-go lacks). Names are the POST-EXTRACTION WIRE names,
# prefix-joined: the receiver keys on the full <prefix>.<residual> line.
#
#   dsdpfx.cluster.upstream_rq_total
#     present, delta-SUM == 7, tags == {envoy.cluster_name: c_backend}
#   dsdpfx.http.downstream_rq_total
#     present, delta-SUM == 7, tags == {envoy.http_conn_manager_prefix: hcm_local}
#   dsdpfx.http.downstream_rq_xx
#     present, delta-SUM == 7,
#     tags == {envoy.response_code_class: "2", envoy.http_conn_manager_prefix: hcm_local}
#
#   Absolute gauge (D-DSD-GAUGE-SUBSET):
#     dsdpfx.cluster.membership_total == 1, tags == {envoy.cluster_name: c_backend}
#
# ## UNasserted (vary side-to-side / impl-specific / non-deterministic)
#
#   The WHOLE datagram/line set (the reference emits many more lines including
#       |ms timer histograms that envoy-go lacks; lazy-instantiation grows the
#       set over time).
#   Non-deterministic gauges (server.uptime, *_active, connection churn).
#   Per-datagram framing + line order + datagram count per flush.
#   |ms timer lines (histogram side-channel; envoy-go has no histograms).
#   The literal tag ORDER on the wire (asserted as an order-independent SET,
#       even though the production formatter now matches the reference's
#       natural order — reference_dogstatsd_tag_order_unsorted).
#   The proxy identifier (dog_statsd has none — no node field).
#   Flush cadence / connection count (UDP is connectionless).
#
# Cross-refs: phase 49 SPEC + ADR-0266 + D-DSD-DELTA/TAGS/GAUGE-SUBSET +
#             reference_dogstatsd_tag_order_unsorted +
#             reference_delta_sink_differential_stability_barrier +
#             reference_periodic_sink_differential_two_receivers +
#             reference_differential_grpc_receiver_driver_owned +
#             reference_concurrency_differential_release_barrier +
#             reference_docker_probe_bridge_network +
#             reference_host_gateway_ip_docker_desktop +
#             reference_membership_total_vs_healthy_gauge.
