# envoy-go bootstrap for fixture 0116-tracing-custom-tags-metadata-host.
#
# Functionally equivalent to envoy.yaml modulo:
#   - cluster type: STATIC (envoy-go convention per ADR-0002) vs STRICT_DNS.
#   - cluster endpoint addresses: 127.0.0.1 (envoy-go runs on the host loopback)
#     vs host.docker.internal (reference Envoy runs in a Docker container).
#   - admin/listener ports independently allocated by the runner.
# The lb_endpoints[0].metadata block itself is BYTE-IDENTICAL to envoy.yaml's.
#
# Single-listener plaintext H1 topology, cloned from
# 0115-tracing-custom-tags-metadata-route with the metadata block RELOCATED from
# the route onto the cluster's lb_endpoints[0]: one downstream HTTP/1.1 listener
# routes every request to the HTTPFixedBody backend (cluster c_backend). The HCM
# carries a `tracing` block (OpenTelemetry provider, service_name "0116",
# random_sampling 100%) naming c_otlp_collector, which points at the
# driver-owned in-process otlptrace.Server receiver on the host loopback.
# envoy-go exports one OTLP Span per completed request via the OTLPExporter
# (phase 46.1b).
#
# phase 72: the SELECTED UPSTREAM ENDPOINT carries a STATIC
# lb_endpoints[].metadata.filter_metadata block (namespace "envoy.test", key
# "host_k", value "v-host-0116") — retained on cluster.Endpoint.filterMetadata
# at cluster-build time (internal/cluster/manager.go:884
# `filterMetadata: lbe.GetMetadata().GetFilterMetadata()`), read back through
# (cluster.Endpoint).MetaLookup threaded as the 5th ResolveCustomTags argument
# from the SELECTED endpoint at the three span-emit sites
# (internal/filter/hcm/accesslog_emit.go:57/:118/:179). NO writer is needed —
# both sides read the IDENTICAL static endpoint config, so the resolved value is
# cross-side EXACT. The `tracing` block carries TWO HOST `metadata` custom_tags:
#   host_hit     — metadata_key {key: envoy.test, path:[host_k]} → resolves to
#                  the static endpoint value "v-host-0116" (default_value UNUSED).
#   host_default — metadata_key {key: envoy.test, path:[absent_k]} → the path is
#                  UNSET → the default_value "fallback-0116" is emitted.
#
# ⚠️ The namespace is "envoy.test", NOT "envoy.lb": the phase-38 envoy.lb scalar
# projection (Endpoint.Metadata, the subset-LB dimension) is a DIFFERENT,
# byte-unchanged field. HOST-kind custom_tags address ANY namespace.
#
# Templating: rendered by the driver's mustRender() at SubjectConfig time.
# Substitution keys:
#   {{.AdminPort}}    — admin endpoint port (runner-allocated).
#   {{.ListenerPort}} — l_test listener port (runner-allocated).
#   {{.BackendPort}}  — HTTPFixedBody backend port (runner-allocated, loopback).
#   {{.OTLPPort}}     — driver-owned OTLP receiver port (driver-allocated; pre-bound
#                       on 0.0.0.0:<port> before the subject starts).
admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: {{.AdminPort}} }

static_resources:
  listeners:
    - name: l_test
      address: { socket_address: { address: 0.0.0.0, port_value: {{.ListenerPort}} } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP1
                stat_prefix: hcm_local
                tracing:
                  provider:
                    name: envoy.tracers.opentelemetry
                    typed_config:
                      "@type": type.googleapis.com/envoy.config.trace.v3.OpenTelemetryConfig
                      grpc_service:
                        envoy_grpc:
                          cluster_name: c_otlp_collector
                      service_name: "0116"
                  random_sampling:
                    value: 100
                  custom_tags:
                  - tag: host_hit
                    metadata:
                      kind:
                        host: {}
                      metadata_key:
                        key: envoy.test
                        path:
                        - key: host_k
                      default_value: unused-default-0116
                  - tag: host_default
                    metadata:
                      kind:
                        host: {}
                      metadata_key:
                        key: envoy.test
                        path:
                        - key: absent_k
                      default_value: fallback-0116
                route_config:
                  name: rc_test
                  virtual_hosts:
                    - name: vh_test
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: c_backend }
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    # c_backend: HTTPFixedBody subprocess (17-byte fixed body) on host loopback.
    # The SINGLE lb_endpoint carries the static HOST metadata block below (a
    # SIBLING of `endpoint:` at the same indent) — byte-identical to envoy.yaml.
    # Single-endpoint ⇒ the LB pick is deterministic.
    - name: c_backend
      type: STATIC
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: c_backend
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: 127.0.0.1, port_value: {{.BackendPort}} }
                metadata:
                  filter_metadata:
                    envoy.test:
                      host_k: v-host-0116
    # c_otlp_collector: driver-owned in-process OTLP TraceService gRPC receiver on
    # host loopback. MANDATORY http2_protocol_options: {} for gRPC framing.
    # Plaintext h2c — no TLS (D-OTLP-RECEIVER).
    - name: c_otlp_collector
      type: STATIC
      lb_policy: ROUND_ROBIN
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: c_otlp_collector
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: 127.0.0.1, port_value: {{.OTLPPort}} }
