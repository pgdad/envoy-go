# Reference Envoy bootstrap for fixture 0116-tracing-custom-tags-metadata-host.
#
# Single-listener plaintext H1 topology, cloned from
# 0115-tracing-custom-tags-metadata-route (the OTLP tracing custom_tags ROUTE
# metadata chassis) with the metadata block RELOCATED from the route onto the
# cluster's lb_endpoints[0]. One downstream HTTP/1.1 listener routes every
# request to the HTTPFixedBody backend (cluster c_backend). The HCM carries a
# `tracing` block (OpenTelemetry provider, random_sampling 100%, service_name
# "0116") naming c_otlp_collector, which points at the driver-owned in-process
# otlptrace.Server receiver. The reference Envoy exports one OTLP Span per
# completed request.
#
# phase 72: the SELECTED UPSTREAM ENDPOINT carries a STATIC
# lb_endpoints[].metadata.filter_metadata block (namespace "envoy.test", key
# "host_k", value "v-host-0116") — a SIBLING of `endpoint:` on the LbEndpoint
# message, at the SAME indent. NO writer is needed — both sides read the
# IDENTICAL static endpoint config, so the resolved value is cross-side EXACT
# with NO Lua filter in the chain. The `tracing` block carries TWO HOST
# `metadata` custom_tags:
#   host_hit     — metadata_key {key: envoy.test, path:[host_k]} → resolves to
#                  the static endpoint value "v-host-0116" (default_value UNUSED).
#   host_default — metadata_key {key: envoy.test, path:[absent_k]} → the path is
#                  UNSET → the default_value "fallback-0116" is emitted.
# The driver asserts BOTH tags cross-side EXACT by key AND value.
#
# ⚠️ The namespace is "envoy.test", NOT "envoy.lb". The landed endpoint-metadata
# cross-side precedent (0064-lb-subset) covers `envoy.lb` ONLY; a HOST-kind
# custom_tag can address ANY filter_metadata namespace (phase-72 SPEC probe P2),
# and this fixture is the cross-side proof of that generality.
#
# ⚠️ STRING VALUES ONLY. A struct-valued or numeric metadata value is NOT
# cross-side comparable: the reference serializes multi-key structs in an
# ARBITRARY key order (Go always sorts), scalar-vs-nested numbers use DIFFERENT
# reference renderers, and top-level scalar numbers render at ~6 significant
# digits on the reference vs full precision in Go.
#
# Templating: rendered by the driver's mustRender() at ReferenceBootstrap time.
# Substitution keys:
#   {{.AdminPort}}    — admin endpoint port (hard-coded 9901 by driver).
#   {{.ListenerPort}} — l_test in-container port (10116 per fixture convention).
#   {{.BackendHost}}  — HTTPFixedBody backend host (host.docker.internal per ADR-0010).
#   {{.BackendPort}}  — HTTPFixedBody backend port (runner-allocated).
#   {{.OTLPHost}}     — driver-owned OTLP receiver host (host.docker.internal for ref).
#   {{.OTLPPort}}     — driver-owned OTLP receiver port (driver-allocated; the
#                       in-process otlptrace.Server binds 0.0.0.0:<port> before the
#                       container starts).
#
# Cluster type: STRICT_DNS so the reference Envoy container resolves
# host.docker.internal (the Docker bridge host alias per ADR-0010). The
# reference therefore propagates lb_endpoints[].metadata THROUGH DNS
# resolution — the landed 0064-lb-subset precedent for exactly that.
# dns_lookup_family: V4_ONLY per the established fixture precedent.
admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: {{.AdminPort}} }

static_resources:
  listeners:
    - name: l_test
      address: { socket_address: { address: 0.0.0.0, port_value: {{.ListenerPort}} } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP1
                stat_prefix: hcm_local
                tracing:
                  provider:
                    name: envoy.tracers.opentelemetry
                    typed_config:
                      "@type": type.googleapis.com/envoy.config.trace.v3.OpenTelemetryConfig
                      grpc_service:
                        envoy_grpc:
                          cluster_name: c_otlp_collector
                      service_name: "0116"
                  random_sampling:
                    value: 100
                  custom_tags:
                  - tag: host_hit
                    metadata:
                      kind:
                        host: {}
                      metadata_key:
                        key: envoy.test
                        path:
                        - key: host_k
                      default_value: unused-default-0116
                  - tag: host_default
                    metadata:
                      kind:
                        host: {}
                      metadata_key:
                        key: envoy.test
                        path:
                        - key: absent_k
                      default_value: fallback-0116
                route_config:
                  name: rc_test
                  virtual_hosts:
                    - name: vh_test
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: c_backend }
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    # c_backend: HTTPFixedBody subprocess (17-byte fixed body) reached via
    # host.docker.internal from the reference Envoy container per ADR-0010.
    # The SINGLE lb_endpoint carries the static HOST metadata block below (a
    # SIBLING of `endpoint:` at the same indent) — byte-identical to
    # envoy-go.yaml. Single-endpoint ⇒ the LB pick is deterministic and no
    # round-robin spread enters the assertion.
    - name: c_backend
      type: STRICT_DNS
      connect_timeout: 1s
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: c_backend
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: {{.BackendHost}}, port_value: {{.BackendPort}} }
                metadata:
                  filter_metadata:
                    envoy.test:
                      host_k: v-host-0116
    # c_otlp_collector: driver-owned in-process OTLP TraceService gRPC receiver.
    # MANDATORY http2_protocol_options: {} for gRPC framing. Plaintext h2c — no TLS
    # (D-OTLP-RECEIVER). STRICT_DNS so the container can resolve the bridge hostname.
    - name: c_otlp_collector
      type: STRICT_DNS
      connect_timeout: 1s
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: c_otlp_collector
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: {{.OTLPHost}}, port_value: {{.OTLPPort}} }
