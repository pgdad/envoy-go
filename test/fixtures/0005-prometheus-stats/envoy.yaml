# Reference: upstream Envoy configuration for fixture 0005-prometheus-stats.
#
# Shape mirrors envoy-go.yaml with these divergences:
#   - Cluster type: STRICT_DNS (ADR-0010 V4_ONLY); backend reached via
#     host.docker.internal:<backend-port> from inside the container.
#   - Admin address: 0.0.0.0:9901 (fixed in-container port).
#   - Listener address: 0.0.0.0:15005 (fixed in-container port).
#
# --concurrency 1 (ADR-0028) is set by the harness's testcontainers Cmd.

admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: 9901 }

static_resources:
  listeners:
    - name: l_h1
      address: { socket_address: { address: 0.0.0.0, port_value: 15005 } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP1
                stat_prefix: ingress_http
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                route_config:
                  virtual_hosts:
                    - name: vh
                      domains: ["*"]
                      routes:
                        - match: { path: /missing }
                          direct_response: { status: 404, body: { inline_string: "not found\n" } }
                        - match: { prefix: / }
                          route: { cluster: c0 }
  clusters:
    - name: c0
      type: STRICT_DNS
      dns_lookup_family: V4_ONLY
      connect_timeout: 1s
      load_assignment:
        cluster_name: c0
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address: { socket_address: { address: host.docker.internal, port_value: 0 } }  # filled by driver
