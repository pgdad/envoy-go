# Reference Envoy bootstrap for fixture 0014-http-csrf.
# Single-listener `l_main` topology per planner-time decision 7 (PLAN.md):
# one HCM listener carrying the csrf filter at listener level + a per-route
# TPFC override on `/route-only`. Two routes:
#   - `/route-only` — typed_per_filter_config CsrfPolicy with
#     additional_origins=[route-only.test]
#   - `/`           — default (inherits listener-level CsrfPolicy)
#
# Listener-level CsrfPolicy: additional_origins=[app.example.test].
#
# Both csrf instances explicitly set `filter_enabled.default_value` to
# 100%/HUNDRED per SPEC §11.11 amendment + ADR-0121 (RuntimeFractionalPercent
# is PGV-REQUIRED upstream; envoy-go validates presence at parse time;
# both sides see effective-100% so runtime is byte-equivalent). `shadow_enabled`
# is OMITTED on both sides per §11.11 probe #3 baseline (always-100% behavior
# with shadow_enabled absent).
#
# `additional_origins[].exact` values use HOST[:PORT] form (NOT full URLs)
# per §11.8 amendment — the csrf filter compares against `hostAndPort(source)`
# with the scheme prefix stripped; full-URL forms (e.g. "https://app.example.test")
# would NEVER match a real `Origin:` header (operator footgun documented in
# SPEC §6.4 + BEHAVIOR_CONTRACT §13.1).
#
# Cluster type STRICT_DNS targeting `host.docker.internal` (reference Envoy
# runs in a Docker container; the differential runner spawns the backend on
# the host's loopback and reaches it via Docker Desktop's host-bridge alias);
# `dns_lookup_family: V4_ONLY` per phase-11 IMPL note (Docker Desktop's
# `host.docker.internal` resolves IPv6 by default; without V4_ONLY reference
# Envoy gets 503 because the IPv6 address is unroutable from the container).
admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: {{.AdminPort}} }

static_resources:
  listeners:
    - name: l_main
      address: { socket_address: { address: 0.0.0.0, port_value: {{.ListenerPort}} } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP1
                stat_prefix: ingress_csrf
                route_config:
                  name: rc_main
                  virtual_hosts:
                    - name: vh_main
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/route-only" }
                          route: { cluster: c_backend }
                          typed_per_filter_config:
                            envoy.filters.http.csrf:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.csrf.v3.CsrfPolicy
                              filter_enabled:
                                runtime_key: __route_only_enabled
                                default_value: { numerator: 100, denominator: HUNDRED }
                              additional_origins:
                                - exact: "route-only.test"
                        - match: { prefix: "/" }
                          route: { cluster: c_backend }
                http_filters:
                  - name: envoy.filters.http.csrf
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.csrf.v3.CsrfPolicy
                      filter_enabled:
                        runtime_key: __l_main_csrf_enabled
                        default_value: { numerator: 100, denominator: HUNDRED }
                      additional_origins:
                        - exact: "app.example.test"
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: c_backend
      type: STRICT_DNS
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: c_backend
        endpoints:
          - lb_endpoints:
              - endpoint: { address: { socket_address: { address: host.docker.internal, port_value: {{.BackendPort}} } } }
