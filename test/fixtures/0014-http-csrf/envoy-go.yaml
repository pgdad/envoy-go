# envoy-go bootstrap for fixture 0014-http-csrf.
# Identical to envoy.yaml modulo:
#   - cluster type: STATIC (envoy-go convention) vs STRICT_DNS (reference Envoy)
#   - backend address: 127.0.0.1 (envoy-go is in-process) vs host.docker.internal
#   - admin/listener ports independently allocated by the runner per proxy
#
# Single-listener `l_main` topology per planner-time decision 7 (PLAN.md):
# one HCM listener carrying the csrf filter at listener level + a per-route
# TPFC override on `/route-only`.
#
# `filter_enabled` field is PRESENT in this file (envoy-go validates its
# presence at parse time per SPEC §11.11 amendment + ADR-0121, but
# silent-ignores the percentage value at runtime — always-100%-active —
# per §2.1 cluster filter-enabled clause). Field presence ensures
# byte-equivalent config-load behavior across reference + subject.
# `shadow_enabled` is OMITTED on both sides per §11.11 probe #3 baseline.
#
# `additional_origins[].exact` values use HOST[:PORT] form (NOT full URLs)
# per §11.8 amendment — see envoy.yaml header for the operator-footgun note.
admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: {{.AdminPort}} }

static_resources:
  listeners:
    - name: l_main
      address: { socket_address: { address: 0.0.0.0, port_value: {{.ListenerPort}} } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP1
                stat_prefix: ingress_csrf
                route_config:
                  name: rc_main
                  virtual_hosts:
                    - name: vh_main
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/route-only" }
                          route: { cluster: c_backend }
                          typed_per_filter_config:
                            envoy.filters.http.csrf:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.csrf.v3.CsrfPolicy
                              filter_enabled:
                                runtime_key: __route_only_enabled
                                default_value: { numerator: 100, denominator: HUNDRED }
                              additional_origins:
                                - exact: "route-only.test"
                        - match: { prefix: "/" }
                          route: { cluster: c_backend }
                http_filters:
                  - name: envoy.filters.http.csrf
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.csrf.v3.CsrfPolicy
                      filter_enabled:
                        runtime_key: __l_main_csrf_enabled
                        default_value: { numerator: 100, denominator: HUNDRED }
                      additional_origins:
                        - exact: "app.example.test"
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: c_backend
      type: STATIC
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: c_backend
        endpoints:
          - lb_endpoints:
              - endpoint: { address: { socket_address: { address: 127.0.0.1, port_value: {{.BackendPort}} } } }
