# Reference Envoy bootstrap for fixture 0036-http-wasm-body-and-advanced.
#
# Per phase 25.2 SPEC §8 + Task 20 PLAN. Fourteen-listener topology (one
# listener per scenario (a)..(n)); each listener carries an
# `envoy.filters.http.wasm` HTTP filter that consumes
# `Wasm.config.vm_config.code.local.filename` pointing at a per-scenario
# `.wasm` blob under bytecode/. The TWO upstream clusters
# `cluster_a` (primary echo) + `cluster_b` (httpCall target) both
# point at the SAME differential echobackend per phase-22.2 REVIEW §7.4
# freeTCPPort flake mitigation — minimizes port pressure.
#
# Capability restriction: 25.2 introduces 21 NEW hostcall keys (per
# parent §6 sandbox EXTEND). Per AMEND-A5 envoy-go is StrictDefaultDeny;
# reference Envoy upstream treats the populated allow-list identically.
# We list the FULL post-25.2 superset on both sides for cross-side
# symmetry.
#
# Runtime: reference uses `envoy.wasm.runtime.v8`; envoy-go uses
# `envoy.wasm.runtime.wazero`. The .wasm blobs export
# `proxy_abi_version_0_2_1` (proxy-wasm-rust-sdk 0.2.4 per AMEND-A1).
admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: {{.AdminPort}} }

static_resources:
  listeners:
{{range .Listeners}}
    - name: {{.Name}}
      address: { socket_address: { address: 0.0.0.0, port_value: {{.Port}} } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP1
                stat_prefix: hcm_{{.Id}}
                route_config:
                  name: rc_{{.Id}}
                  virtual_hosts:
                    - name: vh_{{.Id}}
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: cluster_a }
                http_filters:
                  - name: envoy.filters.http.wasm
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.wasm.v3.Wasm
                      config:
                        name: plugin_{{.Id}}
                        root_id: scenario_{{.Id}}
                        vm_config:
                          vm_id: vm_{{.Id}}
                          runtime: envoy.wasm.runtime.v8
                          code:
                            local:
                              filename: "{{.WasmPath}}"
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
{{end}}

  clusters:
    - name: cluster_a
      type: STRICT_DNS
      connect_timeout: 0.25s
      lb_policy: ROUND_ROBIN
      dns_lookup_family: V4_ONLY
      load_assignment:
        cluster_name: cluster_a
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: {{.BackendHost}}, port_value: {{.BackendPort}} }
    - name: cluster_b
      type: STRICT_DNS
      connect_timeout: 0.25s
      lb_policy: ROUND_ROBIN
      dns_lookup_family: V4_ONLY
      load_assignment:
        cluster_name: cluster_b
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: {{.BackendHost}}, port_value: {{.BackendPort}} }
