# envoy-go subject bootstrap for fixture 0036-http-wasm-body-and-advanced.
#
# Per phase 25.2 SPEC §8 + Task 20 PLAN. Same 14-listener topology as
# envoy.yaml; runtime is `envoy.wasm.runtime.wazero` per AMEND-A1. Each
# listener consumes a host-side absolute path under the fixture
# directory's bytecode/ subdirectory.
#
# envoy-go-strict extension fields per Task 14 (compiled_config 4 NEW
# fields + 6 NEW PARSE-REJECT arms). Defaults per AMEND-B3:
#   envoy_go_strict_body_buffer_cap_bytes = 16777216 (16 MiB) — but
#     scenario (n) listener overrides to 1024 to force the 413.
#   envoy_go_strict_shared_data_value_cap_bytes = 1048576 (1 MiB)
#   envoy_go_strict_shared_data_max_entries = 1024
#   envoy_go_strict_dynamic_stats_max_entries = 1024
#
# All other scenarios use the global default 16 MiB body cap; only the
# scenario (n) listener requires the small-cap override.
admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: {{.AdminPort}} }

static_resources:
  listeners:
{{range .Listeners}}
    - name: {{.Name}}
      address: { socket_address: { address: 0.0.0.0, port_value: {{.Port}} } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP1
                stat_prefix: hcm_{{.Id}}
                route_config:
                  name: rc_{{.Id}}
                  virtual_hosts:
                    - name: vh_{{.Id}}
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: cluster_a }
                http_filters:
                  - name: envoy.filters.http.wasm
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.wasm.v3.Wasm
                      config:
                        name: plugin_{{.Id}}
                        root_id: scenario_{{.Id}}
                        vm_config:
                          vm_id: vm_{{.Id}}
                          runtime: envoy.wasm.runtime.wazero
                          code:
                            local:
                              filename: "{{.WasmPath}}"
{{- if gt .BodyBufferCapBytes 0}}
                        configuration:
                          "@type": type.googleapis.com/google.protobuf.Struct
                          value:
                            envoy_go_strict:
                              body_buffer_cap_bytes: {{.BodyBufferCapBytes}}
{{- end}}
                        capability_restriction_config:
                          allowed_capabilities:
                            proxy_log: {}
                            proxy_get_log_level: {}
                            proxy_get_header_map_pairs: {}
                            proxy_get_header_map_value: {}
                            proxy_get_header_map_size: {}
                            proxy_set_header_map_pairs: {}
                            proxy_add_header_map_value: {}
                            proxy_replace_header_map_value: {}
                            proxy_remove_header_map_value: {}
                            proxy_send_local_response: {}
                            proxy_get_property: {}
                            proxy_set_property: {}
                            proxy_get_status: {}
                            proxy_get_current_time_nanoseconds: {}
                            proxy_set_effective_context: {}
                            proxy_done: {}
                            proxy_get_buffer_bytes: {}
                            proxy_set_buffer_bytes: {}
                            proxy_get_buffer_status: {}
                            proxy_continue_stream: {}
                            proxy_close_stream: {}
                            proxy_set_tick_period_milliseconds: {}
                            proxy_http_call: {}
                            proxy_call_foreign_function: {}
                            proxy_define_metric: {}
                            proxy_increment_metric: {}
                            proxy_record_metric: {}
                            proxy_get_metric: {}
                            proxy_set_shared_data: {}
                            proxy_get_shared_data: {}
                            proxy_on_context_create: {}
                            proxy_on_vm_start: {}
                            proxy_on_configure: {}
                            proxy_on_done: {}
                            proxy_on_delete: {}
                            proxy_on_log: {}
                            proxy_on_request_headers: {}
                            proxy_on_response_headers: {}
                            proxy_on_request_body: {}
                            proxy_on_response_body: {}
                            proxy_on_request_trailers: {}
                            proxy_on_response_trailers: {}
                            proxy_on_tick: {}
                            proxy_on_http_call_response: {}
                            proxy_on_foreign_function: {}
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
{{end}}

  clusters:
    - name: cluster_a
      type: STATIC
      connect_timeout: 0.25s
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: cluster_a
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: 127.0.0.1, port_value: {{.BackendPort}} }
    - name: cluster_b
      type: STATIC
      connect_timeout: 0.25s
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: cluster_b
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: 127.0.0.1, port_value: {{.BackendPort}} }
