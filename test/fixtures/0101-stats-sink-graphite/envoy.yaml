# Reference Envoy bootstrap for fixture 0101-stats-sink-graphite.
#
# Single-listener plaintext H1 topology (phase 57 — graphite_statsd sink,
# ADR-0275, MERGING the phase-49 dog_statsd-with-tags shape
# (0093-stats-sink-dogstatsd) and the phase-50 dog_statsd batching shape
# (0094-stats-sink-dogstatsd-batching) into ONE fixture per D-GR-FIXTURE).
# One downstream HTTP/1.1 listener routes every request to the HTTPFixedBody
# backend (cluster {{.BackendName}} — DELIBERATELY a ~171-character literal,
# see below). A bootstrap-level stats_sinks[] graphite_statsd entry carries an
# EXPLICIT max_bytes_per_datagram cap ({{.MaxBytesPerDatagram}}), and a SHORT
# stats_flush_interval (500ms) drives fast deterministic convergence. Each
# flush the reference Envoy accumulates consecutive metric lines
# (<prefix>.<residual-name>[;envoy.k=v;...]:<delta>|c for counters;
# <prefix>.<residual-name>[;envoy.k=v;...]:<abs>|g for gauges) into a growing
# buffer and flushes it as ONE UDP datagram whenever the NEXT line would make
# the buffer STRICTLY exceed the cap — REAL multi-metric-per-datagram packing,
# the same D-GR-BATCHSHARE algorithm hoisted verbatim from phase 50's
# dog_statsd sink.
#
# D-GR-CAP (the batching design, computed EXACTLY via a throwaway
# t.Logf(len(...)) against the REAL production line-formatting code, not a
# hand-estimate — see the driver's package doc for the full byte-math table):
# the backend cluster name ({{.BackendName}}) is a DELIBERATELY long
# (171-char) literal, chosen so the envoy.cluster_name-tagged lines
# (cluster.upstream_rq_total, cluster.membership_total; ~225-226 bytes each)
# ALWAYS exceed the {{.MaxBytesPerDatagram}}-byte cap ALONE and are therefore
# ALWAYS sent alone in their own datagram — proving the "an oversized single
# line is sent alone, no truncation/drop" behavior. The HCM stat_prefix
# ({{.StatPrefix}}) stays SHORT, so the envoy.http_conn_manager_prefix-tagged
# lines (~75-100 bytes each) stay small enough to naturally CO-BATCH with each
# other and the many other short envoy-go/reference self-stat lines under the
# same cap — proving real multi-line packing actually occurs.
#
# UNLIKE the plain statsd sink (0092), graphite_statsd applies the SAME
# dotted-name -> (residual, tags) extraction as the dog_statsd/Prometheus/
# metrics_service sinks (SN1-SN9 + the SN4 status-class collapse):
# cluster.<name>.<rest> HOISTS <name> to an envoy.cluster_name tag;
# http.<stat_prefix>.<rest> HOISTS <stat_prefix> to an
# envoy.http_conn_manager_prefix tag; a trailing _Nxx (e.g. _2xx) REWRITES the
# WIRE NAME to _xx and hoists the digit to an envoy.response_code_class tag
# (the 0093 SN4 gotcha, unaffected by batching — see that fixture's driver
# doc). UNLIKE dog_statsd's trailing "|#k:v,..." suffix, graphite folds tags
# INTO the metric NAME as ";envoy.k=v" pairs (the ONE novel piece of phase
# 57 — AMEND-GR-TAGFORMAT), in the extractor's NATURAL (unsorted) order — the
# reference's two-tag order is the REVERSE of envoy-go's, a documented
# cross-side coverage boundary (AMEND-GR-TAGORDER).
#
# The graphite_statsd address is a LITERAL IP (HostGatewayIP — the Docker
# bridge gateway) because the graphite_statsd UDP sink does NOT perform DNS
# resolution, the dog_statsd sink precedent (AMEND-SD-REJECT;
# reference_docker_probe_bridge_network). The receiver is bound on
# 0.0.0.0:<port> so the reference container can send datagrams to the host.
#
# NO node field is needed — graphite_statsd carries no proxy identifier.
#
# Templating: rendered by the driver's mustRender() at ReferenceBootstrap time.
# Substitution keys:
#   {{.AdminPort}}     — admin endpoint port (hard-coded 9901 by driver).
#   {{.ListenerPort}}  — l_test in-container port (10101 per fixture convention).
#   {{.BackendHost}}   — HTTPFixedBody backend host (host.docker.internal per ADR-0010).
#   {{.BackendPort}}   — HTTPFixedBody backend port (runner-allocated).
#   {{.BackendName}}   — backend cluster name (FIXED identical both sides,
#                        DELIBERATELY long → the oversized envoy.cluster_name
#                        tagged lines).
#   {{.StatPrefix}}    — HCM stat_prefix (FIXED identical both sides, SHORT →
#                        the co-batching envoy.http_conn_manager_prefix tagged
#                        lines).
#   {{.GraphiteHost}}  — driver-owned statsdrecv receiver host
#                        (HostGatewayIP literal IP for the reference container).
#   {{.GraphitePort}}  — driver-owned statsdrecv receiver port (driver-allocated;
#                        the in-process statsdrecv.Server binds 0.0.0.0:<port>
#                        before the container starts).
#   {{.Prefix}}        — graphite_statsd metric prefix (baked identically on
#                        both sides; all metric names are <prefix>.<residual>).
#   {{.MaxBytesPerDatagram}} — the configured batching cap (D-GR-CAP, ADR-0275).
#
# Cluster type: STRICT_DNS so the reference Envoy container resolves
# host.docker.internal (the Docker bridge host alias per ADR-0010).
# dns_lookup_family: V4_ONLY per the established fixture precedent.

admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: {{.AdminPort}} }

# Bootstrap-level stats sink: the graphite_statsd UDP sink, with an EXPLICIT
# max_bytes_per_datagram cap (D-GR-CAP — honored, not strict-rejected).
# address.socket_address carries the LITERAL IP (HostGatewayIP) + UDP port of
# the driver-owned in-process statsdrecv receiver. A SHORT stats_flush_interval
# (500ms) drives fast deterministic convergence (vs the 5s default). Under the
# graphite model each COUNTER flush line carries the per-flush DELTA plus its
# name-embedded tag suffix; gauges carry the absolute value plus tags. prefix
# is baked identically on both sides so metric names match cross-side.
stats_sinks:
  - name: envoy.stat_sinks.graphite_statsd
    typed_config:
      "@type": type.googleapis.com/envoy.extensions.stat_sinks.graphite_statsd.v3.GraphiteStatsdSink
      address:
        socket_address: { protocol: UDP, address: {{.GraphiteHost}}, port_value: {{.GraphitePort}} }
      prefix: {{.Prefix}}
      max_bytes_per_datagram: {{.MaxBytesPerDatagram}}
stats_flush_interval: 0.5s

static_resources:
  listeners:
    - name: l_test
      address: { socket_address: { address: 0.0.0.0, port_value: {{.ListenerPort}} } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP1
                stat_prefix: {{.StatPrefix}}
                route_config:
                  name: rc_test
                  virtual_hosts:
                    - name: vh_test
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: {{.BackendName}} }
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    # backend: HTTPFixedBody subprocess (17-byte fixed body) reached via
    # host.docker.internal from the reference Envoy container per ADR-0010.
    - name: {{.BackendName}}
      type: STRICT_DNS
      connect_timeout: 1s
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: {{.BackendName}}
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: {{.BackendHost}}, port_value: {{.BackendPort}} }
