# envoy-go bootstrap for fixture 0121-listener-default-chain-tls.
#
# Functionally equivalent to envoy.yaml modulo:
#   - cluster type: STATIC (envoy-go convention per ADR-0002) vs STRICT_DNS.
#   - cluster endpoint address: 127.0.0.1 (envoy-go runs on the host loopback;
#     there is no container boundary and so no DNS indirection) vs
#     host.docker.internal.
#   - admin/listener ports independently allocated by the runner.
#
# ONE listener (l_dfc) that carries **NO filter_chains[] key at all**: the sole
# chain is default_filter_chain, and it is the chain that terminates TLS.
#
# ⚠️ THE ABSENT KEY IS THE SUBJECT OF THIS ROW. `filter_chains:` must NEVER be
# added to this file. envoy-go's listener manager derives its "this listener is
# TLS" boolean by walking filter_chains[]; a listener whose TLS lives only in
# default_filter_chain leaves that boolean FALSE while the stat-registration
# guard is a DIFFERENT predicate that is TRUE. Adding filter_chains[] here makes
# the fixture vacuous.
#
# ⚠️ NO require_client_certificate, AND NO validation_context. The listener
# sends no CertificateRequest, so a completing handshake books BOTH
# ssl.handshake and ssl.no_certificate — the latter is the SECOND mover here,
# not a zero.
#
# ⚠️ THE ROUTE IS direct_response, DELIBERATELY: a route to a fast-failing
# upstream suppresses the listener-scope ssl.* counters on the reference side
# (reference_ssl_stats_suppressed_by_fast_failing_upstream). direct_response
# makes that failure mode structurally impossible on both sides.
#
# ⚠️ CERT DELIVERY IS inline_string:, NEVER filename: — kept byte-symmetric with
# the reference side. The subject COULD read filename: paths since it runs on
# the host, but a divergent data-source specifier across the two sides would
# make any cert-related divergence ambiguous.
#
# ⚠️ envoy-go REJECTS match.headers, BOOT-REJECTS access_log[].log_format, and
# BOOT-REJECTS TLSv1_0/TLSv1_1 in tls_params. This fixture needs none of them;
# do not add them.
#
# Templating: rendered by the driver's mustRender() at SubjectConfig time.
# Substitution keys:
#   {{.AdminPort}}    — admin endpoint port (runner-allocated).
#   {{.ListenerPort}} — l_dfc listener port (runner-allocated).
#   {{.BackendPort}}  — placeholder backend port (runner-allocated, loopback).
#   .ServerCertIndented — pki/server.pem, pre-indented to 22 spaces.
#   .ServerKeyIndented  — pki/server.key.pem, pre-indented to 22 spaces.
#
# NOTE: the two PEM keys above are deliberately written WITHOUT their
# double-brace template-action delimiters. text/template expands actions inside
# YAML comments too, and a multi-line PEM expanded into a "#" comment line
# splatters its continuation lines outside the comment and produces invalid
# YAML.
admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: {{.AdminPort}} }

static_resources:
  listeners:
    - name: l_dfc
      address:
        socket_address: { address: 0.0.0.0, port_value: {{.ListenerPort}} }
      # ⚠️ NO filter_chains: KEY. See the header. default_filter_chain is the
      # only chain, and it is the TLS-terminating one.
      default_filter_chain:
        transport_socket:
          name: envoy.transport_sockets.tls
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
            common_tls_context:
              alpn_protocols: ["http/1.1"]
              tls_certificates:
                - certificate_chain:
                    inline_string: |
{{.ServerCertIndented}}
                  private_key:
                    inline_string: |
{{.ServerKeyIndented}}
        filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              codec_type: HTTP1
              stat_prefix: ingress_dfc
              route_config:
                name: local_route
                virtual_hosts:
                  - name: vh_default
                    domains: ["*"]
                    routes:
                      - match: { prefix: "/" }
                        direct_response:
                          status: 200
                          body: { inline_string: "phase96-default-chain-ok\n" }
              http_filters:
                - name: envoy.filters.http.router
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    # c_placeholder: never dialled. direct_response answers every request inside
    # the HCM. It exists solely because an omitted clusters: key BOOT-REJECTS
    # envoy-go and the runner requires BackendCount() >= 1.
    - name: c_placeholder
      type: STATIC
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: c_placeholder
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: 127.0.0.1, port_value: {{.BackendPort}} }
