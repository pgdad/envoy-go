# Reference Envoy bootstrap for fixture 0121-listener-default-chain-tls.
#
# Phase 96 — the listener-scope ssl.* differential on a listener whose ONLY TLS
# is its default_filter_chain. ONE listener (l_dfc) that carries **NO
# filter_chains[] key at all**: the sole chain is default_filter_chain, and it
# is the chain that terminates TLS.
#
# ⚠️ THE ABSENT KEY IS THE SUBJECT OF THIS ROW. `filter_chains:` must NEVER be
# added to this file. envoy-go's listener manager derives its "this listener is
# TLS" boolean by walking filter_chains[]; a listener whose TLS lives only in
# default_filter_chain leaves that boolean FALSE while the stat-registration
# guard is a DIFFERENT predicate that is TRUE — which is precisely the
# divergence 0121 pins. Adding filter_chains[] here makes the fixture vacuous.
#
# THE PROPOSITION: on a listener whose only TLS context is its
# default_filter_chain, both sides register the five listener-scope ssl.*
# counters and both book ssl.handshake AND ssl.no_certificate once per
# COMPLETED handshake:
#
#   ssl.handshake           = 3   (three arms, three completed handshakes)
#   ssl.no_certificate      = 3   ⚠️ 3, NOT 0 — see below
#   ssl.fail_verify_error   = 0
#   ssl.fail_verify_no_cert = 0
#   ssl.connection_error    = 0
#
# ⚠️ NO require_client_certificate, AND NO validation_context. The listener
# therefore sends no CertificateRequest, and a completing handshake books BOTH
# ssl.handshake and ssl.no_certificate. ssl.no_certificate is the SECOND mover
# here, not a zero. Adding require_client_certificate (or a client leaf to the
# pki/ directory) would change the measured map.
#
# ⚠️ THE ROUTE IS direct_response, DELIBERATELY. A route to a fast-failing
# upstream SUPPRESSES the listener-scope ssl.* counters on the reference side
# (reference_ssl_stats_suppressed_by_fast_failing_upstream): the connection is
# torn down before the handshake is booked, and the pin then reads 0 with the
# config looking fine. direct_response makes that failure mode structurally
# impossible — no upstream is ever dialled.
#
# ⚠️ CERT DELIVERY IS inline_string:, NEVER filename:. The pki/ directory exists
# on the HOST, where envoy-go runs; it does NOT exist inside this reference
# CONTAINER, and this fixture implements no ReferenceLogMounter bind-mount.
#
# Cluster type: STRICT_DNS + host.docker.internal per ADR-0010. The cluster is a
# PLACEHOLDER — direct_response never reaches it — but it cannot be omitted: an
# absent clusters: key BOOT-REJECTS envoy-go, and the runner t.Fatalf's on
# BackendCount() < 1.
#
# Templating: rendered by the driver's mustRender() at ReferenceBootstrap time.
# Substitution keys:
#   {{.AdminPort}}    — admin endpoint port (reference container; 9901).
#   {{.ListenerPort}} — l_dfc in-container port. 10127, NOT 10121: 0028 holds
#                        10120-10125 as one contiguous six-listener run, and
#                        0120 holds 10126. 10127 is the first free port above.
#   {{.BackendPort}}  — placeholder backend port (runner-allocated on the host,
#                        reached from the container via host.docker.internal).
#   .ServerCertIndented — pki/server.pem, pre-indented to 22 spaces.
#   .ServerKeyIndented  — pki/server.key.pem, pre-indented to 22 spaces.
#
# NOTE: the two PEM keys above are deliberately written WITHOUT their
# double-brace template-action delimiters. text/template expands actions inside
# YAML comments too, and a multi-line PEM expanded into a "#" comment line
# splatters its continuation lines outside the comment and produces invalid
# YAML.
admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: {{.AdminPort}} }

static_resources:
  listeners:
    - name: l_dfc
      address:
        socket_address: { address: 0.0.0.0, port_value: {{.ListenerPort}} }
      # ⚠️ NO filter_chains: KEY. See the header. default_filter_chain is the
      # only chain, and it is the TLS-terminating one.
      default_filter_chain:
        transport_socket:
          name: envoy.transport_sockets.tls
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
            common_tls_context:
              alpn_protocols: ["http/1.1"]
              tls_certificates:
                - certificate_chain:
                    inline_string: |
{{.ServerCertIndented}}
                  private_key:
                    inline_string: |
{{.ServerKeyIndented}}
        filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              codec_type: HTTP1
              stat_prefix: ingress_dfc
              route_config:
                name: local_route
                virtual_hosts:
                  - name: vh_default
                    domains: ["*"]
                    routes:
                      - match: { prefix: "/" }
                        direct_response:
                          status: 200
                          body: { inline_string: "phase96-default-chain-ok\n" }
              http_filters:
                - name: envoy.filters.http.router
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    # c_placeholder: never dialled. direct_response answers every request inside
    # the HCM. It exists solely because an omitted clusters: key BOOT-REJECTS
    # envoy-go and the runner requires BackendCount() >= 1.
    - name: c_placeholder
      type: STRICT_DNS
      dns_lookup_family: V4_ONLY
      connect_timeout: 1s
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: c_placeholder
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: host.docker.internal, port_value: {{.BackendPort}} }
