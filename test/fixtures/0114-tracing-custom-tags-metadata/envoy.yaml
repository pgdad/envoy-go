# Reference Envoy bootstrap for fixture 0114-tracing-custom-tags-metadata.
#
# Single-listener plaintext H1 topology, cloned from
# 0106-tracing-custom-tags-environment (the OTLP tracing custom_tags chassis)
# + the 0027-http-lua-full-bridge Lua http_filter shape. One downstream
# HTTP/1.1 listener routes every request to the HTTPFixedBody backend (cluster
# c_backend). The HCM carries a `tracing` block (OpenTelemetry provider,
# random_sampling 100%, service_name "0114") naming c_otlp_collector, which
# points at the driver-owned in-process otlptrace.Server receiver. The
# reference Envoy exports one OTLP Span per completed request.
#
# phase 70: a Lua http_filter (default_source_code.inline_string, embedded by
# the driver from scripts/writer.lua via strconv.Quote so NO container mount is
# needed) runs BEFORE the router and writes a FIXED cross-side-identical value
# into the request dynamic-metadata bucket ("envoy.test"/"meta_k" =
# "v-meta-0114"). The `tracing` block carries TWO REQUEST `metadata`
# custom_tags:
#   meta_hit     — metadata_key {key: envoy.test, path:[meta_k]} → resolves to
#                  the Lua-set fixed value "v-meta-0114" (default_value UNUSED).
#   meta_default — metadata_key {key: envoy.test, path:[absent_k]} → the path is
#                  UNSET → the default_value "fallback-0114" is emitted.
# The driver asserts BOTH tags cross-side EXACT by key AND value (STRONGER than
# 0106's key-only environment tag — the Lua value is byte-identical on both
# sides).
#
# Templating: rendered by the driver's mustRender() at ReferenceBootstrap time.
# Substitution keys:
#   {{.AdminPort}}    — admin endpoint port (hard-coded 9901 by driver).
#   {{.ListenerPort}} — l_test in-container port (10114 per fixture convention).
#   {{.BackendHost}}  — HTTPFixedBody backend host (host.docker.internal per ADR-0010).
#   {{.BackendPort}}  — HTTPFixedBody backend port (runner-allocated).
#   {{.OTLPHost}}     — driver-owned OTLP receiver host (host.docker.internal for ref).
#   {{.OTLPPort}}     — driver-owned OTLP receiver port (driver-allocated; the
#                       in-process otlptrace.Server binds 0.0.0.0:<port> before the
#                       container starts).
#   {{.LuaInline}}    — the scripts/writer.lua source, strconv.Quote'd into a
#                       double-quoted YAML scalar (no container mount required).
#
# Cluster type: STRICT_DNS so the reference Envoy container resolves
# host.docker.internal (the Docker bridge host alias per ADR-0010).
# dns_lookup_family: V4_ONLY per the established fixture precedent.
admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: {{.AdminPort}} }

static_resources:
  listeners:
    - name: l_test
      address: { socket_address: { address: 0.0.0.0, port_value: {{.ListenerPort}} } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP1
                stat_prefix: hcm_local
                tracing:
                  provider:
                    name: envoy.tracers.opentelemetry
                    typed_config:
                      "@type": type.googleapis.com/envoy.config.trace.v3.OpenTelemetryConfig
                      grpc_service:
                        envoy_grpc:
                          cluster_name: c_otlp_collector
                      service_name: "0114"
                  random_sampling:
                    value: 100
                  custom_tags:
                  - tag: meta_hit
                    metadata:
                      kind:
                        request: {}
                      metadata_key:
                        key: envoy.test
                        path:
                        - key: meta_k
                      default_value: unused-default-0114
                  - tag: meta_default
                    metadata:
                      kind:
                        request: {}
                      metadata_key:
                        key: envoy.test
                        path:
                        - key: absent_k
                      default_value: fallback-0114
                route_config:
                  name: rc_test
                  virtual_hosts:
                    - name: vh_test
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: c_backend }
                http_filters:
                  - name: envoy.filters.http.lua
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                      stat_prefix: meta_writer
                      default_source_code:
                        inline_string: {{.LuaInline}}
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    # c_backend: HTTPFixedBody subprocess (17-byte fixed body) reached via
    # host.docker.internal from the reference Envoy container per ADR-0010.
    - name: c_backend
      type: STRICT_DNS
      connect_timeout: 1s
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: c_backend
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: {{.BackendHost}}, port_value: {{.BackendPort}} }
    # c_otlp_collector: driver-owned in-process OTLP TraceService gRPC receiver.
    # MANDATORY http2_protocol_options: {} for gRPC framing. Plaintext h2c — no TLS
    # (D-OTLP-RECEIVER). STRICT_DNS so the container can resolve the bridge hostname.
    - name: c_otlp_collector
      type: STRICT_DNS
      connect_timeout: 1s
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: c_otlp_collector
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: {{.OTLPHost}}, port_value: {{.OTLPPort}} }
