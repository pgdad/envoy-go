# envoy-go bootstrap for fixture 0114-tracing-custom-tags-metadata.
#
# Functionally equivalent to envoy.yaml modulo:
#   - cluster type: STATIC (envoy-go convention per ADR-0002) vs STRICT_DNS.
#   - cluster endpoint addresses: 127.0.0.1 (envoy-go runs on the host loopback)
#     vs host.docker.internal (reference Envoy runs in a Docker container).
#   - admin/listener ports independently allocated by the runner.
#
# Single-listener plaintext H1 topology, cloned from
# 0106-tracing-custom-tags-environment: one downstream HTTP/1.1 listener routes
# every request to the HTTPFixedBody backend (cluster c_backend). The HCM
# carries a `tracing` block (OpenTelemetry provider, service_name "0114",
# random_sampling 100%) naming c_otlp_collector, which points at the
# driver-owned in-process otlptrace.Server receiver on the host loopback.
# envoy-go exports one OTLP Span per completed request via the OTLPExporter
# (phase 46.1b).
#
# phase 70: a Lua http_filter (default_source_code.inline_string, embedded by
# the driver from scripts/writer.lua via strconv.Quote) runs BEFORE the router
# and writes a FIXED cross-side-identical value into the request
# dynamic-metadata bucket ("envoy.test"/"meta_k" = "v-meta-0114") — the SAME
# script bytes the reference runs. The `tracing` block carries TWO REQUEST
# `metadata` custom_tags:
#   meta_hit     — metadata_key {key: envoy.test, path:[meta_k]} → resolves to
#                  the Lua-set fixed value "v-meta-0114" (default_value UNUSED).
#   meta_default — metadata_key {key: envoy.test, path:[absent_k]} → the path is
#                  UNSET → the default_value "fallback-0114" is emitted.
# Both sides run the SAME Lua → the SAME Bucket write → the SAME resolved
# string, so the driver asserts cross-side EXACT by key AND value.
#
# Templating: rendered by the driver's mustRender() at SubjectConfig time.
# Substitution keys:
#   {{.AdminPort}}    — admin endpoint port (runner-allocated).
#   {{.ListenerPort}} — l_test listener port (runner-allocated).
#   {{.BackendPort}}  — HTTPFixedBody backend port (runner-allocated, loopback).
#   {{.OTLPPort}}     — driver-owned OTLP receiver port (driver-allocated; pre-bound
#                       on 0.0.0.0:<port> before the subject starts).
#   {{.LuaInline}}    — the scripts/writer.lua source, strconv.Quote'd into a
#                       double-quoted YAML scalar (same bytes as envoy.yaml).
admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: {{.AdminPort}} }

static_resources:
  listeners:
    - name: l_test
      address: { socket_address: { address: 0.0.0.0, port_value: {{.ListenerPort}} } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP1
                stat_prefix: hcm_local
                tracing:
                  provider:
                    name: envoy.tracers.opentelemetry
                    typed_config:
                      "@type": type.googleapis.com/envoy.config.trace.v3.OpenTelemetryConfig
                      grpc_service:
                        envoy_grpc:
                          cluster_name: c_otlp_collector
                      service_name: "0114"
                  random_sampling:
                    value: 100
                  custom_tags:
                  - tag: meta_hit
                    metadata:
                      kind:
                        request: {}
                      metadata_key:
                        key: envoy.test
                        path:
                        - key: meta_k
                      default_value: unused-default-0114
                  - tag: meta_default
                    metadata:
                      kind:
                        request: {}
                      metadata_key:
                        key: envoy.test
                        path:
                        - key: absent_k
                      default_value: fallback-0114
                route_config:
                  name: rc_test
                  virtual_hosts:
                    - name: vh_test
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: c_backend }
                http_filters:
                  - name: envoy.filters.http.lua
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                      stat_prefix: meta_writer
                      default_source_code:
                        inline_string: {{.LuaInline}}
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    # c_backend: HTTPFixedBody subprocess (17-byte fixed body) on host loopback.
    - name: c_backend
      type: STATIC
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: c_backend
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: 127.0.0.1, port_value: {{.BackendPort}} }
    # c_otlp_collector: driver-owned in-process OTLP TraceService gRPC receiver on
    # host loopback. MANDATORY http2_protocol_options: {} for gRPC framing.
    # Plaintext h2c — no TLS (D-OTLP-RECEIVER).
    - name: c_otlp_collector
      type: STATIC
      lb_policy: ROUND_ROBIN
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: c_otlp_collector
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: 127.0.0.1, port_value: {{.OTLPPort}} }
