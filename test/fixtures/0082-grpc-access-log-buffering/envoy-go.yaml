# envoy-go bootstrap for fixture 0082-grpc-access-log-buffering.
#
# 0081 + the two common_config buffer fields (buffer_size_bytes 1 MiB [dormant
# SIZE trigger] + buffer_flush_interval 1s [the TIMER flush lever]) so >= 2
# entries from a concurrent burst coalesce into one StreamAccessLogsMessage
# (D-BUF-DIFFERENTIAL-DRIVE / SPEC §8.1).
#
# Functionally equivalent to envoy.yaml modulo:
#   - cluster type: STATIC (envoy-go convention per ADR-0002) vs STRICT_DNS.
#   - cluster endpoint addresses: 127.0.0.1 (envoy-go runs on the host loopback)
#     vs host.docker.internal (reference Envoy runs in a Docker container).
#   - admin/listener ports independently allocated by the runner.
#
# Single-listener plaintext H1 topology: one downstream HTTP/1.1 listener routes
# every request to the HTTPFixedBody backend (cluster c_backend); the HCM carries
# one `access_log[]` HttpGrpcAccessLogConfig entry that streams a
# HTTPAccessLogEntry proto per completed request to the driver-owned in-process
# AccessLogService receiver (cluster c_als; h2c, no TLS — D-ALS-RECEIVER).
#
# Templating: rendered by the driver's mustRender() at SubjectConfig time.
# Substitution keys:
#   {{.AdminPort}}    — admin endpoint port (runner-allocated).
#   {{.ListenerPort}} — l_test listener port (runner-allocated).
#   {{.BackendPort}}  — HTTPFixedBody backend port (runner-allocated).
#   {{.ALSHost}}      — driver-owned ALS receiver host (127.0.0.1 for envoy-go).
#   {{.ALSPort}}      — driver-owned ALS receiver port (driver-allocated; pre-bound).
admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: {{.AdminPort}} }

static_resources:
  listeners:
    - name: l_test
      address: { socket_address: { address: 0.0.0.0, port_value: {{.ListenerPort}} } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP1
                stat_prefix: hcm_local
                access_log:
                  - name: envoy.access_loggers.http_grpc
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.grpc.v3.HttpGrpcAccessLogConfig
                      common_config:
                        log_name: "0082"
                        grpc_service:
                          envoy_grpc:
                            cluster_name: c_als
                        buffer_size_bytes: 1048576      # 1 MiB — never hit by N small entries (the SIZE trigger stays dormant; the TIMER is the flush lever — D-BUF-DIFFERENTIAL-DRIVE / SPEC §8.1)
                        buffer_flush_interval: 1s       # the deterministic flush cadence; wide vs the concurrent burst so >= 2 entries coalesce
                route_config:
                  name: rc_test
                  virtual_hosts:
                    - name: vh_test
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: c_backend }
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    # c_backend: HTTPFixedBody subprocess (17-byte fixed body) on host loopback.
    - name: c_backend
      type: STATIC
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: c_backend
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: 127.0.0.1, port_value: {{.BackendPort}} }
    # c_als: driver-owned in-process AccessLogService gRPC receiver on host
    # loopback. MANDATORY http2_protocol_options: {} for gRPC framing. Plaintext
    # h2c — no TLS (D-ALS-RECEIVER).
    - name: c_als
      type: STATIC
      lb_policy: ROUND_ROBIN
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: c_als
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: {{.ALSHost}}, port_value: {{.ALSPort}} }
