# Reference bootstrap for 0099-http-tap-headers.
# The tap sink writes into /envoy-go-test/taps, a NON-STICKY container dir
# bind-mounted from a host temp dir (fixture.HostMount{Dir: true}). /tmp would
# EACCES under fs.protected_regular=2 because envoy runs as uid 101.
admin:
  address:
    socket_address: {address: 0.0.0.0, port_value: 9901}
static_resources:
  listeners:
  - name: listener_0
    address:
      socket_address: {address: 0.0.0.0, port_value: {{.ListenerPort}}}
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: tap_probe
          route_config:
            name: local_route
            virtual_hosts:
            - name: vh
              domains: ["*"]
              routes:
              - match: {prefix: "/"}
                route: {cluster: backend}
          http_filters:
          - name: envoy.filters.http.tap
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.tap.v3.Tap
              common_config:
                static_config:
                  match:
                    and_match:
                      rules:
                      - http_request_headers_match:
                          headers:
                          - name: x-tap
                            string_match: {exact: "yes"}
                      - http_response_headers_match:
                          headers:
                          - name: ":status"
                            string_match: {exact: "204"}
                  output_config:
                    sinks:
                    - format: JSON_BODY_AS_STRING
                      file_per_tap:
                        path_prefix: {{.TapPrefix}}
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
  - name: backend
    connect_timeout: 1s
    type: STRICT_DNS
    dns_lookup_family: V4_ONLY  # ADR-0010: host.docker.internal resolves both A/AAAA;
                                 # Docker Desktop Linux doesn't bridge IPv6 to the host.
    load_assignment:
      cluster_name: backend
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address: {address: {{.BackendHost}}, port_value: {{.BackendPort}}}
