# Reference Envoy bootstrap for fixture 0108-xds-sds-validation-context.
#
# Single-listener downstream-mTLS topology (phase 65 — the SDS
# validation_context apply differential). One TLS-terminating tcp_proxy
# listener (l_sds_mtls) whose DownstreamTlsContext carries
# require_client_certificate: true, a STATIC inline server cert, and a
# validation_context_sds_secret_config naming secret "validation_ca" —
# fetched over a SotW SDS gRPC stream against cluster sds_cluster (h2c,
# driver-owned in-process test/helpers/sdsserver receiver). No tls_inspector
# is needed — a single filter chain, no SNI match.
#
# The observable is the driver's normalized accept/reject verdict over two
# client certs (one chaining to the SERVED CA, one to an UN-SERVED CA) — NOT
# the served leaf identity (that is 0103's observable) and NOT a stat
# (envoy-go emits no ssl.* family; see README).
#
# Only the validation_context arrives via SDS; the server cert is STATIC, so
# boot's SDS pre-scan sees exactly one secret (seen==1) and the deferred
# compose-two edge is never touched (PLAN-65 D3).
#
# node: {id, cluster} is REQUIRED — SDS boot-fails without it.
#
# Templating: rendered by the driver's mustRender() at ReferenceBootstrap
# time. Substitution keys:
#   {{.SDSHost}}     — driver-owned SDS receiver host (host.docker.internal
#                       for the reference container per ADR-0010).
#   {{.SDSPort}}     — driver-owned SDS receiver port (driver-allocated; the
#                       in-process sdsserver.Server binds 0.0.0.0:<port>
#                       before the container starts).
#   {{.BackendPort}} — TCP echo backend port (runner-allocated; reached via
#                       host.docker.internal).
#   .ServerCert      — server leaf PEM, generated in-memory per run and
#                       injected inline_string (PLAN-65 D2 — no pki/ dir, no
#                       Docker mount). Pre-indented to 24 spaces by the
#                       driver's indentPEM for the block scalar below.
#   .ServerKey       — the leaf's ECDSA P-256 key PEM, likewise.
#
# NOTE: the two PEM keys above are deliberately written WITHOUT their
# double-brace template-action delimiters. text/template expands actions
# inside YAML comments too, and a multi-line PEM expanded into a "#" comment
# line splatters its continuation lines outside the comment and produces
# invalid YAML. The single-line keys above stay delimited safely because their
# values are single-line scalars; these two must not be.
#
# Cluster types: STRICT_DNS so the reference Envoy container resolves
# host.docker.internal (the Docker bridge host alias per ADR-0010).
# dns_lookup_family: V4_ONLY per the established fixture precedent.
node:
  id: envoygo-node
  cluster: envoygo-cluster

admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: 9901 }

static_resources:
  listeners:
    - name: l_sds_mtls
      address:
        socket_address: { address: 0.0.0.0, port_value: 10444 }
      filter_chains:
        - transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
              require_client_certificate: true
              common_tls_context:
                tls_certificates:
                  - certificate_chain:
                      inline_string: |
{{.ServerCert}}
                    private_key:
                      inline_string: |
{{.ServerKey}}
                validation_context_sds_secret_config:
                  name: validation_ca
                  sds_config:
                    resource_api_version: V3
                    api_config_source:
                      api_type: GRPC
                      transport_api_version: V3
                      grpc_services:
                        - envoy_grpc:
                            cluster_name: sds_cluster
          filters:
            - name: envoy.filters.network.tcp_proxy
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
                stat_prefix: ingress_sds_mtls
                cluster: c_backend

  clusters:
    # c_backend: TCP echo backend (BackendCount=1). Unlike 0103 it IS
    # exercised — the good arm writes a payload and reads the echo back.
    - name: c_backend
      type: STRICT_DNS
      connect_timeout: 1s
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: c_backend
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: host.docker.internal, port_value: {{.BackendPort}} }
    # sds_cluster: driver-owned in-process sdsserver.Server SDS receiver.
    # MANDATORY http2_protocol_options: {} for gRPC framing. Plaintext h2c —
    # no TLS. STRICT_DNS so the container can resolve the bridge hostname.
    - name: sds_cluster
      type: STRICT_DNS
      connect_timeout: 1s
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: sds_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: {{.SDSHost}}, port_value: {{.SDSPort}} }
