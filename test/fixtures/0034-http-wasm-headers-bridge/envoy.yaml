# Reference Envoy bootstrap for fixture 0034-http-wasm-headers-bridge.
#
# Per phase 25.1 SPEC §9 + Task 15 PLAN. Seven-listener topology (one
# listener per scenario (a)..(g)); each listener carries an
# `envoy.filters.http.wasm` HTTP filter that consumes
# `Wasm.config.vm_config.code.local.filename` pointing at a per-scenario
# `.wasm` source file under bytecode/. The shared upstream cluster
# `c_backend` proxies the SHARED echobackend helper.
#
# Scenario routing:
#   l_test_a -> bytecode/a_add_header.wasm
#   l_test_b -> bytecode/b_replace_header.wasm
#   l_test_c -> bytecode/c_remove_header.wasm
#   l_test_d -> bytecode/d_respond_shortcircuit.wasm
#   l_test_e -> bytecode/e_log_only.wasm
#   l_test_f -> bytecode/f_header_iter.wasm
#   l_test_g -> bytecode/g_property_method.wasm
#
# bytecode/ subdirectory bind-mount discipline (mirrors fixture-0026
# scripts/ mount + ADR-0010 host.docker.internal pattern): the driver
# implements fixture.ReferenceLogMounter to bind-mount each host-side
# .wasm file into the container at /bytecode/<scenario>.wasm.
#
# CAPABILITY RESTRICTION discipline (envoy-go cross-side symmetry):
# envoy-go is `StrictDefaultDeny` per AMEND-A5 — an empty
# `allowed_capabilities` map ⇒ DENY all hostcalls. Reference Envoy
# upstream uses the opposite semantic (empty map ⇒ ALLOW all); to keep
# the cross-side behavior identical we explicitly list the 24-hostcall
# superset on BOTH sides. Reference Envoy treats the populated list as
# a positive allow-list (only the listed hostcalls dispatch); envoy-go
# does the same per the per-cap gate at internal/wasm/registration.go.
#
# Runtime: reference Envoy v1.34.0 uses `envoy.wasm.runtime.v8` per
# the standard upstream default; envoy-go uses `envoy.wasm.runtime.
# wazero` per AMEND-A1. The .wasm blobs export `proxy_abi_version_
# 0_2_1` (proxy-wasm-rust-sdk 0.2.4) which both runtimes accept.
admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: {{.AdminPort}} }

static_resources:
  listeners:
    # === l_test_a (scenario a) - add fixed header ===
    - name: l_test_a
      address: { socket_address: { address: 0.0.0.0, port_value: {{.LATestPort}} } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP1
                stat_prefix: hcm_a
                route_config:
                  name: rc_a
                  virtual_hosts:
                    - name: vh_a
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: c_backend }
                http_filters:
                  - name: envoy.filters.http.wasm
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.wasm.v3.Wasm
                      config:
                        name: plugin_a
                        root_id: scenario_a
                        vm_config:
                          vm_id: vm_a
                          runtime: envoy.wasm.runtime.v8
                          code:
                            local:
                              filename: "{{.WasmA}}"
                        capability_restriction_config:
                          allowed_capabilities:
                            proxy_log: {}
                            proxy_get_log_level: {}
                            proxy_get_header_map_pairs: {}
                            proxy_get_header_map_value: {}
                            proxy_get_header_map_size: {}
                            proxy_set_header_map_pairs: {}
                            proxy_add_header_map_value: {}
                            proxy_replace_header_map_value: {}
