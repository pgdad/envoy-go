# Phase 69 fixture 0113-stats-sink-otlp-knobs expectations (ADR-0019 — prose; the
# driver is the enforcer via AssertStats; this file is documentation). ADR-0291.
#
# Proposition: the open_telemetry OTLP metrics stats sink KNOB arm — the three knobs
# turned ON together in ONE coherent config —
#   report_counters_as_deltas: true   ⇒ DELTA temporality; per-flush counter DELTAS
#                                       whose running sum stabilizes at K across
#                                       flushes (NOT the cumulative absolute value);
#                                       isMonotonic RETAINED (true).
#   prefix: envoytest                  ⇒ every metric name composed <prefix>.<base>
#                                       (a single dot is inserted).
#   use_tag_extracted_name: false      ⇒ names are the FULL DOTTED stat names
#                                       (cluster.<name>.<stat>, http.<prefix>.<stat>),
#                                       NOT the tag-extracted residual.
#   emit_tags_as_attributes: false     ⇒ NO envoy.<tag> attributes on any datapoint.
# The two *BoolValue knobs are written as BARE SCALARS (`false`, NOT `{value:false}`
# — reference_protojson_wrapper_scalar_not_object).
#
# The stability barrier proves DELTA, not absolute: after the running DeltaSum reaches
# K, >=2 further idle flushes leave it at K; an absolute emitter would overshoot.
#
# The mixed combos (deltas + attributes-ON compose; one-true-one-false naming) are
# Submit-level unit tests in the T2 matrix (otlp_test.go) — NOT a fixture. This ONE
# fixture proves all three knobs together (deltas + prefix + both-false).
#
# Topology (single-listener plaintext H1; HTTPFixedBody backend; two driver-owned
# in-process OTLP MetricsService gRPC receivers) — the 0112 chassis + the four knobs:
#   l_test (hcm_local)  — one downstream HTTP/1.1 listener; route prefix "/" →
#                         cluster c_backend (HTTPFixedBody, 17-byte body).
#   c_backend           — HTTPFixedBody subprocess.
#   c_otlp              — driver-owned in-process OTLP receiver
#                         (test/helpers/otlpmetrics). The driver starts TWO private
#                         receivers — one per side — on two separately-allocated
#                         ports, each bound 0.0.0.0:<port> so the reference container
#                         (host.docker.internal, STRICT_DNS + V4_ONLY per P-16) and
#                         the subject (127.0.0.1) each reach its own. The cluster
#                         carries the mandatory http2_protocol_options:{} for gRPC
#                         framing + plaintext h2c (no TLS).
#
# A bootstrap-level stats_sinks[] open_telemetry entry on BOTH sides names c_otlp + a
# SHORT stats_flush_interval (0.1s) with the four knob fields. Each flush the proxy
# maps its stats registry to ONE unary OTLP ExportMetricsServiceRequest; counters are
# rewritten to per-flush deltas before mapping.
#
# Reference Envoy contrib-v1.37.2 (STRICT_DNS via host.docker.internal) vs envoy-go
# (STATIC, in-process). Port 10449.
#
# ## Workload
#
# Each side fires K = 7 deterministic GET /probe requests (Host: otlp.example, UA:
# otlp-probe/1; all 2xx). The driver POLLS that side's private receiver until the
# full-dotted COUNTER subset's running DeltaSum converges to == 7 == K AND at least
# one Export has arrived (served-this-arm; a zero-Export pass is a false green), then
# waits for >=2 further Exports (the stability barrier) and re-reads DeltaSum. Two
# private receivers give per-side separation
# (reference_periodic_sink_differential_two_receivers). After the subject snapshot
# BOTH receivers are hard-stopped via Close().
#
# ## Why the full-dotted names are UNIQUE (name-keyed DeltaSum is unambiguous)
#
# With use_tag_extracted_name:false the sink emits the FULL DOTTED name, so the
# application-backend counter is envoytest.cluster.c_backend.upstream_rq_total —
# DISTINCT from the OTLP sink cluster's envoytest.cluster.c_otlp.upstream_rq_total and
# from the admin HCM's envoytest.http.admin.downstream_rq_total. Unlike 0112 (where
# tag extraction collapsed every stat to a colliding RESIDUAL and forced attribute-
# qualified selection), here the name alone selects the intended counter, so the
# receiver's NAME-keyed DeltaSum(name) running-sum accessor is unambiguous. The
# prefixed spellings were confirmed EMPIRICALLY (FIXTURE_0113_DUMP=1) on both sides.
#
# ## Asserted (both sides — NAMED SUBSETS only, reference_stats_sink_emits_used_only)
#
#   Full-dotted COUNTER subset — running DeltaSum == 7 at convergence AND STILL == 7
#   after >=2 further flushes (the stability barrier), each a DELTA monotonic Sum with
#   NO attributes:
#     envoytest.cluster.c_backend.upstream_rq_total
#     envoytest.http.hcm_local.downstream_rq_total
#     envoytest.http.hcm_local.downstream_rq_2xx
#   Gauge stays ABSOLUTE (emitted as a Gauge, NOT a delta Sum — the knob applies to
#   counters only; VALUE unasserted):
#     envoytest.cluster.c_backend.membership_total
#   Resource attributes: the three telemetry.sdk.* KEYS present
#     (telemetry.sdk.name / .language / .version — per-side VALUES unasserted).
#
# ## UNasserted (vary side-to-side / impl-specific / non-deterministic)
#
#   The WHOLE family set / count (surfaces differ — envoy-go has no histograms).
#   The reference's StartTimeUnixNano shape (its µs factor-1000 bug — never
#       cross-side StartTime equality).
#   The c_otlp sink cluster's own counters + upstream_cx_* (dial-unaccounted + the
#       feedback loop, reference_cluster_sink_dial_unaccounted).
#   Gauge VALUES (non-deterministic; membership shape differs STATIC vs STRICT_DNS).
#   OTLP message framing + per-Export metric count + flush cadence
#       (reference_streaming_sink_differential_framing).
#
