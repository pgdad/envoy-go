# Reference Envoy bootstrap for fixture 0113-stats-sink-otlp-knobs (phase 69, ADR-0291).
#
# The KNOB arm of the OpenTelemetry (OTLP) metrics stats sink
# (envoy.stat_sinks.open_telemetry): the three knobs turned ON together —
#   report_counters_as_deltas: true  ⇒ DELTA temporality; per-flush counter deltas
#                                      that SUM to K across flushes; isMonotonic RETAINED.
#   prefix: <p>                       ⇒ every metric name composed <p>.<base>.
#   use_tag_extracted_name: false     ⇒ FULL DOTTED metric names (not the residual).
#   emit_tags_as_attributes: false    ⇒ NO envoy.<tag> attributes.
# The two *BoolValue knobs are written as BARE SCALARS (`false`, NOT `{value:false}`
# — reference_protojson_wrapper_scalar_not_object).
#
# Single-listener plaintext H1 topology (same chassis as 0112). One downstream
# HTTP/1.1 listener routes every request to the HTTPFixedBody backend (cluster
# {{.BackendName}}). A bootstrap-level stats_sinks[] open_telemetry entry names the
# c_otlp cluster — a driver-owned in-process OTLP MetricsService gRPC receiver
# (test/helpers/otlpmetrics) — and a SHORT stats_flush_interval (0.1s) drives fast
# deterministic convergence. Every flush the reference maps its stats registry to ONE
# unary OTLP ExportMetricsServiceRequest and sends it.
#
# Templating (rendered by the driver's mustRender() at ReferenceBootstrap time):
#   {{.AdminPort}}    — admin endpoint port (hard-coded 9901 by driver).
#   {{.ListenerPort}} — l_test in-container port (10449 per fixture convention).
#   {{.BackendHost}}  — HTTPFixedBody backend host (host.docker.internal per ADR-0010).
#   {{.BackendPort}}  — HTTPFixedBody backend port (runner-allocated).
#   {{.BackendName}}  — backend cluster name (FIXED identical both sides → the
#                       full-dotted cluster.<name>.upstream_rq_total).
#   {{.StatPrefix}}   — HCM stat_prefix (FIXED identical both sides → the full-dotted
#                       http.<stat_prefix>.downstream_rq_* names).
#   {{.MetricPrefix}} — the sink `prefix` knob (FIXED identical both sides).
#   {{.OTLPHost}}     — driver-owned OTLP receiver host (host.docker.internal).
#   {{.OTLPPort}}     — driver-owned OTLP receiver port (driver-allocated; the
#                       in-process otlpmetrics.Server binds 0.0.0.0:<port> first).
#
# Cluster type: STRICT_DNS so the reference Envoy container resolves
# host.docker.internal (the Docker bridge host alias per ADR-0010).
# dns_lookup_family: V4_ONLY per P-16 (the Docker Desktop AAAA gotcha,
# reference_host_gateway_ip_docker_desktop).

admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: {{.AdminPort}} }

# Bootstrap-level stats sink: the open_telemetry OTLP metrics gRPC sink with the FOUR
# knob fields (the KNOB arm: deltas + prefix + both bool knobs false). grpc_service.
# envoy_grpc names the c_otlp cluster (h2c). A SHORT stats_flush_interval (0.1s)
# drives fast deterministic convergence.
stats_sinks:
  - name: envoy.stat_sinks.open_telemetry
    typed_config:
      "@type": type.googleapis.com/envoy.extensions.stat_sinks.open_telemetry.v3.SinkConfig
      grpc_service:
        envoy_grpc:
          cluster_name: c_otlp
      report_counters_as_deltas: true
      prefix: {{.MetricPrefix}}
      use_tag_extracted_name: false
      emit_tags_as_attributes: false
stats_flush_interval: 0.1s

static_resources:
  listeners:
    - name: l_test
      address: { socket_address: { address: 0.0.0.0, port_value: {{.ListenerPort}} } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP1
                stat_prefix: {{.StatPrefix}}
                route_config:
                  name: rc_test
                  virtual_hosts:
                    - name: vh_test
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: {{.BackendName}} }
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    # backend: HTTPFixedBody subprocess (17-byte fixed body) reached via
    # host.docker.internal from the reference Envoy container per ADR-0010.
    - name: {{.BackendName}}
      type: STRICT_DNS
      connect_timeout: 1s
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: {{.BackendName}}
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: {{.BackendHost}}, port_value: {{.BackendPort}} }
    # c_otlp: driver-owned in-process OTLP MetricsService gRPC receiver.
    # MANDATORY http2_protocol_options: {} for gRPC framing. Plaintext h2c — no TLS.
    # STRICT_DNS + V4_ONLY so the container resolves the bridge hostname over IPv4.
    - name: c_otlp
      type: STRICT_DNS
      connect_timeout: 1s
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: c_otlp
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: {{.OTLPHost}}, port_value: {{.OTLPPort}} }
