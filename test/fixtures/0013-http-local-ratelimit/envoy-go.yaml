# envoy-go bootstrap for fixture 0013-http-local-ratelimit.
# Identical to envoy.yaml modulo:
#   - cluster type: STATIC (envoy-go convention) vs STRICT_DNS (reference Envoy)
#   - backend address: 127.0.0.1 (envoy-go is in-process) vs host.docker.internal
#   - admin/listener ports independently allocated by the runner per proxy
#
# filter_enabled + filter_enforced fields are PRESENT in this file (envoy-go
# silent-ignores them per SPEC §2.1 cluster 2; field presence ensures
# byte-equivalent config-load behavior across reference + subject).
#
# IMPL-1 (per docs/envoy-go/phases/11-http-filter-local-ratelimit/PROGRESS.md):
# the per-route TPFC entry uses `@type: ...LocalRateLimit` (the SAME proto as
# the listener-level config; upstream Envoy v1.37.2 has NO separate
# `LocalRateLimitPerRoute` message). The fields go directly under the message
# (no `rate_limit:` wrapper).
admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: {{.AdminPort}} }

static_resources:
  listeners:
    - name: l_s1
      address: { socket_address: { address: 0.0.0.0, port_value: {{.LS1Port}} } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP1
                stat_prefix: ingress_s1
                route_config:
                  name: rc_s1
                  virtual_hosts:
                    - name: vh_s1
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: c_backend }
                http_filters:
                  - name: envoy.filters.http.local_ratelimit
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
                      stat_prefix: foo
                      token_bucket: { max_tokens: 10, tokens_per_fill: 10, fill_interval: 1s }
                      filter_enabled: { runtime_key: __s1_enabled,  default_value: { numerator: 100, denominator: HUNDRED } }
                      filter_enforced: { runtime_key: __s1_enforced, default_value: { numerator: 100, denominator: HUNDRED } }
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

    - name: l_s2
      address: { socket_address: { address: 0.0.0.0, port_value: {{.LS2Port}} } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP1
                stat_prefix: ingress_s2
                route_config:
                  name: rc_s2
                  virtual_hosts:
                    - name: vh_s2
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: c_backend }
                http_filters:
                  - name: envoy.filters.http.local_ratelimit
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
                      stat_prefix: bar
                      token_bucket: { max_tokens: 2, tokens_per_fill: 2, fill_interval: 60s }
                      filter_enabled: { runtime_key: __s2_enabled,  default_value: { numerator: 100, denominator: HUNDRED } }
                      filter_enforced: { runtime_key: __s2_enforced, default_value: { numerator: 100, denominator: HUNDRED } }
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

    - name: l_s3
      address: { socket_address: { address: 0.0.0.0, port_value: {{.LS3Port}} } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP1
                stat_prefix: ingress_s3
                route_config:
                  name: rc_s3
                  virtual_hosts:
                    - name: vh_s3
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: c_backend }
                http_filters:
                  - name: envoy.filters.http.local_ratelimit
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
                      stat_prefix: baz
                      token_bucket: { max_tokens: 1, tokens_per_fill: 1, fill_interval: 0.2s }
                      filter_enabled: { runtime_key: __s3_enabled,  default_value: { numerator: 100, denominator: HUNDRED } }
                      filter_enforced: { runtime_key: __s3_enforced, default_value: { numerator: 100, denominator: HUNDRED } }
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

    - name: l_per_route
      address: { socket_address: { address: 0.0.0.0, port_value: {{.LPerRoutePort}} } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP1
                stat_prefix: ingress_per_route
                route_config:
                  name: rc_per_route
                  virtual_hosts:
                    - name: vh_per_route
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/strict" }
                          route: { cluster: c_backend }
                          typed_per_filter_config:
                            envoy.filters.http.local_ratelimit:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
                              stat_prefix: strict
                              token_bucket: { max_tokens: 1, tokens_per_fill: 1, fill_interval: 60s }
                              filter_enabled: { runtime_key: __strict_enabled,  default_value: { numerator: 100, denominator: HUNDRED } }
                              filter_enforced: { runtime_key: __strict_enforced, default_value: { numerator: 100, denominator: HUNDRED } }
                        - match: { prefix: "/loose" }
                          route: { cluster: c_backend }
                http_filters:
                  - name: envoy.filters.http.local_ratelimit
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
                      stat_prefix: qux
                      token_bucket: { max_tokens: 10, tokens_per_fill: 10, fill_interval: 1s }
                      filter_enabled: { runtime_key: __qux_enabled,  default_value: { numerator: 100, denominator: HUNDRED } }
                      filter_enforced: { runtime_key: __qux_enforced, default_value: { numerator: 100, denominator: HUNDRED } }
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: c_backend
      type: STATIC
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: c_backend
        endpoints:
          - lb_endpoints:
              - endpoint: { address: { socket_address: { address: 127.0.0.1, port_value: {{.BackendPort}} } } }
