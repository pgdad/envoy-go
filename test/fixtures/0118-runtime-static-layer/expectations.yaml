# `layered_runtime.layers[].layer_specifier` is a four-arm oneof. On the pinned
# reference image, disk_layer, admin_layer and rtds_layer ALL unmarshal AND BOOT
# CLEANLY. envoy-go accepts `static_layer` ONLY and rejects the other three with
# byte-stable "bootstrap: ..." messages.
#
#   arm            reference        envoy-go
#   static_layer   boots            ACCEPTED   <- the only arm this fixture uses
#   disk_layer     BOOTS CLEANLY    rejected
#   admin_layer    BOOTS CLEANLY    rejected
#   rtds_layer     BOOTS CLEANLY    rejected
#
# ⚠️ These are DEPARTURES, NOT PARITY. The earlier reject roster's founding
# premise — that the reference also refused these arms — was REFUTED by probe.
# They are rejected as a deliberate scope decision (row 77 ships no disk, admin
# or RTDS runtime layer). The roster also rejects an empty `layers` list, an
# empty layer `name`, a duplicate layer name, an unset `layer_specifier`, and
# list- or null-valued static-layer leaves. This fixture exercises ONLY the
# accepted arm; the nine reject arms are pinned at the unit level in
# internal/bootstrap.
#
# ============================================================================
# ⚠️ STATS ONLY — the /runtime admin BODY is not comparable
# ============================================================================
#
# ProbeAdmin returns /ready ONLY. The runner's compareAdminResponses compares
# the body BYTE-EXACT, and the reference's /runtime body fails that in four
# independent ways, all measured on the pinned image:
#   1. the JSON key order is randomized PER REQUEST;
#   2. the Struct debug-string marker is randomized PER PROCESS — 8 distinct
#      strings across 13 fresh processes;
#   3. an empty-map value renders as a leaked, non-deterministic DebugString and
#      STILL counts as a key;
#   4. the WITHIN-LAYER collision winner is non-deterministic (~40/60 over 18
#      fresh processes), so any fixture asserting a final_value is unrunnable.
# All four contaminate the BODY only; the two gauges are immune.
#
# ============================================================================
# ⚠️ NO PRECONDITION IS AVAILABLE FROM THE OTHER runtime.* NAMES
# ============================================================================
#
# runtime.load_success and runtime.override_dir_not_exists BOTH read 1 on the
# reference even with NO `layered_runtime` block at all, so NEITHER is a "a
# static layer actually loaded" guard. A diff of the no-block baseline against
# the combined config over the whole envoy_runtime_* block shows ONLY the two
# gauge lines differ. The driver's honest substitute is the SEPARATE ABSENT
# CHECK — which `continue`s, so a gauge that failed to REGISTER cannot pass
# vacuously as 0 == 0 through a single-value lookup — plus num_layers == 2.
#
# ============================================================================
# ⚠️ envoy-go PUBLISHES 2 runtime.* NAMES; THE REFERENCE PUBLISHES 9
# ============================================================================
#
# Measured on the pinned image: admin_overrides_active,
# deprecated_feature_seen_since_process_start, deprecated_feature_use,
# load_error, load_success, num_keys, num_layers, override_dir_exists,
# override_dir_not_exists. envoy-go publishes num_keys and num_layers only.
#
# The project asserts NAMED SUBSETS cross-side, never full-set equality
# (reference_stats_sink_emits_used_only), so the asymmetry creates no divergence
