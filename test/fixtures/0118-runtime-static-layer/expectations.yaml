# ============================================================================
# ⚠️ STATS ONLY — the /runtime admin BODY is not comparable
# ============================================================================
#
# ProbeAdmin returns /ready ONLY. The runner's compareAdminResponses compares
# the body BYTE-EXACT, and the reference's /runtime body fails that in four
# independent ways, all measured on the pinned image:
#   1. the JSON key order is randomized PER REQUEST;
#   2. the Struct debug-string marker is randomized PER PROCESS — 8 distinct
#      strings across 13 fresh processes;
#   3. an empty-map value renders as a leaked, non-deterministic DebugString and
#      STILL counts as a key;
#   4. the WITHIN-LAYER collision winner is non-deterministic (~40/60 over 18
#      fresh processes), so any fixture asserting a final_value is unrunnable.
# All four contaminate the BODY only; the two gauges are immune.
#
# ============================================================================
# ⚠️ NO PRECONDITION IS AVAILABLE FROM THE OTHER runtime.* NAMES
# ============================================================================
#
# runtime.load_success and runtime.override_dir_not_exists BOTH read 1 on the
# reference even with NO `layered_runtime` block at all, so NEITHER is a "a
# static layer actually loaded" guard. A diff of the no-block baseline against
