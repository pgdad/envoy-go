# Phase 44.3 fixture 0083-grpc-access-log-headers expectations (ADR-0019 — prose;
# the driver is the enforcer; this file is documentation).
#
# Same single-listener plaintext-H1 topology as 0081 (driver-owned in-process
# AccessLogService gRPC receiver) PLUS the 44.3 header-capture lists on the OUTER
# HttpGrpcAccessLogConfig message:
#   l_test (hcm_local) — one downstream HTTP/1.1 listener; route prefix "/" →
#                        cluster c_backend (HTTPFixedBody, 17-byte body). HCM
#                        carries one access_log[] HttpGrpcAccessLogConfig entry
#                        (log_name "0083"; grpc_service.envoy_grpc.cluster_name
#                        c_als) with
#                          additional_request_headers_to_log:
#                            ["x-req-foo", "x-req-missing", "x-req-multi"]
#                          additional_response_headers_to_log: ["content-type"]
#                        streaming one HTTPAccessLogEntry per completed request.
#   c_backend          — HTTPFixedBody subprocess (test/fixtures/0006-access-log/
#                        backends/; "backend:v1/fixed\n" = 17 bytes; emits
#                        Content-Type: text/plain).
#   c_als              — driver-owned in-process AccessLogService receiver
#                        (test/helpers/accessloggrpc/) bound 0.0.0.0:<port> so the
#                        reference container (host.docker.internal) AND the subject
#                        (127.0.0.1) both reach it; http2_protocol_options:{} +
#                        plaintext h2c (D-ALS-RECEIVER — no TLS).
#
# Reference Envoy v1.37.2 (STRICT_DNS via host.docker.internal) vs envoy-go
# (STATIC, in-process).
#
# ## Workload
#
# Each side fires N=8 IDENTICAL query-less requests:
#   GET /health, Host: als.example, User-Agent: als-probe/1,
#   X-Req-Foo: bar, X-Req-Multi: m1, X-Req-Multi: m2 (two values).
# X-Req-Missing is configured-but-NEVER-set — the absent-OMIT proof. Each request
# routes to c_backend (200 + 17-byte fixed body + Content-Type: text/plain) and
# produces exactly one streamed HTTPAccessLogEntry. The driver POLLS the
# receiver's Count() to >= 8 (poll-to-converge; the reference buffers ALS entries
# and flushes on a ~1s timer — never a fixed sleep). Per-side separation: the
# receiver is Reset() at the start of each side's drive.
#
# ## Data-plane output (cross-side byte-equal)
#
# Each side returns N x "status=200\n" — the runner's CompareBytes pass asserts
# the data plane behaved equivalently cross-side (mirrors 0081).
#
# ## Query-less path (AMEND-ALS-2)
#
# The request path MUST be query-less. envoy-go's Record.Path is path-only; the
# reference's request.path additionally carries the query string. /health (no
# query) keeps request.path EXACT on both sides.
#
# ## Framing NOT asserted (AMEND-ALS-3)
#
# The cross-side assertion is on the per-entry PAYLOAD aggregated across all
# received entries — NOT stream count, per-message batching, or flush cadence,
# which legitimately vary side-to-side. The receiver accumulates log_entry[]
# across ALL messages and streams; the driver asserts every accumulated entry.
#
# ## Asserted subset (cross-side EXACT, every entry, both sides)
#
# The 0081 7-field subset, kept verbatim:
#   request.request_method      == GET     (corev3.RequestMethod_GET)
#   request.path                == "/health"
#   request.authority           == "als.example"
#   request.user_agent          == "als-probe/1"
#   response.response_code      == 200     (wrapperspb.UInt32Value)
#   response.response_body_bytes == 17      (HTTPFixedBody fixed-body length)
#   protocol_version            == HTTP11  (HTTPAccessLogEntry_HTTP11)
#
# PLUS the 44.3 captured header maps (the feature under proof):
#   request.request_headers   == {"x-req-foo": "bar", "x-req-multi": "m1,m2"}
#       — lowercase key (AMEND-HDR-1); x-req-multi is the comma-joined two-value
#         capture (AMEND-HDR-3); the configured x-req-missing key is ABSENT (the
#         configured-but-unset OMIT proof, asserted explicitly).
#   response.response_headers == {"content-type": "text/plain"}
#       — the backend-origin Content-Type, surfaced verbatim downstream
#         (AMEND-HDR-4: backend-origin response headers only — server/date/
#         x-envoy-* are avoided as they vary cross-side).
#
# PLUS the subject-side flat /stats counter:
#   access_logs.grpc_access_log.logs_written == 8   (every send succeeded)
#
# ## UNasserted (deferred / non-deterministic / subject-absent)
#
#   common_properties.start_time / duration / upstream_remote_address
#       — non-deterministic (populated but not asserted; AMEND-ALS-4).
#   identifier.node             — minimal node (Id+Cluster), D-ALS-NODE; UNasserted.
#   stream / message / batch framing — AMEND-ALS-3.
#   request.scheme, request_id, upstream_cluster, access_log_type,
#   response_code_details, wire-byte counts — subject-absent reference fields.
#
# Cross-refs: phase 44.1 SPEC §12 + phase 44.3 PLAN (D-HDR-*) + AMEND-HDR-1/2/3/4
#             + D-ALS-RECEIVER + AMEND-ALS-2/3/4 + D-ALS-NODE +
#             reference_streaming_sink_differential_framing +
#             reference_differential_grpc_receiver_driver_owned.
