# Reference Envoy bootstrap for fixture 0092-stats-sink-statsd.
#
# Single-listener plaintext H1 topology (phase 48 — the statsd UDP line-protocol
# stats sink). One downstream HTTP/1.1 listener routes every request to the
# HTTPFixedBody backend (cluster {{.BackendName}}). A bootstrap-level
# stats_sinks[] statsd entry (StatsdSink TypeURL, UDP address, prefix) points at
# the driver-owned in-process statsdrecv UDP receiver, and a SHORT
# stats_flush_interval (500ms) drives fast deterministic convergence. Each flush
# the reference Envoy sends one UDP datagram per metric line
# (<prefix>.<name>:<delta>|c for counters; <prefix>.<name>:<abs>|g for gauges).
#
# The statsd address is a LITERAL IP (HostGatewayIP — the Docker bridge gateway)
# because the statsd UDP sink does NOT perform DNS resolution (AMEND-SD-REJECT;
# reference_docker_probe_bridge_network). The receiver is bound on 0.0.0.0:<port>
# so the reference container can send datagrams to the host.
#
# NO node field is needed — statsd carries no proxy identifier.
#
# Templating: rendered by the driver's mustRender() at ReferenceBootstrap time.
# Substitution keys:
#   {{.AdminPort}}    — admin endpoint port (hard-coded 9901 by driver).
#   {{.ListenerPort}} — l_test in-container port (10092 per fixture convention).
#   {{.BackendHost}}  — HTTPFixedBody backend host (host.docker.internal per ADR-0010).
#   {{.BackendPort}}  — HTTPFixedBody backend port (runner-allocated).
#   {{.BackendName}}  — backend cluster name (FIXED identical both sides →
#                       cluster.<backend>.upstream_rq_total dotted stat name).
#   {{.StatPrefix}}   — HCM stat_prefix (FIXED identical both sides →
#                       http.<stat_prefix>.downstream_rq_* dotted stat names).
#   {{.StatsdHost}}   — driver-owned statsdrecv receiver host
#                       (HostGatewayIP literal IP for the reference container).
#   {{.StatsdPort}}   — driver-owned statsdrecv receiver port (driver-allocated;
#                       the in-process statsdrecv.Server binds 0.0.0.0:<port>
#                       before the container starts).
#   {{.Prefix}}       — statsd metric prefix (baked identically on both sides;
#                       all metric names are <prefix>.<name>).
#
# Cluster type: STRICT_DNS so the reference Envoy container resolves
# host.docker.internal (the Docker bridge host alias per ADR-0010).
# dns_lookup_family: V4_ONLY per the established fixture precedent.

admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: {{.AdminPort}} }

# Bootstrap-level stats sink: the statsd UDP sink. address.socket_address
# carries the LITERAL IP (HostGatewayIP) + UDP port of the driver-owned
# in-process statsdrecv receiver. A SHORT stats_flush_interval (500ms) drives
# fast deterministic convergence (vs the 5s default). Under the statsd model
# each COUNTER flush line carries the per-flush DELTA; gauges carry the absolute
# value. prefix is baked identically on both sides so metric names match
# cross-side.
stats_sinks:
  - name: envoy.stat_sinks.statsd
    typed_config:
      "@type": type.googleapis.com/envoy.config.metrics.v3.StatsdSink
      address:
        socket_address: { protocol: UDP, address: {{.StatsdHost}}, port_value: {{.StatsdPort}} }
      prefix: {{.Prefix}}
stats_flush_interval: 0.5s

static_resources:
  listeners:
    - name: l_test
      address: { socket_address: { address: 0.0.0.0, port_value: {{.ListenerPort}} } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP1
                stat_prefix: {{.StatPrefix}}
                route_config:
                  name: rc_test
                  virtual_hosts:
                    - name: vh_test
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: {{.BackendName}} }
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    # backend: HTTPFixedBody subprocess (17-byte fixed body) reached via
    # host.docker.internal from the reference Envoy container per ADR-0010.
    - name: {{.BackendName}}
      type: STRICT_DNS
      connect_timeout: 1s
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: {{.BackendName}}
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: {{.BackendHost}}, port_value: {{.BackendPort}} }
