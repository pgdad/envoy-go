# envoy-go subject bootstrap for fixture 0029-http-lua-source-codes-boot-reject.
#
# NOTE: This template is a documentation/symmetry artifact. The actual
# boot-reject bootstrap is rendered SELF-CONTAINED by the driver's
# ReferenceBootstrap() (see inputs/driver.go renderBootRejectBootstrap) with
# the broken Lua source embedded via the source_codes{bad} inline_string arm
# — runBootRejectFixture calls tryStartReferenceProxy directly, which does NOT
# consult ReferenceLogMounter, so a Filename/host-mount bootstrap would fail
# with "Invalid path" before the lua filter ever PARSE-REJECTed (same harness
# gap fixture-0026 sidesteps with inline_string).
#
# The shape below mirrors what the driver renders: a single listener whose
# Lua filter has a VALID no-op default_source_code + a source_codes{bad}
# entry carrying a COMPILE-ERROR script. Both reference Envoy v1.37.2 (eager
# per-entry compile in the FilterConfig ctor) and envoy-go (Task 1 consume
# path CompileScript per entry) fail-closed at config-load → both boot-reject.
admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: {{.AdminPort}} }

static_resources:
  listeners:
    - name: l_test_a
      address: { socket_address: { address: 0.0.0.0, port_value: {{.LATestPort}} } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP1
                stat_prefix: hcm_bootreject
                route_config:
                  name: rc_bootreject
                  virtual_hosts:
                    - name: vh_bootreject
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: c_unused }
                http_filters:
                  - name: envoy.filters.http.lua
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                      stat_prefix: scenario_g
                      default_source_code:
                        inline_string: "function envoy_on_request(handle) end"
                      source_codes:
                        bad:
                          inline_string: "function envoy_on_request(handle) end this-is-not-valid-lua-syntax"
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: c_unused
      type: STATIC
      connect_timeout: 0.25s
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: c_unused
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: 127.0.0.1, port_value: 1 }
