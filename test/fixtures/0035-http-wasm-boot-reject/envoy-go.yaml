# envoy-go bootstrap for fixture 0035-http-wasm-boot-reject.
#
# Per phase 25.1 SPEC §9.2 + §12 D-P6 + PLAN Task 16.
# This file is a DOCUMENTATION ARTIFACT — the actual boot-reject bootstrap
# is synthesized inline in renderBootRejectBootstrap() (driver.go) per
# Option B2 (fixture-0029 / 0031 / 0033 precedent).
#
# The boot-reject trigger: `vm_config.code.local` present + `specifier`
# oneof unset (§9.2 arm 8):
#   envoy-go: "wasm: config.vm_config.code.local: specifier oneof required"
#     (parseRejectDataSourceSpecifierRequired per §9.2 row 8)
#
# Runtime: envoy.wasm.runtime.wazero per AMEND-A1 (envoy-go uses wazero
# exclusively); the runtime discriminator is parsed but the
# specifier-oneof PARSE-REJECT fires inside compiled_config.go's
# AsyncDataSource validation step BEFORE the runtime-specific module-
# load step (arm 8 ordering per buildCompiledConfig walk).
#
# NOTE: The driver's renderBootRejectBootstrap() is the authoritative
# source. This file documents the intended shape for operator reference.
admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: 9902 }

static_resources:
  listeners:
    - name: l_test_a
      address: { socket_address: { address: 0.0.0.0, port_value: 10136 } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP1
                stat_prefix: hcm_bootreject
                route_config:
                  name: rc_bootreject
                  virtual_hosts:
                    - name: vh_bootreject
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: c_unused }
                http_filters:
                  - name: envoy.filters.http.wasm
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.wasm.v3.Wasm
                      config:
                        name: plugin_bootreject
                        root_id: rootid_bootreject
                        vm_config:
                          vm_id: vm_bootreject
                          runtime: envoy.wasm.runtime.wazero
                          code:
                            local: {}  # specifier oneof intentionally OMITTED —
                                       # triggers §9.2 arm 8 PARSE-REJECT.
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: c_unused
      type: STATIC
      connect_timeout: 0.25s
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: c_unused
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: 127.0.0.1, port_value: 1 }
