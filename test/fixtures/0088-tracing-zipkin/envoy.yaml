# Reference Envoy bootstrap for fixture 0088-tracing-zipkin.
#
# Single-listener plaintext H1 topology (phase 46.2 SPEC — the Zipkin v2-JSON
# span export + B3 propagation differential). One downstream HTTP/1.1 listener
# routes every request to the HTTPFixedBody backend (cluster c_backend). The HCM
# carries a `tracing` block (Zipkin provider, random_sampling 100%,
# trace_id_128bit:true, shared_span_context:false, collector_endpoint
# /api/v2/spans, collector_endpoint_version HTTP_JSON) naming the
# c_zipkin_collector cluster, which points at the driver-owned in-process HTTP
# Zipkin collector receiver. The reference Envoy POSTs one Zipkin v2 JSON span
# per completed request as a JSON array.
#
# Templating: rendered by the driver's mustRender() at ReferenceBootstrap time.
# Substitution keys:
#   {{.AdminPort}}     — admin endpoint port (hard-coded 9901 by driver).
#   {{.ListenerPort}}  — l_test in-container port (10088 per fixture convention).
#   {{.BackendHost}}   — HTTPFixedBody backend host (host.docker.internal per ADR-0010).
#   {{.BackendPort}}   — HTTPFixedBody backend port (runner-allocated).
#   {{.ZipkinHost}}    — driver-owned Zipkin collector host (host.docker.internal for ref).
#   {{.ZipkinPort}}    — driver-owned Zipkin collector port (driver-allocated; the
#                        in-process collector binds 0.0.0.0:<port> before the
#                        container starts).
#
# Cluster type: STRICT_DNS so the reference Envoy container resolves
# host.docker.internal (the Docker bridge host alias per ADR-0010).
# dns_lookup_family: V4_ONLY per the established fixture precedent. The collector
# cluster is PLAINTEXT HTTP/1 — NO http2_protocol_options (Zipkin v2 JSON POSTs
# over HTTP/1.1, unlike the OTLP gRPC h2c collector in fixture 0087).
admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: {{.AdminPort}} }

static_resources:
  listeners:
    - name: l_test
      address: { socket_address: { address: 0.0.0.0, port_value: {{.ListenerPort}} } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP1
                stat_prefix: hcm_local
                tracing:
                  provider:
                    name: envoy.tracers.zipkin
                    typed_config:
                      "@type": type.googleapis.com/envoy.config.trace.v3.ZipkinConfig
                      collector_cluster: c_zipkin_collector
                      collector_endpoint: /api/v2/spans
                      collector_endpoint_version: HTTP_JSON
                      trace_id_128bit: true
                      shared_span_context: false
                  random_sampling:
                    value: 100
                route_config:
                  name: rc_test
                  virtual_hosts:
                    - name: vh_test
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: c_backend }
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    # c_backend: HTTPFixedBody subprocess (17-byte fixed body) reached via
    # host.docker.internal from the reference Envoy container per ADR-0010.
    - name: c_backend
      type: STRICT_DNS
      connect_timeout: 1s
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: c_backend
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: {{.BackendHost}}, port_value: {{.BackendPort}} }
    # c_zipkin_collector: driver-owned in-process HTTP Zipkin v2 collector. PLAINTEXT
    # HTTP/1 — NO http2_protocol_options (D-TRACE-ZIPKIN-TRANSPORT-WIRING). STRICT_DNS
    # so the container can resolve the bridge hostname.
    - name: c_zipkin_collector
      type: STRICT_DNS
      connect_timeout: 1s
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: c_zipkin_collector
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: {{.ZipkinHost}}, port_value: {{.ZipkinPort}} }
