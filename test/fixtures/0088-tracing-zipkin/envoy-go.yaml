# envoy-go bootstrap for fixture 0088-tracing-zipkin.
#
# Functionally equivalent to envoy.yaml modulo:
#   - cluster type: STATIC (envoy-go convention per ADR-0002) vs STRICT_DNS.
#   - cluster endpoint addresses: 127.0.0.1 (envoy-go runs on the host loopback)
#     vs host.docker.internal (reference Envoy runs in a Docker container).
#   - admin/listener ports independently allocated by the runner.
#
# Single-listener plaintext H1 topology: one downstream HTTP/1.1 listener routes
# every request to the HTTPFixedBody backend (cluster c_backend). The HCM carries
# a `tracing` block (Zipkin provider, random_sampling 100%, trace_id_128bit:true,
# shared_span_context:false, collector_endpoint /api/v2/spans,
# collector_endpoint_version HTTP_JSON) naming c_zipkin_collector, which points
# at the driver-owned in-process HTTP Zipkin collector on the host loopback.
# envoy-go POSTs one Zipkin v2 JSON span per completed request via the
# ZipkinExporter (phase 46.2).
#
# Templating: rendered by the driver's mustRender() at SubjectConfig time.
# Substitution keys:
#   {{.AdminPort}}    — admin endpoint port (runner-allocated).
#   {{.ListenerPort}} — l_test listener port (runner-allocated).
#   {{.BackendPort}}  — HTTPFixedBody backend port (runner-allocated, loopback).
#   {{.ZipkinPort}}   — driver-owned Zipkin collector port (driver-allocated;
#                       pre-bound on 0.0.0.0:<port> before the subject starts).
admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: {{.AdminPort}} }

static_resources:
  listeners:
    - name: l_test
      address: { socket_address: { address: 0.0.0.0, port_value: {{.ListenerPort}} } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP1
                stat_prefix: hcm_local
                tracing:
                  provider:
                    name: envoy.tracers.zipkin
                    typed_config:
                      "@type": type.googleapis.com/envoy.config.trace.v3.ZipkinConfig
                      collector_cluster: c_zipkin_collector
                      collector_endpoint: /api/v2/spans
                      collector_endpoint_version: HTTP_JSON
                      trace_id_128bit: true
                      shared_span_context: false
                  random_sampling:
                    value: 100
                route_config:
                  name: rc_test
                  virtual_hosts:
                    - name: vh_test
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: c_backend }
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    # c_backend: HTTPFixedBody subprocess (17-byte fixed body) on host loopback.
    - name: c_backend
      type: STATIC
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: c_backend
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: 127.0.0.1, port_value: {{.BackendPort}} }
    # c_zipkin_collector: driver-owned in-process HTTP Zipkin v2 collector on host
    # loopback. PLAINTEXT HTTP/1 — NO http2_protocol_options (Zipkin v2 JSON over
    # HTTP/1.1; D-TRACE-ZIPKIN-TRANSPORT-WIRING).
    - name: c_zipkin_collector
      type: STATIC
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: c_zipkin_collector
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: 127.0.0.1, port_value: {{.ZipkinPort}} }
