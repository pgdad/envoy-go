# Reference Envoy bootstrap for fixture 0120-tls-connection-error.
#
# Phase 94 — the listener-scope ssl.connection_error differential. ONE
# TLS-terminating tcp_proxy listener (l_conn_err) whose DownstreamTlsContext
# carries require_client_certificate: true, a STATIC inline server cert, an
# inline validation_context.trusted_ca, and — the FIRST in this tree — an
# explicit common_tls_context.tls_params block.
#
# THE PROPOSITION: connection-level TLS failures that never reach certificate
# verification (unsupported protocol version, plaintext bytes on a TLS port,
# outright garbage) increment listener.<addr>.ssl.connection_error, while
# truncated/aborted connections that produce no TLS error at all do NOT. The
# arms are driven CLIENT-side; this bootstrap only has to terminate TLS and
# expose the counter.
#
# ⚠️ tls_params carries tls_minimum_protocol_version: TLSv1_2 and NOTHING
# ELSE. The two pre-1.2 protocol-version enum values MUST NEVER appear in
# this file: envoy-go's
# internal/tls/params.go boot-REJECTS those two values ("%s is not supported
# in phase 03"), so a bad-version arm expressed in CONFIG would take the
# subject down at boot instead of producing a handshake failure. The
# bad-version arm is produced CLIENT-side only.
#
# ⚠️ CERT DELIVERY IS inline_string:, NEVER filename: (D-TLSCE-CERTDELIVERY).
# The pki/ directory exists on the HOST, where envoy-go runs — it does NOT
# exist inside this reference CONTAINER. The 0110 route (PEMs rendered into
# the template as pre-indented block scalars) is the only one that works
# without a ReferenceLogMounter bind-mount, and this fixture implements no
# mounter.
#
# Cluster type: STRICT_DNS + host.docker.internal per ADR-0010. Docker here is
# VM-backed — docker0 does not exist on the host — so a STATIC cluster keyed on
# the bridge gateway IP is SILENTLY UNREACHABLE (it boots clean and then never
# connects). The container is launched with
# --add-host=host.docker.internal:host-gateway.
#
# Templating: rendered by the driver's mustRender() at ReferenceBootstrap time.
# Substitution keys:
#   {{.AdminPort}}    — admin endpoint port (reference container; 9901).
#   {{.ListenerPort}} — l_conn_err in-container port (10126 per the "100NN"
#                        fixture convention; 10120 is already held by 0028).
#   {{.BackendPort}}  — TCP echo backend port (runner-allocated on the host,
#                        reached from the container via host.docker.internal).
#   .ServerCertIndented — pki/server.pem, pre-indented to 24 spaces.
#   .ServerKeyIndented  — pki/server.key.pem, pre-indented to 24 spaces.
#   .CACertIndented     — pki/ca.pem, pre-indented to 22 spaces.
#
# NOTE: the three PEM keys above are deliberately written WITHOUT their
# double-brace template-action delimiters. text/template expands actions inside
# YAML comments too, and a multi-line PEM expanded into a "#" comment line
# splatters its continuation lines outside the comment and produces invalid
# YAML.
admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: {{.AdminPort}} }

static_resources:
  listeners:
    - name: l_conn_err
      address:
        socket_address: { address: 0.0.0.0, port_value: {{.ListenerPort}} }
      filter_chains:
        - transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
              require_client_certificate: true
              common_tls_context:
                tls_params:
                  tls_minimum_protocol_version: TLSv1_2
                tls_certificates:
                  - certificate_chain:
                      inline_string: |
{{.ServerCertIndented}}
                    private_key:
                      inline_string: |
{{.ServerKeyIndented}}
                validation_context:
                  trusted_ca:
                    inline_string: |
{{.CACertIndented}}
          filters:
            - name: envoy.filters.network.tcp_proxy
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
                stat_prefix: ingress_0120
                cluster: c_echo

  clusters:
    # c_echo: TCP echo backend (BackendCount=1) on the HOST, reached across the
    # container boundary via the host.docker.internal alias.
    - name: c_echo
      type: STRICT_DNS
      dns_lookup_family: V4_ONLY
      connect_timeout: 1s
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: c_echo
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: host.docker.internal, port_value: {{.BackendPort}} }
