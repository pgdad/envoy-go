# envoy-go bootstrap for fixture 0023-http-ext-proc-body.
#
# Functionally equivalent to envoy.yaml modulo:
#   - cluster type: STATIC (envoy-go convention per ADR-0002) vs STRICT_DNS.
#   - cluster endpoint addresses: 127.0.0.1 (envoy-go runs on the host
#     loopback) vs host.docker.internal (reference Envoy runs in Docker).
#   - admin/listener ports independently allocated by the runner per proxy.
#   - no dns_lookup_family (STATIC clusters do not DNS-resolve).
#
# Three-listener topology REUSED from fixture 0022 per SPEC §7.4:
#   l_test_a → scenario (a) request_body_buffered_mutation (OBSERVABILITY-only
#              per the Task 7 ADR-0168 §Consequences decode-side body-mutation
#              -delivery KNOWN LIMITATION; processor sees body envelope but
#              does NOT request mutation, keeping cross-side body bytes
#              identical).
#   l_test_b → scenarios (b,c,d,e) response_body_buffered_mutation +
#              body_stage_immediate_response + body_stage_clear_body +
#              header_stage_continue_and_replace. Encode-side body-mutation
#              delivery works via ADR-0131 OverwriteBody.
#   l_test_c → scenario (f) per_route_body_mode_override (route-A: per-route
#              activates BUFFERED request body; route-B: listener-level
#              headers-only baseline).
#
# Subject listener ports are runner-allocated at SubjectConfig time:
#   LA = subjListenerPort, LB = subjListenerPort+1, LC = subjListenerPort+2.
admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: {{.AdminPort}} }

static_resources:
  listeners:
    # === l_test_a — request_body_mode: BUFFERED (scenario a) ===
    - name: l_test_a
      address: { socket_address: { address: 0.0.0.0, port_value: {{.LATestPort}} } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP1
                stat_prefix: hcm_local_a
                route_config:
                  name: rc_test_a
                  virtual_hosts:
                    - name: vh_test_a
                      domains: ["*"]
                      routes:
                        - match: { path: "/scenario_a" }
                          route: { cluster: c_backend }
                        # Scenario (c) — moved to decode side (request_body
                        # BUFFERED + ImmediateResponse at request_body stage)
                        # per the Task 9 fixture-harness scrape AMENDMENT
                        # circumventing the envoy-go encode-side body-stage
                        # SendLocalReply framework gap.
                        - match: { path: "/scenario_c" }
                          route: { cluster: c_backend }
                http_filters:
                  - name: envoy.filters.http.ext_proc
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
                      message_timeout: 10s
                      grpc_service:
                        envoy_grpc:
                          cluster_name: c_ext_proc
                        timeout: 10s
                      processing_mode:
                        request_header_mode: SEND
                        response_header_mode: SEND
                        request_body_mode: BUFFERED
                        response_body_mode: NONE
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

    # === l_test_b — response_body_mode: BUFFERED (scenarios b/c/d/e) ===
    - name: l_test_b
      address: { socket_address: { address: 0.0.0.0, port_value: {{.LBTestPort}} } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP1
                stat_prefix: hcm_local_b
                route_config:
                  name: rc_test_b
                  virtual_hosts:
                    - name: vh_test_b
                      domains: ["*"]
                      routes:
                        # Scenarios b/d/e use direct_response routes (mirrors
                        # the ref envoy.yaml).
                        - match: { path: "/scenario_b" }
                          direct_response:
                            status: 200
                            body: { inline_string: "upstream-response-body-b" }
                        - match: { path: "/scenario_d" }
                          direct_response:
                            status: 200
                            body: { inline_string: "upstream-response-body-d" }
                        - match: { path: "/scenario_e" }
                          direct_response:
                            status: 200
                            body: { inline_string: "upstream-response-body-e" }
                http_filters:
                  - name: envoy.filters.http.ext_proc
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
                      message_timeout: 10s
                      grpc_service:
                        envoy_grpc:
                          cluster_name: c_ext_proc
                        timeout: 10s
                      processing_mode:
                        request_header_mode: SEND
                        response_header_mode: SEND
                        request_body_mode: NONE
                        response_body_mode: BUFFERED
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

    # === l_test_c — per-route body-mode override (scenario f) ===
    - name: l_test_c
      address: { socket_address: { address: 0.0.0.0, port_value: {{.LCTestPort}} } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP1
                stat_prefix: hcm_local_c
                route_config:
                  name: rc_test_c
                  virtual_hosts:
                    - name: vh_test_c
                      domains: ["*"]
                      routes:
                        - match: { path: "/scenario_f_a" }
                          route: { cluster: c_backend }
                          typed_per_filter_config:
                            envoy.filters.http.ext_proc:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExtProcPerRoute
                              overrides:
                                processing_mode:
                                  request_header_mode: SEND
                                  response_header_mode: SEND
                                  request_body_mode: BUFFERED
                                  response_body_mode: NONE
                        - match: { path: "/scenario_f_b" }
                          route: { cluster: c_backend }
                http_filters:
                  - name: envoy.filters.http.ext_proc
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
                      message_timeout: 10s
                      grpc_service:
                        envoy_grpc:
                          cluster_name: c_ext_proc
                        timeout: 10s
                      processing_mode:
                        request_header_mode: SEND
                        response_header_mode: SEND
                        request_body_mode: NONE
                        response_body_mode: NONE
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: c_backend
      type: STATIC
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: c_backend
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: 127.0.0.1, port_value: {{.BackendPort}} }
    - name: c_ext_proc
      type: STATIC
      lb_policy: ROUND_ROBIN
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: c_ext_proc
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: {{.ProcHost}}, port_value: {{.ProcGRPCPort}} }
