# Reference Envoy bootstrap for fixture 0023-http-ext-proc-body.
#
# Three-listener plaintext topology per SPEC §7.4 REUSED from fixture 0022.
# Activates body-stage (BUFFERED) dispatch per scenario per parent §11 19.2
# scope subset + SPEC §7.2 6-scenario matrix:
#
#   l_test_a (port {{.LATestPort}}) — scenario (a) request_body_buffered.
#     request_body_mode: BUFFERED at the listener level; the request_body
#     stage outbound fires after DecodeData accumulates the request body
#     to end_stream. Per parent §5.P11 + the Task 7 ADR-0168 §Consequences
#     refresh: the decode-side body-mutation-delivery KNOWN LIMITATION
#     applies — envoy-go's processor SEES the body envelope + can request
#     mutation, but the mutated bytes are NOT delivered to upstream
#     (HCM captures pre-chain). Scenario (a) is scoped to OBSERVABILITY-
#     only: the processor returns CommonResponse{} (no mutation requested)
#     so cross-side byte equivalence holds verbatim.
#
#   l_test_b (port {{.LBTestPort}}) — scenarios (b, c, d, e) response_body.
#     response_body_mode: BUFFERED at the listener level. Encode-side
#     body-mutation delivery WORKS via ADR-0131 EncoderFilterCallbacks
#     .OverwriteBody — the dispatch goroutine's completeStage path
#     invokes (*filter).deliverEncodeBodyMutation BEFORE the resume
#     signal fires; HCM at connection.go H1 + h2dispatch.go H2 reads
#     chain.EncodeBodyOverride() post-RunEncodeData + substitutes
#     resp.Body with the (possibly-mutated) bytes. Scenarios:
#       /scenario_b → response_body_buffered_mutation (body bytes replaced)
#       /scenario_c → body_stage_immediate_response (403 deny at body stage)
#       /scenario_d → body_stage_clear_body (clear_body:true → 0-byte body)
#       /scenario_e → header_stage_continue_and_replace (CONTINUE_AND_REPLACE
#                     + body_mutation at header stage; body-stage outbound
#                     SKIPPED via f.skipBodyStageDispatch[directionResponse]
#                     per Task 6 + Task 7 wiring).
#
#   l_test_c (port {{.LCTestPort}}) — scenario (f) per_route_body_mode_override.
#     listener-level request_body_mode: NONE (headers-only baseline).
#     Per-route overrides activate per scenario subset:
#       /scenario_f_a → ExtProcPerRoute{overrides{processing_mode{
#                       request_header_mode: SEND,
#                       request_body_mode: BUFFERED}}}
#                       Route exercises body-stage dispatch (per-route
#                       activates BUFFERED; body envelope sent + observed).
#       /scenario_f_b → (no per-route override) Route exercises 19.1-style
#                       headers-only dispatch (request_header_mode: SEND;
#                       request_body_mode: NONE; body-stage outbound NOT
#                       sent — counter-delta presence-check between the
#                       two routes visible at the per-listener scrape).
#     Per-route counter-delta differences are observable PRESENCE-check per
#     ADR-0173 §Consequences AMENDMENT (the 19.1 PRESENCE-check discipline
#     carries forward at 19.2 per SPEC §7.5).
#
# Clusters:
#   c_backend:    STRICT_DNS → {{.BackendHost}}:{{.BackendPort}}
#   c_ext_proc:   STRICT_DNS → {{.ProcHost}}:{{.ProcGRPCPort}} with mandatory
#                 typed_extension_protocol_options
#                 .explicit_http_config.http2_protocol_options: {} for gRPC
#                 framing per SPEC §6.5 (UseH2() == true gate; REUSED from
#                 0022).
#
# Templating: rendered by the driver's mustRender() at ReferenceBootstrap time.
admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: {{.AdminPort}} }

static_resources:
  listeners:
    # === l_test_a — request_body_mode: BUFFERED (scenario a) ===
    - name: l_test_a
      address: { socket_address: { address: 0.0.0.0, port_value: {{.LATestPort}} } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP1
                stat_prefix: hcm_local_a
                route_config:
                  name: rc_test_a
                  virtual_hosts:
                    - name: vh_test_a
                      domains: ["*"]
                      routes:
                        - match: { path: "/scenario_a" }
                          route: { cluster: c_backend }
                        # Scenario (c) — request_body BUFFERED + body-stage
                        # ImmediateResponse from the decode side. Decode-side
                        # SendLocalReply is the well-supported framework path
                        # (the request has not reached upstream yet); the
                        # encode-side body-stage SendLocalReply is rejected
                        # by HCM as "called SendLocalReply after encode-side
                        # started; ignoring" — moving to the decode side
                        # circumvents that envoy-go framework gap (closure
                        # deferred to a future phase).
                        - match: { path: "/scenario_c" }
                          route: { cluster: c_backend }
                http_filters:
                  - name: envoy.filters.http.ext_proc
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
                      message_timeout: 10s
                      grpc_service:
                        envoy_grpc:
                          cluster_name: c_ext_proc
                        timeout: 10s
                      processing_mode:
                        request_header_mode: SEND
                        response_header_mode: SEND
                        request_body_mode: BUFFERED
                        response_body_mode: NONE
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

    # === l_test_b — response_body_mode: BUFFERED (scenarios b/c/d/e) ===
    - name: l_test_b
      address: { socket_address: { address: 0.0.0.0, port_value: {{.LBTestPort}} } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP1
                stat_prefix: hcm_local_b
                route_config:
                  name: rc_test_b
                  virtual_hosts:
                    - name: vh_test_b
                      domains: ["*"]
                      routes:
                        # Scenarios b/d/e use direct_response routes to
                        # eliminate upstream response-framing variability.
                        - match: { path: "/scenario_b" }
                          direct_response:
                            status: 200
                            body: { inline_string: "upstream-response-body-b" }
                        - match: { path: "/scenario_d" }
                          direct_response:
                            status: 200
                            body: { inline_string: "upstream-response-body-d" }
                        - match: { path: "/scenario_e" }
                          direct_response:
                            status: 200
                            body: { inline_string: "upstream-response-body-e" }
                http_filters:
                  - name: envoy.filters.http.ext_proc
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
                      message_timeout: 10s
                      grpc_service:
                        envoy_grpc:
                          cluster_name: c_ext_proc
                        timeout: 10s
                      processing_mode:
                        request_header_mode: SEND
                        response_header_mode: SEND
                        request_body_mode: NONE
                        response_body_mode: BUFFERED
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

    # === l_test_c — per-route body-mode override (scenario f) ===
    - name: l_test_c
      address: { socket_address: { address: 0.0.0.0, port_value: {{.LCTestPort}} } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP1
                stat_prefix: hcm_local_c
                route_config:
                  name: rc_test_c
                  virtual_hosts:
                    - name: vh_test_c
                      domains: ["*"]
                      routes:
                        # Route-A: per-route override flips request_body_mode
                        # from listener-level NONE → BUFFERED. Exercises
                        # body-stage dispatch + ExtProcOverrides processing_mode
                        # body-mode arm consumption per SPEC §5.
                        - match: { path: "/scenario_f_a" }
                          route: { cluster: c_backend }
                          typed_per_filter_config:
                            envoy.filters.http.ext_proc:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExtProcPerRoute
                              overrides:
                                processing_mode:
                                  request_header_mode: SEND
                                  response_header_mode: SEND
                                  request_body_mode: BUFFERED
                                  response_body_mode: NONE
                        # Route-B: no per-route override → listener-level
                        # headers-only baseline. Exercises 19.1-style
                        # headers-only dispatch; body-stage outbound NOT sent.
                        - match: { path: "/scenario_f_b" }
                          route: { cluster: c_backend }
                http_filters:
                  - name: envoy.filters.http.ext_proc
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
                      message_timeout: 10s
                      grpc_service:
                        envoy_grpc:
                          cluster_name: c_ext_proc
                        timeout: 10s
                      processing_mode:
                        request_header_mode: SEND
                        response_header_mode: SEND
                        request_body_mode: NONE
                        response_body_mode: NONE
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    # c_backend: echobackend subprocess (HTTP/1.1).
    - name: c_backend
      type: STRICT_DNS
      connect_timeout: 1s
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: c_backend
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: {{.BackendHost}}, port_value: {{.BackendPort}} }
    # c_ext_proc: in-process bidi-stream gRPC ExternalProcessor.Process server.
    # MANDATORY http2_protocol_options: {} for gRPC framing per SPEC §6.5
    # (UseH2() == true gate; REUSED from 0022). Plaintext h2c — no TLS in
    # phase 19.2 fixtures (parent §8 item 17 documents TLS-fixture deferral).
    - name: c_ext_proc
      type: STRICT_DNS
      connect_timeout: 1s
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: c_ext_proc
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: {{.ProcHost}}, port_value: {{.ProcGRPCPort}} }
