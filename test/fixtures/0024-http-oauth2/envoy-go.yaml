# envoy-go bootstrap for fixture 0024-http-oauth2.
#
# Per phase-20 SPEC §7 + PLAN Task 12. The fixture is REFERENCE-LESS
# (RequiresReference: false) per the Task 12 scope decision documented
# in the fixture README + PROGRESS Task 12 entry: a fully byte-exact
# cross-side differential against reference Envoy v1.37.2 requires
# coordinated control over per-request random IVs (AES-256-CBC) +
# server timestamps + state-cookie HMAC payload bytes that neither
# stack exposes a hook for. The Task 12 IMPL therefore lands a
# subject-only structural fixture (mirrors 0007b-iteration-probe
# precedent: RequiresReference: false + SubjectAsserter in-band)
# asserting per-scenario wire-shape invariants of the envoy-go oauth2
# filter under §6.3 dispatch priority + §4.1 4-emission-category wire
# shape + §4.6 counter matrix.
#
# Listener topology (2-listener per the Task 11 finding that
# `disable_token_encryption` field is absent from the go-control-plane
# v1.32.4 proto pinned by phase 20):
#
#   l_test_a — default-encryption (`disable_token_encryption` field
#              absent in v1.32.4 → defaults to FALSE → encryption ON).
#              Exercises: scenario (c) pass-through, (e) sign-out, (f)
#              bad-state 401, (g) token_endpoint 5xx, (h)
#              token_endpoint 4xx, (a) sign-in 302-challenge wire shape.
#   l_test_c — `forward_bearer_token=true` variant. Exercises the
#              ContinueDecoding leg's Authorization-header injection
#              wire shape (scenario b1 cookie-passthrough; the driver
#              seeds the cookie envelope via test/helpers/oauthbackend/
#              `ValidCookieEnvelope` so the HMAC + AES-CBC envelope
#              matches the envoy-go-side configured hmac_secret).
#
# `l_test_b` (`disable_token_encryption=true`) is DEFERRED per the
# Task 11 finding — the field cannot be set through the v1.32.4
# proto-config path. A future go-control-plane bump unblocks
# scenario (i); the bump-and-extend trigger is documented at the
# PROGRESS Task 12 entry + SPEC §8 forward-pointer.
#
# Templating: rendered by the driver's mustRender() at SubjectConfig
# time. Substitution keys:
#   {{.AdminPort}}    — admin endpoint port (subject).
#   {{.LATestPort}}   — l_test_a listener port.
#   {{.LCTestPort}}   — l_test_c listener port (LATestPort + 1).
#   {{.BackendPort}}  — echobackend port (runner-allocated).
#   {{.OAuthPort}}    — oauthbackend in-process mock port (driver-allocated).
#   {{.HmacPath}}     — absolute filesystem path to the hmac.json Secret.
#   {{.ClientPath}}   — absolute filesystem path to the client_secret.json Secret.
admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: {{.AdminPort}} }

static_resources:
  listeners:
    # === l_test_a — default-encryption (disable_token_encryption=false default) ===
    - name: l_test_a
      address: { socket_address: { address: 0.0.0.0, port_value: {{.LATestPort}} } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP1
                stat_prefix: hcm_local_a
                route_config:
                  name: rc_test_a
                  virtual_hosts:
                    - name: vh_test_a
                      domains: ["*"]
                      routes:
                        # Scenarios (c), (e), (f), (g), (h), (a) and the
                        # protected backend route share the same prefix
                        # (filter-decides via cookie-envelope state +
                        # path + method). The oauth2 dispatcher per SPEC
                        # §6.3 fires before the route reaches c_backend.
                        - match: { prefix: "/" }
                          route: { cluster: c_backend }
                http_filters:
                  - name: envoy.filters.http.oauth2
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.oauth2.v3.OAuth2
                      config:
                        token_endpoint:
                          cluster: c_oauth_backend
                          uri: http://127.0.0.1:{{.OAuthPort}}/token
                          timeout: 5s
                        authorization_endpoint: http://127.0.0.1:{{.OAuthPort}}/authorize
                        redirect_uri: http://127.0.0.1:{{.LATestPort}}/oauth/callback
                        redirect_path_matcher:
                          path:
                            prefix: /oauth/callback
                        signout_path:
                          path:
                            prefix: /oauth/signout
                        pass_through_matcher:
                          - name: X-Bypass-OAuth2
                            string_match:
                              exact: "true"
                        credentials:
                          client_id: phase20-fixture-client-id
                          token_secret:
                            name: client_secret
                            sds_config:
                              path_config_source:
                                path: {{.ClientPath}}
                          hmac_secret:
                            name: hmac
                            sds_config:
                              path_config_source:
                                path: {{.HmacPath}}
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

    # === l_test_c — forward_bearer_token=true ===
    - name: l_test_c
      address: { socket_address: { address: 0.0.0.0, port_value: {{.LCTestPort}} } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP1
                stat_prefix: hcm_local_c
                route_config:
                  name: rc_test_c
                  virtual_hosts:
                    - name: vh_test_c
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: c_backend }
                http_filters:
                  - name: envoy.filters.http.oauth2
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.oauth2.v3.OAuth2
                      config:
                        token_endpoint:
                          cluster: c_oauth_backend
                          uri: http://127.0.0.1:{{.OAuthPort}}/token
                          timeout: 5s
                        authorization_endpoint: http://127.0.0.1:{{.OAuthPort}}/authorize
                        redirect_uri: http://127.0.0.1:{{.LCTestPort}}/oauth/callback
                        redirect_path_matcher:
                          path:
                            prefix: /oauth/callback
                        signout_path:
                          path:
                            prefix: /oauth/signout
                        forward_bearer_token: true
                        credentials:
                          client_id: phase20-fixture-client-id
                          token_secret:
                            name: client_secret
                            sds_config:
                              path_config_source:
                                path: {{.ClientPath}}
                          hmac_secret:
                            name: hmac
                            sds_config:
                              path_config_source:
                                path: {{.HmacPath}}
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: c_backend
      type: STATIC
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: c_backend
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: 127.0.0.1
                      port_value: {{.BackendPort}}
    - name: c_oauth_backend
      type: STATIC
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: c_oauth_backend
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: 127.0.0.1
                      port_value: {{.OAuthPort}}
