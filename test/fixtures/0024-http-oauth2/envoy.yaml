# Reference Envoy bootstrap for fixture 0024-http-oauth2.
#
# NOTE — REFERENCE-LESS FIXTURE: per phase-20 PLAN Task 12 scope
# decision documented at PROGRESS Task 12 entry + fixture README, this
# fixture is reference-less (driver.RequiresReference() returns false).
# The runner SHORT-CIRCUITS the reference-proxy spawn + the
# DriveReference + the byte-stream CompareBytes per the
# `runReferenceLessFixture` branch in test/differential/runner_test.go.
# THIS FILE IS NOT CONSUMED BY THE TEST HARNESS at phase 20 IMPL.
#
# The file is preserved as a forward-pointer / design-document so a
# future fixture-extension task that promotes 0024 to a true
# differential fixture (post-go-control-plane bump to v1.37.x) has a
# starting reference-yaml shape on hand. The shape is identical to
# envoy-go.yaml modulo:
#   - cluster type: STRICT_DNS to host.docker.internal vs STATIC to 127.0.0.1.
#   - dns_lookup_family: V4_ONLY (STRICT_DNS only).
#
# Per the §7 + §7.4 the reference Envoy MUST be reachable from inside
# the docker container; the oauthbackend mock URL would be rendered
# with host.docker.internal per the ADR-0010 docker-host-bridge
# pattern. The forward-pointer at PROGRESS Task 12 entry documents the
# extension trigger.
admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: {{.AdminPort}} }

static_resources:
  listeners:
    - name: l_test_a
      address: { socket_address: { address: 0.0.0.0, port_value: {{.LATestPort}} } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP1
                stat_prefix: hcm_local_a
                route_config:
                  name: rc_test_a
                  virtual_hosts:
                    - name: vh_test_a
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: c_backend }
                http_filters:
                  - name: envoy.filters.http.oauth2
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.oauth2.v3.OAuth2
                      config:
                        token_endpoint:
                          cluster: c_oauth_backend
                          uri: http://{{.OAuthHost}}:{{.OAuthPort}}/token
                          timeout: 5s
                        authorization_endpoint: http://{{.OAuthHost}}:{{.OAuthPort}}/authorize
                        redirect_uri: http://127.0.0.1:{{.LATestPort}}/oauth/callback
                        redirect_path_matcher:
                          path:
                            exact: /oauth/callback
                        signout_path:
                          path:
                            exact: /oauth/signout
                        pass_through_matcher:
                          - name: X-Bypass-OAuth2
                            string_match:
                              exact: "true"
                        credentials:
                          client_id: phase20-fixture-client-id
                          token_secret:
                            name: client_secret
                            sds_config:
                              path_config_source:
                                path: {{.ClientPath}}
                          hmac_secret:
                            name: hmac
                            sds_config:
                              path_config_source:
                                path: {{.HmacPath}}
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: c_backend
      type: STRICT_DNS
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: c_backend
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: {{.BackendHost}}
                      port_value: {{.BackendPort}}
    - name: c_oauth_backend
      type: STRICT_DNS
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: c_oauth_backend
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: {{.OAuthHost}}
                      port_value: {{.OAuthPort}}
