# Reference Envoy bootstrap for fixture 0081-grpc-access-log.
#
# Single-listener plaintext H1 topology (phase 44.1 SPEC §12 — the core gRPC ALS
# streaming-sink differential). One downstream HTTP/1.1 listener routes every
# request to the HTTPFixedBody backend (cluster c_backend); the HCM carries one
# `access_log[]` entry of type HttpGrpcAccessLogConfig that streams a
# HTTPAccessLogEntry proto per completed request to the driver-owned in-process
# AccessLogService receiver (cluster c_als; h2c, no TLS — D-ALS-RECEIVER).
#
# Templating: rendered by the driver's mustRender() at ReferenceBootstrap time.
# Substitution keys:
#   {{.AdminPort}}    — admin endpoint port (hard-coded 9901 by driver).
#   {{.ListenerPort}} — l_test in-container port (10081 per fixture convention).
#   {{.BackendHost}}  — HTTPFixedBody backend host (host.docker.internal per ADR-0010).
#   {{.BackendPort}}  — HTTPFixedBody backend port (runner-allocated).
#   {{.ALSHost}}      — driver-owned ALS receiver host (host.docker.internal for ref).
#   {{.ALSPort}}      — driver-owned ALS receiver port (driver-allocated; the
#                       in-process accessloggrpc.Server binds 0.0.0.0:<port>
#                       before the container starts).
#
# Cluster type: STRICT_DNS so the reference Envoy container resolves
# host.docker.internal (the Docker bridge host alias per ADR-0010).
# dns_lookup_family: V4_ONLY per the established fixture precedent.
admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: {{.AdminPort}} }

static_resources:
  listeners:
    - name: l_test
      address: { socket_address: { address: 0.0.0.0, port_value: {{.ListenerPort}} } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP1
                stat_prefix: hcm_local
                access_log:
                  - name: envoy.access_loggers.http_grpc
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.grpc.v3.HttpGrpcAccessLogConfig
                      common_config:
                        log_name: "0081"
                        grpc_service:
                          envoy_grpc:
                            cluster_name: c_als
                route_config:
                  name: rc_test
                  virtual_hosts:
                    - name: vh_test
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: c_backend }
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    # c_backend: HTTPFixedBody subprocess (17-byte fixed body) reached via
    # host.docker.internal from the reference Envoy container per ADR-0010.
    - name: c_backend
      type: STRICT_DNS
      connect_timeout: 1s
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: c_backend
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: {{.BackendHost}}, port_value: {{.BackendPort}} }
    # c_als: driver-owned in-process AccessLogService gRPC receiver. MANDATORY
    # http2_protocol_options: {} for gRPC framing. Plaintext h2c — no TLS
    # (D-ALS-RECEIVER).
    - name: c_als
      type: STRICT_DNS
      connect_timeout: 1s
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: c_als
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: {{.ALSHost}}, port_value: {{.ALSPort}} }
