# envoy-go subject bootstrap for fixture 0038-http-wasm-perroute-and-multi-plugin.
#
# Per phase 25.3 Task 11. Same 3-listener topology as envoy.yaml; runtime
# is envoy.wasm.runtime.wazero per AMEND-A1. Each listener consumes a
# host-side absolute path under the fixture's bytecode/ subdirectory.
#
# envoy-go is StrictDefaultDeny (AMEND-A5): nil/empty allowed_capabilities
# DENY all hostcalls. Each wasm filter lists the full post-25.2 capability
# superset. The caps block is rendered by the driver at two indent depths
# (CapsFilter for http_filters-level filters; CapsRoute for the per-route
# override) so the YAML nesting is correct. The reload listener adds
# failure_policy=FAIL_RELOAD + reload_config (1s backoff base interval;
# envoy-go-strict floors at 100ms + omits jitter, deterministic).
admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: {{.AdminPort}} }

static_resources:
  listeners:
    - name: l_perroute
      address: { socket_address: { address: 0.0.0.0, port_value: {{.PerRoutePort}} } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP1
                stat_prefix: hcm_perroute
                route_config:
                  name: rc_perroute
                  virtual_hosts:
                    - name: vh_perroute
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/override" }
                          route: { cluster: cluster_a }
                          typed_per_filter_config:
                            envoy.filters.http.wasm:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.wasm.v3.Wasm
                              config:
                                name: plugin_perroute_override
                                root_id: scenario_perroute_override
                                vm_config:
                                  vm_id: vm_perroute_override
                                  runtime: envoy.wasm.runtime.wazero
                                  code:
                                    local:
                                      filename: "{{.OverrideWasmPath}}"
                                capability_restriction_config:
                                  allowed_capabilities:
{{.CapsRoute}}
                        - match: { prefix: "/" }
                          route: { cluster: cluster_a }
                http_filters:
                  - name: envoy.filters.http.wasm
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.wasm.v3.Wasm
                      config:
                        name: plugin_listener_default
                        root_id: scenario_listener_default
                        vm_config:
                          vm_id: vm_listener_default
                          runtime: envoy.wasm.runtime.wazero
                          code:
                            local:
                              filename: "{{.ListenerWasmPath}}"
                        capability_restriction_config:
                          allowed_capabilities:
{{.CapsFilter}}
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

    - name: l_multiplugin
      address: { socket_address: { address: 0.0.0.0, port_value: {{.MultiPort}} } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP1
                stat_prefix: hcm_multi
                route_config:
                  name: rc_multi
                  virtual_hosts:
                    - name: vh_multi
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: cluster_a }
                http_filters:
                  - name: wasm_multi_a
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.wasm.v3.Wasm
                      config:
                        name: plugin_multi_a
                        root_id: scenario_multi
                        vm_config:
                          vm_id: vm_shared
                          runtime: envoy.wasm.runtime.wazero
                          code:
                            local:
                              filename: "{{.SharedWasmPath}}"
                        capability_restriction_config:
                          allowed_capabilities:
{{.CapsFilter}}
                  - name: wasm_multi_b
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.wasm.v3.Wasm
                      config:
                        name: plugin_multi_b
                        root_id: scenario_multi
                        vm_config:
                          vm_id: vm_shared
                          runtime: envoy.wasm.runtime.wazero
                          code:
                            local:
                              filename: "{{.SharedWasmPath}}"
                        capability_restriction_config:
                          allowed_capabilities:
{{.CapsFilter}}
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

    - name: l_reload
      address: { socket_address: { address: 0.0.0.0, port_value: {{.ReloadPort}} } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP1
                stat_prefix: hcm_reload
                route_config:
                  name: rc_reload
                  virtual_hosts:
                    - name: vh_reload
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: cluster_a }
                http_filters:
                  - name: envoy.filters.http.wasm
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.wasm.v3.Wasm
                      config:
                        name: plugin_reload
                        root_id: scenario_reload
                        failure_policy: FAIL_RELOAD
                        reload_config:
                          backoff:
                            base_interval: 1s
                        vm_config:
                          vm_id: vm_reload
                          runtime: envoy.wasm.runtime.wazero
                          code:
                            local:
                              filename: "{{.ReloadWasmPath}}"
                        capability_restriction_config:
                          allowed_capabilities:
{{.CapsFilter}}
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: cluster_a
      type: STATIC
      connect_timeout: 0.25s
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: cluster_a
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: 127.0.0.1, port_value: {{.BackendPort}} }
