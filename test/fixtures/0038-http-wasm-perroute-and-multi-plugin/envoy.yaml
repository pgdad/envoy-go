# Reference Envoy bootstrap for fixture 0038-http-wasm-perroute-and-multi-plugin.
#
# Per phase 25.3 Task 11. Three-listener mixed-mode topology:
#
#   l_perroute (port {{.PerRoutePort}}) — listener-default wasm plugin
#     (listener_default.wasm → x-wasm-variant: listener). Route /override
#     carries a per-route wholesale Wasm typed_per_filter_config override
#     (perroute_override.wasm → x-wasm-variant: override). Route /default
#     has NO per-route TPFC → the listener default applies. Cross-side
#     (CompareBytes): both routes' x-wasm-variant value agree across
#     reference Envoy (cpp-host wholesale per-route Wasm) + envoy-go.
#
#   l_multiplugin (port {{.MultiPort}}) — TWO envoy.filters.http.wasm
#     filters in ONE chain, BOTH with the SAME vm_id (vm_shared) + same
#     code + (empty) vm_configuration → share ONE RootVM + ONE shared-data
#     namespace. Filter A (PluginConfig.configuration="writer") writes the
#     shared key on the request path; filter B (configuration="reader")
#     reflects it in x-shared on the response path. Cross-side: both sides
#     show x-shared: written-by-A (cpp-host shares by vm_id).
#
#   l_reload (port {{.ReloadPort}}) — a FAIL_RELOAD plugin
#     (fail_reload_trap.wasm) that traps on request header x-trigger-trap=1.
#     SUBJECT-ONLY: the reference V8 reload stat names diverge from
#     envoy-go's wasm.<plugin>.vm_reload_* triplet; the driver scrapes only
#     the subject's counters. The listener is present on BOTH sides for
#     topology symmetry but the cross-side byte stream for the reload arm is
#     a constant token.
#
# The TWO upstream clusters are folded into ONE cluster_a (single
# echobackend) per phase-22.2 REVIEW §7.4 freeTCPPort flake mitigation.
# Runtime: reference uses envoy.wasm.runtime.v8.
admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: {{.AdminPort}} }

static_resources:
  listeners:
    - name: l_perroute
      address: { socket_address: { address: 0.0.0.0, port_value: {{.PerRoutePort}} } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP1
                stat_prefix: hcm_perroute
                route_config:
                  name: rc_perroute
                  virtual_hosts:
                    - name: vh_perroute
                      domains: ["*"]
                      routes:
                        # NOTE: reference Envoy v1.37.2 does NOT support
                        # per-route (route/vhost-specific) configuration for
                        # envoy.filters.http.wasm — boot rejects with "The
                        # filter envoy.filters.http.wasm doesn't support
                        # virtual host or route specific configurations". So
                        # the /override route carries NO per-route TPFC on the
                        # reference side; the listener-default plugin applies
                        # (x-wasm-variant: listener). The per-route wholesale
                        # Wasm override (AMEND-C1) is an envoy-go capability
                        # NOT shared by reference v1.37.2 — its application is
                        # therefore SUBJECT-ONLY (driver asserts the override
                        # via wasm.plugin_perroute_override.executions on the
                        # subject; the /override response-header byte stream is
                        # a constant token across sides). See the driver +
                        # README "per-route override" note.
                        - match: { prefix: "/" }
                          route: { cluster: cluster_a }
                http_filters:
                  - name: envoy.filters.http.wasm
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.wasm.v3.Wasm
                      config:
                        name: plugin_listener_default
                        root_id: scenario_listener_default
                        vm_config:
                          vm_id: vm_listener_default
                          runtime: envoy.wasm.runtime.v8
                          code:
                            local:
                              filename: "{{.ListenerWasmPath}}"
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

    - name: l_multiplugin
      address: { socket_address: { address: 0.0.0.0, port_value: {{.MultiPort}} } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP1
                stat_prefix: hcm_multi
                route_config:
                  name: rc_multi
                  virtual_hosts:
                    - name: vh_multi
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: cluster_a }
                http_filters:
                  - name: wasm_multi_a
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.wasm.v3.Wasm
                      config:
                        name: plugin_multi_a
                        root_id: scenario_multi
                        vm_config:
                          vm_id: vm_shared
                          runtime: envoy.wasm.runtime.v8
                          code:
                            local:
                              filename: "{{.SharedWasmPath}}"
                  - name: wasm_multi_b
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.wasm.v3.Wasm
                      config:
                        name: plugin_multi_b
                        root_id: scenario_multi
                        vm_config:
                          vm_id: vm_shared
                          runtime: envoy.wasm.runtime.v8
                          code:
                            local:
                              filename: "{{.SharedWasmPath}}"
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

    - name: l_reload
      address: { socket_address: { address: 0.0.0.0, port_value: {{.ReloadPort}} } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP1
                stat_prefix: hcm_reload
                route_config:
                  name: rc_reload
                  virtual_hosts:
                    - name: vh_reload
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: cluster_a }
                http_filters:
                  - name: envoy.filters.http.wasm
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.wasm.v3.Wasm
                      config:
                        name: plugin_reload
                        root_id: scenario_reload
                        vm_config:
                          vm_id: vm_reload
                          runtime: envoy.wasm.runtime.v8
                          code:
                            local:
                              filename: "{{.ReloadWasmPath}}"
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: cluster_a
      type: STRICT_DNS
      connect_timeout: 0.25s
      lb_policy: ROUND_ROBIN
      dns_lookup_family: V4_ONLY
      load_assignment:
        cluster_name: cluster_a
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: {{.BackendHost}}, port_value: {{.BackendPort}} }
