# Reference Envoy bootstrap for fixture 0020-http-ext-authz-http.
#
# Three-listener plaintext topology per SPEC §7.2 + driver.go topology contract
# (Task 11 review-fix) — no TLS in phase 18.1 (planner-time decision D12):
#
#   l_test_a (port {{.LATestPort}}) — scenarios 1+2+5+6+7.
#     failure_mode_allow: false (default).
#     Auth cluster: c_authz (LIVE; points at the in-process auth server at
#     host.docker.internal:{{.AuthPort}}).
#     with_request_body{max_request_bytes: 4096} for S5 body-inspection +
#     S7 per-route disable_request_body_buffering override.
#     allowed_headers (top-level): exact:authority + prefix:x- — exercises
#     request-side header filtering (Group 3).
#     headers_to_add: x-fixture-fingerprint: 0020 — exercises Task-9 Option-A
#     pre-compiled headers_to_add.
#     allowed_upstream_headers: exact:x-authz-result — S1 upstream injection.
#     allowed_client_headers: exact:x-authz-denied — S2 deny-path filtering.
#     Per-route overrides:
#       /scenarios/6-disabled  → ExtAuthzPerRoute{disabled: true}
#       /scenarios/7-check-settings → ExtAuthzPerRoute{check_settings{
#           disable_request_body_buffering: true}}
#
#   l_test_b (port {{.LBTestPort}}) — scenario 3.
#     failure_mode_allow: false; status_on_error: ServiceUnavailable (503).
#     Auth cluster: c_authz_down (UNREACHABLE; hardcoded closed port at
#     host.docker.internal:{{.AuthDownPort}}).
#
#   l_test_c (port {{.LCTestPort}}) — scenario 4.
#     failure_mode_allow: true; failure_mode_allow_header_add: true.
#     Auth cluster: c_authz_down (same unreachable cluster as l_test_b).
#
# Clusters:
#   c_backend:    STRICT_DNS → host.docker.internal:{{.BackendPort}}
#   c_authz:      STRICT_DNS → host.docker.internal:{{.AuthPort}}
#   c_authz_down: STRICT_DNS → host.docker.internal:{{.AuthDownPort}}
#
# Templating: rendered by the driver's mustRender() at ReferenceBootstrap time.
# Substitution keys:
#   {{.AdminPort}}    — hard-coded 9901 by the driver (reference container).
#   {{.LATestPort}}   — l_test_a in-container port (10020 per fixture convention).
#   {{.LBTestPort}}   — l_test_b in-container port (10021).
#   {{.LCTestPort}}   — l_test_c in-container port (10022).
#   {{.BackendHost}}  — echobackend host (host.docker.internal per ADR-0010).
#   {{.BackendPort}}  — echobackend port (runner-allocated).
#   {{.AuthHost}}     — live auth server host (host.docker.internal for ref).
#   {{.AuthPort}}     — live auth server port (driver-allocated).
#   {{.AuthDownHost}} — unreachable auth host (host.docker.internal for ref).
#   {{.AuthDownPort}} — unreachable auth port (driver-allocated + immediately closed).
#
# Cluster type: STRICT_DNS so the reference Envoy container can resolve
# host.docker.internal (the Docker bridge host alias per ADR-0010).
# dns_lookup_family: V4_ONLY per phase-14/15/16/17 precedent.
admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: {{.AdminPort}} }

static_resources:
  listeners:
    # === l_test_a — failure_mode_allow:false + live auth (c_authz) ===
    # Scenarios 1 (HTTP allow), 2 (HTTP deny), 5 (with_request_body),
    # 6 (per-route disabled), 7 (per-route check_settings).
    - name: l_test_a
      address: { socket_address: { address: 0.0.0.0, port_value: {{.LATestPort}} } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP1
                stat_prefix: hcm_local_a
                route_config:
                  name: rc_test_a
                  virtual_hosts:
                    - name: vh_test_a
                      domains: ["*"]
                      routes:
                        # Scenario 1: HTTP allow — auth FixedScript 200 + x-authz-result: allowed.
                        # allowed_upstream_headers (exact:x-authz-result) injects header upstream.
                        - match: { path: "/scenarios/1-allow" }
                          route: { cluster: c_backend }
                        # Scenario 2: HTTP deny — auth FixedScript 403 + body "access denied".
                        # allowed_client_headers (exact:x-authz-denied) passes header to client.
                        - match: { path: "/scenarios/2-deny" }
                          route: { cluster: c_backend }
                        # Scenario 5: with_request_body — listener-level with_request_body active.
                        # auth InspectScript reads the POST body; allows if contains "hello".
                        - match: { path: "/scenarios/5-body" }
                          route: { cluster: c_backend }
                        # Scenario 6: per-route disabled — ExtAuthzPerRoute{disabled: true}.
                        # No auth call; no ext_authz counter increments.
                        - match: { path: "/scenarios/6-disabled" }
                          route: { cluster: c_backend }
                          typed_per_filter_config:
                            envoy.filters.http.ext_authz:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                              disabled: true
                        # Scenario 7: per-route check_settings — disable_request_body_buffering:true
                        # overrides the listener-level with_request_body to OFF on this route.
                        - match: { path: "/scenarios/7-check-settings" }
                          route: { cluster: c_backend }
                          typed_per_filter_config:
                            envoy.filters.http.ext_authz:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                              check_settings:
                                disable_request_body_buffering: true
                http_filters:
                  - name: envoy.filters.http.ext_authz
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
                      transport_api_version: V3
                      # failure_mode_allow: false is the proto default — not emitted.
                      # with_request_body: enabled for S5 (InspectScript body inspection)
                      # + S7 (per-route override disables it on that route).
                      with_request_body:
                        max_request_bytes: 4096
                        allow_partial_message: false
                      # allowed_headers (top-level ListStringMatcher) — request-side filtering.
                      # Passes exact:authority + prefix:x- headers to the auth service.
                      allowed_headers:
                        patterns:
                          - exact: "authority"
                          - prefix: "x-"
                      http_service:
                        server_uri:
                          uri: "http://{{.AuthHost}}:{{.AuthPort}}"
                          cluster: c_authz
                          timeout: 10s
                        # path_prefix: prepended to the request path in the auth POST.
                        # Exercises path-prefix prepending per SPEC §7.2.
                        path_prefix: "/authcheck"
                        authorization_request:
                          # headers_to_add: static header appended to each auth request.
                          # Exercises Task-9 Option-A fix (pre-compiled headers_to_add).
                          headers_to_add:
                            - key: "x-fixture-fingerprint"
                              value: "0020"
                        authorization_response:
                          # allowed_upstream_headers: auth response headers injected upstream
                          # on allow (overwrite). x-authz-result verified in S1.
                          allowed_upstream_headers:
                            patterns:
                              - exact: "x-authz-result"
                          # allowed_client_headers: auth response headers passed to the client
                          # on deny. x-authz-denied verified in S2.
                          allowed_client_headers:
                            patterns:
                              - exact: "x-authz-denied"
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

    # === l_test_b — failure_mode_allow:false + status_on_error:503 + unreachable auth ===
    # Scenario 3: auth server unreachable (c_authz_down); failure_mode_allow:false;
    # status_on_error:ServiceUnavailable(503). Expected: 503 + empty body.
    - name: l_test_b
      address: { socket_address: { address: 0.0.0.0, port_value: {{.LBTestPort}} } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP1
                stat_prefix: hcm_local_b
                route_config:
                  name: rc_test_b
                  virtual_hosts:
                    - name: vh_test_b
                      domains: ["*"]
                      routes:
                        # Scenario 3: error path — auth unreachable; 503 returned.
                        - match: { path: "/scenarios/3-error" }
                          route: { cluster: c_backend }
                http_filters:
                  - name: envoy.filters.http.ext_authz
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
                      transport_api_version: V3
                      # failure_mode_allow: false (proto default; NOT emitted).
                      # status_on_error: 503 ServiceUnavailable — returned when auth unreachable.
                      status_on_error:
                        code: ServiceUnavailable
                      http_service:
                        server_uri:
                          uri: "http://{{.AuthDownHost}}:{{.AuthDownPort}}"
                          cluster: c_authz_down
                          timeout: 10s
                        path_prefix: "/authcheck"
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

    # === l_test_c — failure_mode_allow:true + failure_mode_allow_header_add:true ===
    # Scenario 4: auth server unreachable (c_authz_down); failure_mode_allow:true +
    # failure_mode_allow_header_add:true. Expected: 200 echo backend +
    # x-envoy-auth-failure-mode-allowed header arrives upstream.
    - name: l_test_c
      address: { socket_address: { address: 0.0.0.0, port_value: {{.LCTestPort}} } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP1
                stat_prefix: hcm_local_c
                route_config:
                  name: rc_test_c
                  virtual_hosts:
                    - name: vh_test_c
                      domains: ["*"]
                      routes:
                        # Scenario 4: failure_mode_allow path — auth unreachable; allowed through.
                        - match: { path: "/scenarios/4-failure-allow" }
                          route: { cluster: c_backend }
                http_filters:
                  - name: envoy.filters.http.ext_authz
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
                      transport_api_version: V3
                      failure_mode_allow: true
                      failure_mode_allow_header_add: true
                      http_service:
                        server_uri:
                          uri: "http://{{.AuthDownHost}}:{{.AuthDownPort}}"
                          cluster: c_authz_down
                          timeout: 10s
                        path_prefix: "/authcheck"
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    # c_backend: echobackend subprocess (HTTP/1.1) reached via host.docker.internal
    # from the reference Envoy container per ADR-0010.
    - name: c_backend
      type: STRICT_DNS
      connect_timeout: 1s
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: c_backend
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: {{.BackendHost}}, port_value: {{.BackendPort}} }
    # c_authz: in-process HTTP auth server (live; scenarios 1+2+5+7 via l_test_a).
    # Reached via host.docker.internal from the reference Envoy container per ADR-0010.
    - name: c_authz
      type: STRICT_DNS
      connect_timeout: 1s
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: c_authz
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: {{.AuthHost}}, port_value: {{.AuthPort}} }
    # c_authz_down: hardcoded unreachable port (scenarios 3+4 via l_test_b + l_test_c).
    # Nothing is bound at authDownPort — connect attempts fail fast → error disposition.
    - name: c_authz_down
      type: STRICT_DNS
      connect_timeout: 1s
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: c_authz_down
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: {{.AuthDownHost}}, port_value: {{.AuthDownPort}} }
