# envoy-go bootstrap for fixture 0015-http-buffer.
# Identical to envoy.yaml modulo:
#   - cluster type: STATIC (envoy-go convention) vs STRICT_DNS (reference Envoy)
#   - backend address: 127.0.0.1 (envoy-go is in-process) vs host.docker.internal
#   - admin/listener ports independently allocated by the runner per proxy
#
# Single-listener `l_main` topology per planner-time decision 6 (PLAN.md):
# one HCM listener carrying the buffer filter at listener level + per-route
# TPFC overrides on `/route-disabled` and `/route-tighter`. Three routes:
#   - `/route-disabled` — typed_per_filter_config BufferPerRoute{disabled: true}
#   - `/route-tighter`  — typed_per_filter_config BufferPerRoute{buffer: {max_request_bytes: 131072}}
#   - `/`               — default (inherits listener-level Buffer max_request_bytes: 1048576)
#
# Listener-level Buffer max_request_bytes: 1048576 (1 MiB; the envoy-go cap per ADR-0126).
admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: {{.AdminPort}} }

static_resources:
  listeners:
    - name: l_main
      address: { socket_address: { address: 0.0.0.0, port_value: {{.ListenerPort}} } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP1
                stat_prefix: ingress_buffer
                route_config:
                  name: rc_main
                  virtual_hosts:
                    - name: vh_main
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/route-disabled" }
                          route: { cluster: c_backend }
                          typed_per_filter_config:
                            envoy.filters.http.buffer:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.buffer.v3.BufferPerRoute
                              disabled: true
                        - match: { prefix: "/route-tighter" }
                          route: { cluster: c_backend }
                          typed_per_filter_config:
                            envoy.filters.http.buffer:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.buffer.v3.BufferPerRoute
                              buffer:
                                max_request_bytes: 131072
                        - match: { prefix: "/" }
                          route: { cluster: c_backend }
                http_filters:
                  - name: envoy.filters.http.buffer
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.buffer.v3.Buffer
                      max_request_bytes: 1048576
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: c_backend
      type: STATIC
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: c_backend
        endpoints:
          - lb_endpoints:
              - endpoint: { address: { socket_address: { address: 127.0.0.1, port_value: {{.BackendPort}} } } }
