# Reference Envoy bootstrap for fixture 0018-http-rbac.
#
# Three-listener topology per SPEC §7.2 + Task 13:
#   l_test_a      — plaintext HCM with envoy.filters.http.rbac → router;
#                   listener-level RBAC carries 4 policies (admin_users,
#                   public_paths, listener_port_match, local_clients) +
#                   5 routes (/, /public, /protected, /per-route-disabled,
#                   /per-route-override); scenarios 1, 2, 3, 4, 5, 7, 8.
#   l_test_b      — echo-backend HCM (target of cluster c_backend_b).
#   l_test_a_tls  — mTLS-required HCM mirroring l_test_a's filter chain +
#                   1 additional policy (authenticated_admin) +
#                   1 route (/admin); scenario 6.
#
# Both RBAC config blocks set explicit `rules_stat_prefix` +
# `shadow_rules_stat_prefix` per SPEC §1.1 amendment 9 so the SN2-reuse
# Prometheus-counter namespace renders identically on the envoy-go side per
# ADR-0145. The listener-level config uses `default` for both. The scenario-8
# per-route override uses `override` (primary) + `override_shadow` (shadow),
# matching the Task-12 driver's AssertStats expectations.
#
# Cluster c_backend_b: STRICT_DNS to host.docker.internal:<BackendPort> per
# ADR-0010 (reference Envoy runs inside a Docker container and reaches the
# host-spawned echobackend helper via host.docker.internal). dns_lookup_family:
# V4_ONLY per phase-14/15 precedent (forces v4 routing from inside the
# container).
#
# Direct-response payload `fixture-0018-direct-response-OK\n` is exactly 32
# bytes — matches the Task-12 driver's `scenario1AllowBody` constant verbatim.
# Deny payload "RBAC: access denied" is 19 bytes per SPEC §4 + §1.1
# amendment 10. The 4-policy listener config emits ALLOW + match → 200 +
# 32-byte body for scenarios 1/3/4; ALLOW + no-match → 403 + 19-byte deny
# body for scenario 2.
#
# Per-route TPFC shapes (7th canonical per ADR-0125 §(xii)):
#   /per-route-disabled  — RBACPerRoute{} (rbac field absent) → filter
#                          disabled for this route. Scenario 7 returns 200
#                          regardless of header. NO counter emission.
#   /per-route-override  — RBACPerRoute{rbac: <override config DENY guests>}
#                          → wholesale-override per ADR-0073. Scenario 8's
#                          X-User=guest matches the override DENY policy →
#                          403; INDEPENDENT-stats namespace `override.*` +
#                          `override_shadow.*` (default.* UNCHANGED).
#
# mTLS shape: l_test_a_tls's transport_socket carries DownstreamTlsContext
# with the fixture-CA + server cert/key + require_client_certificate=true.
# The fixture-CA + server + client PEMs are generated at test-binary load
# time by the `pki` package's init() (per gen.go's package doc-comment +
# Task 13 disposition). Note: reference Envoy runs inside a container; the
# `pki/*.pem` paths below are HOST paths that need bind-mounting into the
# container for end-to-end execution at Task 14 (the driver's
# ReferenceLogMounter implementation lands at Task 14). For Task 13 YAML
# validation (`--mode validate`), the file paths only need to be
# syntactically valid — Envoy does NOT load the cert files in validate-mode.
admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: {{.AdminPort}} }

static_resources:
  listeners:
    # === l_test_a — plaintext HCM with listener-level RBAC ===
    - name: l_test_a
      address: { socket_address: { address: 0.0.0.0, port_value: {{.LATestPort}} } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP1
                stat_prefix: hcm_local_a
                route_config:
                  name: rc_test_a
                  virtual_hosts:
                    - name: vh_test_a
                      domains: ["*"]
                      routes:
                        - match: { path: "/" }
                          direct_response:
                            status: 200
                            body: { inline_string: "fixture-0018-direct-response-OK\n" }
                        - match: { path: "/public" }
                          direct_response:
                            status: 200
                            body: { inline_string: "fixture-0018-direct-response-OK\n" }
                        - match: { path: "/api" }
                          direct_response:
                            status: 200
                            body: { inline_string: "fixture-0018-direct-response-OK\n" }
                        - match: { prefix: "/protected" }
                          route: { cluster: c_backend_b }
                        - match: { path: "/per-route-disabled" }
                          direct_response:
                            status: 200
                            body: { inline_string: "fixture-0018-direct-response-OK\n" }
                          typed_per_filter_config:
                            envoy.filters.http.rbac:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBACPerRoute
                              # rbac field intentionally absent → 7th
                              # canonical disabled per ADR-0125 §(xii) case (a).
                        - match: { path: "/per-route-override" }
                          direct_response:
                            status: 200
                            body: { inline_string: "fixture-0018-direct-response-OK\n" }
                          typed_per_filter_config:
                            envoy.filters.http.rbac:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBACPerRoute
                              rbac:
                                rules_stat_prefix: override
                                shadow_rules_stat_prefix: override_shadow
                                rules:
                                  action: DENY
                                  policies:
                                    guests:
                                      permissions: [{ any: true }]
                                      principals:
                                        - header: { name: X-User, string_match: { exact: guest } }
                                shadow_rules:
                                  action: DENY
                                  policies:
                                    guests:
                                      permissions: [{ any: true }]
                                      principals:
                                        - header: { name: X-User, string_match: { exact: guest } }
                http_filters:
                  - name: envoy.filters.http.rbac
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBAC
                      rules_stat_prefix: default
                      shadow_rules_stat_prefix: default
                      rules:
                        action: ALLOW
                        policies:
                          admin_users:
                            permissions: [{ any: true }]
                            principals:
                              - header: { name: X-User, string_match: { exact: admin } }
                          public_paths:
                            permissions:
                              - url_path: { path: { exact: /public } }
                            principals: [{ any: true }]
                          tenant_api_users:
                            # AND[url_path /api, header X-Tenant=acme] —
                            # exercises Permission_AndRules + header + url_path
                            # canonical evaluators. Replaces the BRAINSTORM
                            # destination_port-based scenario 4 policy per
                            # Task-14 fixture redesign: the envoy-go MVP
                            # stubs DestinationPort()->0 so a destination_port
                            # permission cannot allow on the envoy-go side;
                            # the AND-composite over header + url_path
                            # exercises the same canonical evaluators with
                            # accessors that are plumbed at the MVP. The
                            # destination_port canonical remains covered by
                            # unit tests at Group 3 (TestEvaluatePermission_DestinationPort).
                            permissions:
                              - and_rules:
                                  rules:
                                    - url_path: { path: { exact: /api } }
                                    - header: { name: X-Tenant, string_match: { exact: acme } }
                            principals: [{ any: true }]
                          internal_or_protected:
                            # OR[url_path /protected, header X-Internal=true]
                            # — exercises Principal_OrIds-equivalent on the
                            # permission side (Permission_OrRules) +
                            # header/url_path canonicals. Replaces the
                            # BRAINSTORM direct_remote_ip-based scenario 5
                            # policy per Task-14 fixture redesign: envoy-go
                            # MVP stubs DirectRemoteIP()->nil so a
                            # direct_remote_ip principal cannot allow on
                            # the envoy-go side. The direct_remote_ip
                            # canonical remains covered by unit tests at
                            # Group 4 (TestEvaluatePrincipal_DirectRemoteIP).
                            permissions:
                              - or_rules:
                                  rules:
                                    - url_path: { path: { prefix: /protected } }
                                    - header: { name: X-Internal, string_match: { exact: "true" } }
                            principals: [{ any: true }]
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

    # === l_test_b — echo-backend listener (cluster c_backend_b target) ===
    # Carries the echobackend HTTP/1.1 backend behind a vanilla HCM with
    # router only (no RBAC). Cluster c_backend_b's STRICT_DNS endpoint
    # resolves to host.docker.internal:<BackendPort> per ADR-0010.
    - name: l_test_b
      address: { socket_address: { address: 0.0.0.0, port_value: {{.LBTestPort}} } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP1
                stat_prefix: hcm_local_b
                route_config:
                  name: rc_test_b
                  virtual_hosts:
                    - name: vh_test_b
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: c_backend_b }
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

    # === l_test_a_tls — mTLS-required HCM ===
    # Mirrors l_test_a's filter chain + adds the authenticated_admin policy
    # (Principal_Authenticated matching the client cert URI SAN
    # spiffe://example.com/admin) + the /admin route. transport_socket
    # carries DownstreamTlsContext with the fixture-CA validation context +
    # require_client_certificate=true (per SPEC §7.2 + ADR-0144).
    - name: l_test_a_tls
      address: { socket_address: { address: 0.0.0.0, port_value: {{.LATestTLSPort}} } }
      filter_chains:
        - transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
              require_client_certificate: true
              common_tls_context:
                tls_certificates:
                  - certificate_chain: { filename: "{{.ServerCert}}" }
                    private_key: { filename: "{{.ServerKey}}" }
                validation_context:
                  trusted_ca: { filename: "{{.CACert}}" }
          filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP1
                stat_prefix: hcm_local_a_tls
                route_config:
                  name: rc_test_a_tls
                  virtual_hosts:
                    - name: vh_test_a_tls
                      domains: ["*"]
                      routes:
                        - match: { path: "/admin" }
                          direct_response:
                            status: 200
                            body: { inline_string: "fixture-0018-direct-response-OK\n" }
                http_filters:
                  - name: envoy.filters.http.rbac
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBAC
                      rules_stat_prefix: default
                      shadow_rules_stat_prefix: default
                      rules:
                        action: ALLOW
                        policies:
                          admin_users:
                            permissions: [{ any: true }]
                            principals:
                              - header: { name: X-User, string_match: { exact: admin } }
                          public_paths:
                            permissions:
                              - url_path: { path: { exact: /public } }
                            principals: [{ any: true }]
                          tenant_api_users:
                            permissions:
                              - and_rules:
                                  rules:
                                    - url_path: { path: { exact: /api } }
                                    - header: { name: X-Tenant, string_match: { exact: acme } }
                            principals: [{ any: true }]
                          internal_or_protected:
                            permissions:
                              - or_rules:
                                  rules:
                                    - url_path: { path: { prefix: /protected } }
                                    - header: { name: X-Internal, string_match: { exact: "true" } }
                            principals: [{ any: true }]
                          authenticated_admin:
                            permissions:
                              - url_path: { path: { exact: /admin } }
                            principals:
                              - authenticated:
                                  principal_name: { exact: "spiffe://example.com/admin" }
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: c_backend_b
      type: STRICT_DNS
      connect_timeout: 1s
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: c_backend_b
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: {{.BackendHost}}, port_value: {{.BackendPort}} }
