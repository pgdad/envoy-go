# Phase-36.1 fixture 0061-lb-ring-hash: differential expectations.
#
# A cross-side [tcp_proxy] fixture over ONE 3-endpoint cluster with lb_policy:
# RING_HASH + ring_hash_lb_config: {} (defaults) + the tcp_proxy hash_policy:
# [{source_ip: {}}] on BOTH sides. The driver binds 16 connections to each of 16
# source IPs (127.0.0.2..17 via net.Dialer.LocalAddr), 256 total. The FIRST
# consistent-hash fixture; the FIRST non-zero LB-stat delta (+3 gauges).
#
# response-body: byte-exact required. The streaming TCPEcho backend reflects bytes
# verbatim, so the concatenated echo stream is byte-equivalent across the two
# proxies regardless of WHICH endpoint serves WHICH connection (the ring pick
# differs per side — the subject spreads by source IP, the reference collapses to
# one backend via Docker NAT — but the bytes do not).
#
# response-status / response-headers / response-trailers: N/A (TCP, not HTTP).
#
# Admin /ready observation is exercised by the runner's compareAdminResponses path
# (phase-01 baseline; same allow-list as fixture 0000).
#
# Distribution assertion (driver's AssertDistribution via the DistributionAsserter
# interface): the aggregate-count MODULAR INVARIANT (D-S36-4). The AFFINITY and
# CONSERVATION legs are DETERMINISTIC/EXACT, NOT a σ-band. The SPREAD leg is NOT: it
# is PROBABILISTIC. The ring is keyed on each backend's EPHEMERAL-PORT address, which
# the harness re-allocates per run, so every run draws a fresh random 3-way partition
# and P(collapse) <= 3^(1-16) = 7.0e-8 — a 5.27σ-equivalent margin (ADR-0298). That
# figure is ANALYTIC/EXTRAPOLATED, NOT measured: K=16 is unmeasurable at feasible
# scale (expected count 0.014 over 2e5 draws; 0/200000 bounds the rate at ~1.5e-5
# only). And 3^(1-K) is a CONSERVATIVE UPPER BOUND, not "the" probability —
# measured/analytic is 0.949 at K=4 and 0.689 at K=8. The bound is measured at those
# K by internal/cluster's TestRingHash_EphemeralPortRing_KeyCollapseRate, which the
# fixture package's TestSourceIPsLinkedToCollapseFixtureK pins to sourceIPs:
#   - SUBJECT affinity: each per-backend count ≡ 0 mod 16 (one source IP → one key →
#     one ring point → one backend; a source IP contributes all 16 or 0 to a backend)
#   - SUBJECT spread:   >= 2 backends nonzero (16 keys over 3 backends covering ≥2)
#   - SUBJECT conservation: c1 + c2 + c3 == 256
#   - REFERENCE conservation only: sum == 256 (Docker NAT → single gateway source IP →
#     single-key pin → all 256 on ONE backend; cross-side host identity INFEASIBLE —
#     AMEND-RH8 / reference_differential_hash_key_cross_side_infeasible)
#
# Stats assertion (driver's AssertStats via the StatsAsserter interface; SPEC §7):
#   - cross-equal: cluster.c_echo.upstream_cx_total == 256,
#                  cluster.c_echo.membership_total == 3,
#                  cluster.c_echo.upstream_cx_active == 0 (quiesced post-drain),
#                  cluster.c_echo.ring_hash_lb.size == 1026,
#                  cluster.c_echo.ring_hash_lb.min_hashes_per_host == 342,
#                  cluster.c_echo.ring_hash_lb.max_hashes_per_host == 342
#     (the 3 gauges depend ONLY on ring-config + host COUNT, NOT addresses → identical
#      on both sides — a STRONG cross-side prong)
#   - per-side:    cluster.c_echo.upstream_rq_total (ref 256 / subj 0 — tcp_proxy
#                  charges rq-per-cx on the reference; envoy-go's tcpproxy path never
#                  Inc's upstream_rq_total)
response-body:
  applicable: true
  scope: byte-exact
